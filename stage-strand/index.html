r_000002":"stays","char_000001":"arrives"},"events":[{"text":"美琴利用磁力贴在人行天桥底部，与同伴一起甩开了桥上桥下的视线，并向身边那位水火不容的同伴询问刚才发生的事。","moves":[]},{"text":"美琴质疑：假如某人突然获得特别的力量，真的会直接用来杀人吗；她指出安娜的话语缺乏魅力、外表可疑，因此想确认刚才的事里是否存在某种“介入”的信号。","moves":[]},{"text":"女王用一句话否定美琴的猜测，说对方所做的只不过是谈话，但补充说若安娜事先掌握了目标的个人情报，尤其是其自卑感、心灵创伤与精神紧张等内部问题，事情就不一样了。","moves":[]},{"text":"美琴想到R&C超自然公司：这家凭空出现的新型巨大IT企业接受全世界的占卜委托，暗中收集委托者及其在意之人的姓名、性别、年龄、生日、血型等个人情报，并可利用这些情报进行心理分析与精神干涉。","moves":[]},{"text":"安娜·施普伦格尔带着残酷的笑声谈起心理学上个体与群体的概念，声称只要从集体中挑出几个人激励，所有人就会朝同一方向一拥而上，操纵群体比操纵个人容易得多。","moves":[]},{"text":"传来咕嘟声，美琴做好应对准备，但预想中的“泥石流”并未袭来；她破解附近街道摄像头把画面投到手机屏幕上，看到头戴针织帽的少女捂住嘴角，红黑色粘稠血液从指间溢出滴落。","moves":[]},{"text":"使用魔法的少女突然吐血倒地，周围其他使用过魔法的男女也相继口吐鲜血倒下，出现血管破裂、眼白染红等异状。","moves":[]},{"text":"由于无人理解魔法的机制，恐慌中的人们开始臆测，将原因归咎于第三位的美琴，怨恨与敌意蔓延。","moves":[]},{"text":"人群中有人叫喊称美琴使用了电磁波、电解等手段，甚至声称要是不干掉她就会被干掉，敌意进一步升级。","moves":[]},{"text":"美琴因怀疑而呼吸一滞，食蜂也带着怀疑的目光用颤抖的声音询问美琴是否做了有愧于心的事；美琴恼怒地否认，但焦躁并未消除。","moves":[]},{"text":"叙述指出连美琴和食蜂这样的顶点能力者也无法理解刚刚发生的事，无法完全否定自身过失导致事件的可能性。","moves":[]},{"text":"美琴抱着食蜂用磁力从人行天桥底部荡出，刚刚所在的位置随即被闪光与高温吞没，天桥被熔断倾斜。","moves":[{"person":"char_000003","how":"dragged","spot":"rooftop","path":[1242,1114,1115,1243,1371,1499,1627,1755,1883,2011,2139,2267,2395,2523,2651,2779,2907,3035,3163,3291,3419,3547,3675,3803,3931,4058,4185,4313,4441,4569,4570,4698,4826,4955,5083,5212,5340,5468,5596,5723,5850,5977,6105,6233,6360,6487,6614,6741,6740,6739,6866,6994,7122,7250,7378,7506,7634,7762,7889,8016,8143,8142,8269,8397,8525,8653,8781,8909,9037,9038,9167,9296,9425,9553,9681,9809,9937,10065,10193,10321,10449,10578,10579,10580,10581,10582,10583,10584,10585,10586,10587,10588,10589,10590,10462,10335,10207,10079,9951,9823,9695,9567,9439,9311,9183,9055,8927,8799,8671,8543,8415,8286,8157,16541],"ensemble":[[1242,1370,1498,1626,1755,1883,2010,2137,2265,2394,2523,2651,2779,2907,3035,3163,3291,3419,3546,3674,3802,3930,4057,4185,4313,4441,4570,4698,4826,4954,5083,5212,5340,5467,5595,5723,5850,5977,6104,6231,6359,6487,6614,6613,6612,6611,6610,6737,6865,6992,7119,72 ，连走都走不动了。","moves":[]},{"text":"食蜂操祈无暇顾及机器，眼前的支柱仿佛断成两截，若在此被击溃，两人的“退而求其次”作战将化为泡影。","moves":[]},{"text":"食蜂发现倒在路边、被救护车躲开的“障碍物”正是御坂美琴，呼唤她却没有回应。","moves":[]},{"text":"细微的脚步声传来，食蜂意识到“那家伙”要来了，再次呼喊御坂仍无回应，只剩警笛声攥紧她的心脏。","moves":[]}]},{"id":"scene_000055","place":"loc_000003","label":null,"starts":{},"from":{},"events":[{"text":"仅出现数字“4”，无叙事内容。","moves":[]}]},{"id":"scene_000056","place":"loc_000003","label":null,"starts":{},"from":{},"events":[{"text":"“哼、哼、哼哼……”，只有哼声，未交代说话人及情境。","moves":[]}]},{"id":"scene_000059","place":"loc_000003","label":"食蜂操祈一边控制FIVE_Over与遥控器，一边权衡选项作出决断，让半报废的Modelcase“Mental Out”飞向安娜·施普伦格尔，并用遥控器猛击御坂美琴太阳穴想唤醒她。此举只是走投无路的赌博。安娜已站在倒下的美琴身旁，一脚踢中食蜂侧腹，令其呼吸困难、翻滚在地。","starts":{"char_000006":10598,"char_000002":10469,"char_000003":10447,"char_000001":10969},"from":{"char_000006":"stays","char_000002":"stays","char_000003":"stays","char_000001":"arrives"},"events":[{"text":"食蜂操祈躲在横躺的姬蜂型超级兵器背面，背靠混凝土墙屏息思考，认识到御坂美琴已完全丧失战斗能力，己方没有直接战力。","moves":[]},{"text":"食蜂操祈用非惯用手像操控提线木偶般动指驱动半报废的FIVE_Over“Modelcase Mental Out”，却发现兵器已无法全力飞行，顶多拖着变形铁块跑，会成安娜的活靶子。","moves":[]},{"text":"食蜂操祈担心那种怪物闯入医院，决定必须保证安全——既包括自己和上条，也包括无辜的患者与职员，因此今天要遵循少年的准则。","moves":[]},{"text":"食蜂操祈意识到安娜·施普伦格尔强大到绝非第五位“心理掌握”能单独应对，无论打赢还是逃跑都没有可能。","moves":[]},{"text":"食蜂操祈取出小镜子在暗处观察情况，看到御坂美琴一动不动地倒在地上，无法判断她是否还有意识。","moves":[]},{"text":"食蜂操祈认识到自己与安娜之间短短的无遮蔽距离就是死亡地带，一旦迈出一步便必死无疑。","moves":[]},{"text":"食蜂操祈懊恼于自己对失去意识的御坂美琴无法操纵，指令全被弹开。","moves":[]},{"text":"细微的脚步声传来，食蜂操祈慌忙收起小镜子；她将安娜·施普伦格尔认清为会把生者拖入黑暗的彼岸之主。","moves":[]},{"text":"食蜂操祈明白安娜只将挡在她与医院连线上的存在屠戮殆尽，袭击美琴和自己只是因她们挡路；她判断自己必须设法让安娜分神才能逃走。","moves":[]},{"text":"食蜂操祈排除让半报废的FIVE_Over冲向安娜的方案，转而以冰冷神色决定利用御坂美琴作为最切实的一招。","moves":[]},{"text":"食蜂操祈分析安娜潜意识更警戒有物理杀伤力的第三名而非能力无效的第五名，并握紧遥控器盘算即使御坂无意识、全力打入指令也能让身体起反应。","moves":[]},{"text":"食蜂操祈静靠在废铁边，意识到安娜的压倒性强大，脑中数十个选项都无法提高生存可能，感到一阵脱力。","moves":[]},{"text":"食蜂操祈质疑自己为何要顾虑御坂美琴、为她产生罪恶感，认为对方并非自己派阀成员，自己没有义务。","moves":[]},{"text":"食蜂操祈盘算撤出方案，判断FIVE_Over已濒临报废只能最后行动一次，并设想放弃倒下的御坂美琴、趁安娜转向时让FIVE_Over侧面杀出的冷酷选择。","moves":[]},{"text":"安娜·施普伦格尔踩着积雪的脚步声逼近，像货运列车一样 <script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const data = JSON.parse(document.getElementById("strand-data").textContent || "null");
const $ = (id) => document.getElementById(id);
if (!data) { $("title").textContent = "No strand in this page."; throw new Error("no data"); }
$("title").textContent = data.title;
const CELL = 0.5, DEMO = 3, READ = 2.1, CARD = 2.0;
const SPEED = { walk: 1.4, run: 3.6, sneak: 0.8, "climb up": 1.1, "go down": 1.4, fall: 1.6, dragged: 1.2 };
const COLOR = { hall: 0x1d4a5c, corridor: 0x1d4a5c, lobby: 0x24607a, living: 0x2b5f4a, kitchen: 0x5c5326, dining: 0x5c4a26, bedroom: 0x4a3460, bath: 0x2d4566, classroom: 0x3d3a66, office: 0x5a3a3a, toilet: 0x2d4566, storage: 0x333b44, stair: 0x8a5a26, shop: 0x4f4a24, ward: 0x34485e, platform: 0x24607a };

// Node positions per place: ground cells first, then roof cells lot by lot (the exporter's order).
for (const place of Object.values(data.places)) {
  place.roof = [];
  for (const lot of place.lots) for (let j = Math.round(lot.rect.z / CELL); j < Math.round((lot.rect.z + lot.rect.depth) / CELL); j++) for (let i = Math.round(lot.rect.x / CELL); i < Math.round((lot.rect.x + lot.rect.width) / CELL); i++) place.roof.push([j * place.cols + i, lot.height, lot]);
}
const at = (place, node) => {
  const N = place.cols * place.rows;
  if (node < N) return { x: (node % place.cols + 0.5) * CELL, z: (Math.floor(node / place.cols) + 0.5) * CELL, y: 0, lot: null };
  const [cell, y, lot] = place.roof[node - N];
  return { x: (cell % place.cols + 0.5) * CELL, z: (Math.floor(cell / place.cols) + 0.5) * CELL, y, lot };
};
/** A move's timing: each step at the manner's pace; climbs at stair pace, falls in free fall. */
const timing = (place, move) => {
  if (move.how === "teleport") return { total: 0.8, steps: [0, 0.8] };
  const steps = [0], speed = SPEED[move.how] || 1.4;
  for (let k = 1; k < move.path.length; k++) {
    const a = at(place, move.path[k - 1]), b = at(place, move.path[k]), rise = b.y - a.y, run = Math.hypot(b.x - a.x, b.z - a.z);
    steps.push(steps[k - 1] + (rise > 0 ? rise / 1.2 : rise < 0 ? (run ? Math.sqrt(-2 * rise / 9.8) : -rise / 2) : run / speed));
  }
  return { total: steps.at(-1) / DEMO, steps: steps.map((s) => s / DEMO) };
};

// The timeline: a card per scene, then its events, each as long as its slowest move or long enough to read.
const segments = [];
let clock = 0;
for (const [index, scene] of data.scenes.entries()) {
  const place = data.places[scene.place], positions = { ...scene.starts };
  segments.push({ kind: "card", scene, index, place, start: clock, end: clock + CARD, positions: { ...positions }, moves: [] });
  clock += CARD;
  for (const [eventIndex, event] of scene.events.entries()) {
    const moves = event.moves.map((move) => ({ ...move, time: timing(place, move) }));
    const length = Math.max(READ, ...moves.map((move) => move.time.total + 0.6));
    segments.push({ kind: "event", scene, index, eventIndex, event, place, start: clock, end: clock + length, positions: { ...positions }, moves });
    for (const move of moves) positions[move.person] = move.path.at(-1);
    clock += length;
  }
}
const total = clock;
const segmentAt = (t) => { let low = 0, high = segments.length - 1; while (low < high) { const mid = (low + high + 1) >> 1; if (segments[mid].start <= t) low = mid; else high = mid - 1; } return segments[low]; };

// The 3D stage.
const host = $("stage"), renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
host.prepend(renderer.domElement);
const world = new THREE.Scene();
world.background = new THREE.Color(0x060c12);
world.fog = new THREE.Fog(0x060c12, 90, 210);
world.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(30, 60, 20); world.add(sun);
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 12; controls.maxDistance = 160;
const resize = () => { const { clientWidth: w, clientHeight: h } = host; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
new ResizeObserver(resize).observe(host);

function label(text, color = "#ffffff", size = 28) {
  const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d"), font = `600 ${size}px system-ui, "PingFang SC", sans-serif`;
  ctx.font = font;
  const width = Math.ceil(ctx.measureText(text).width) + 16;
  canvas.width = width; canvas.height = size + 14;
  ctx.font = font; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(6,12,18,.65)"; ctx.fillRect(0, 0, width, canvas.height);
  ctx.fillStyle = color; ctx.fillText(text, 8, canvas.height / 2);
  const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true }));
  sprite.scale.set(width / canvas.height * 1.2, 1.2, 1); sprite.renderOrder = 10;
  return sprite;
}
const flat = (w, d, color, opacity) => { const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1 })); mesh.rotation.x = -Math.PI / 2; return mesh; };

/** A place as a hologram: streets and plaza, each building's ground floor (rooms, walls) under its floors and roof, clutter as snow. */
const built = new Map();
function buildPlace(id) {
  if (built.has(id)) return built.get(id);
  const place = data.places[id], group = new THREE.Group(), cx = place.width / 2, cz = place.depth / 2;
  const put = (object, x, y, z) => { object.position.set(x - cx, y, z - cz); group.add(object); return object; };
  put(flat(place.width, place.depth, 0x0c1822, 1), cx, 0, cz);
  for (const [key, rect] of Object.entries(place.streets)) put(flat(rect.width, rect.depth, key === "plaza" ? 0x173444 : 0x112532, 1), rect.x + rect.width / 2, 0.01, rect.z + rect.depth / 2);
  for (const [x, z, w, d, use] of place.rooms) put(flat(w, d, COLOR[use] ?? 0x333b44, 0.6), x + w / 2, 0.02, z + d / 2);
  // Ground-floor walls, translucent, 2.6 m, with a bright top edge.
  const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0x7ce6ff, transparent: true, opacity: 0.28, depthWrite: false }), place.walls.length), matrix = new THREE.Matrix4();
  place.walls.forEach(([x1, z1, x2, z2], index) => { const length = Math.hypot(x2 - x1, z2 - z1); matrix.compose(new THREE.Vector3((x1 + x2) / 2 - cx, 1.3, (z1 + z2) / 2 - cz), new THREE.Quaternion(), new THREE.Vector3(x1 === x2 ? 0.1 : length, 2.6, x1 === x2 ? length : 0.1)); walls.setMatrixAt(index, matrix); });
  group.add(walls);
  group.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(place.walls.flatMap(([x1, z1, x2, z2]) => [x1 - cx, 2.6, z1 - cz, x2 - cx, 2.6, z2 - cz]), 3)), new THREE.LineBasicMaterial({ color: 0x7ce6ff, transparent: true, opacity: 0.9 })));
  // Clutter: percolation's blocked cells.
  const clutter = new THREE.InstancedMesh(new THREE.BoxGeometry(0.34, 0.3, 0.34), new THREE.MeshLambertMaterial({ color: 0x9fb4c3, transparent: true, opacity: 0.55 }), place.clutter.length);
  place.clutter.forEach((cell, index) => { matrix.makeTranslation((cell % place.cols + 0.5) * CELL - cx, 0.15, (Math.floor(cell / place.cols) + 0.5) * CELL - cz); clutter.setMatrixAt(index, matrix); });
  group.add(clutter);
  // Buildings: the volume's edges, a line per floor, the roof.
  const roofs = new Map();
  for (const lot of place.lots) {
    const { x, z, width, depth } = lot.rect;
    put(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(width, lot.height, depth)), new THREE.LineBasicMaterial({ color: lot.label ? 0xffffff : 0x7ce6ff, transparent: true, opacity: lot.label ? 0.7 : 0.45 })), x + width / 2, lot.height / 2, z + depth / 2);
    const slabs = [];
    for (let y = 3; y < lot.height; y += 3) slabs.push(x, y, z, x + width, y, z, x + width, y, z, x + width, y, z + depth, x + width, y, z + depth, x, y, z + depth, x, y, z + depth, x, y, z);
    if (slabs.length) put(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(slabs, 3)), new THREE.LineBasicMaterial({ color: 0x7ce6ff, transparent: true, opacity: 0.16 })), 0, 0, 0);
    roofs.set(lot, put(flat(width, depth, 0x7ce6ff, 0.06), x + width / 2, lot.height, z + depth / 2));
    if (lot.label) put(label(lot.label), x + width / 2, lot.height + 2.2, z + depth / 2);
  }
  for (const [text, rect] of [["avenue", place.streets.avenue], ["plaza", place.streets.plaza], ["north street", place.streets.north]]) put(label(text, "#8aa0b0", 22), rect.x + rect.width / 2, 0.6, rect.z + rect.depth / 2).scale.multiplyScalar(0.8);
  const entry = { group, roofs, cx, cz };
  built.set(id, entry);
  return entry;
}

// People: a glowing pawn and a name each; a shadow when off the ground.
const pawns = new Map();
for (const [id, person] of Object.entries(data.people)) {
  const color = new THREE.Color(person.color), pawn = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.9, 4, 12), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.65, transparent: true }));
  body.position.y = 0.78; pawn.add(body);
  const halo = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.75, 24), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false })); halo.rotation.x = -Math.PI / 2; halo.position.y = 0.04; pawn.add(halo);
  const name = label(person.name, person.color, 26); name.position.y = 2.4; pawn.add(name);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.5, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false })); shadow.rotation.x = -Math.PI / 2; shadow.visible = false;
  world.add(shadow);
  pawns.set(id, { pawn, body, shadow });
}

let shownPlace = null, shownSegment = null, pathLines = [], time = 0, speed = 2, playing = true, follow = true, last = performance.now(), shownScene = -1;
function frameCamera(place) {
  const span = Math.max(place.width, place.depth);
  camera.position.set(span * 0.42, span * 0.85, span * 0.95);
  controls.target.set(0, 2, 0); controls.update();
}
function showPaths(segment, entry) {
  for (const line of pathLines) world.remove(line.object);
  pathLines = [];
  for (const move of segment.moves) {
    const color = new THREE.Color(data.people[move.person].color);
    const points = (nodes) => nodes.flatMap((node) => { const p = at(segment.place, node); return [p.x - entry.cx, p.y + 0.12, p.z - entry.cz]; });
    const add = (nodes, material, ensemble) => { const object = new THREE.Line(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(points(nodes), 3)), material); world.add(object); pathLines.push({ object, move, ensemble }); };
    for (const other of move.ensemble) add(other, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.22, depthWrite: false }), true);
    if (move.how !== "teleport") add(move.path, new THREE.LineBasicMaterial({ color }), false);
  }
}
function position(place, move, elapsed) {
  const steps = move.time.steps;
  if (move.how === "teleport") { const p = at(place, elapsed < 0.4 ? move.path[0] : move.path[1]); return { ...p, fade: Math.min(1, Math.abs(elapsed - 0.4) / 0.4), k: 2 }; }
  if (elapsed >= steps.at(-1)) return { ...at(place, move.path.at(-1)), k: move.path.length };
  let k = 1; while (k < steps.length - 1 && steps[k] < elapsed) k++;
  const a = at(place, move.path[k - 1]), b = at(place, move.path[k]), f = Math.min(1, Math.max(0, (elapsed - steps[k - 1]) / Math.max(1e-6, steps[k] - steps[k - 1])));
  return { x: a.x + (b.x - a.x) * f, z: a.z + (b.z - a.z) * f, y: a.y + (b.y - a.y) * f, lot: b.lot || a.lot, k };
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) { time += dt * speed; if (time >= total) time = 0; }
  const segment = segmentAt(time), place = segment.place, elapsed = time - segment.start, entry = buildPlace(segment.scene.place);
  if (shownPlace !== segment.scene.place) {
    if (shownPlace) { world.remove(built.get(shownPlace).group); $("fade").style.opacity = 1; setTimeout(() => { $("fade").style.opacity = 0; }, 260); }
    world.add(entry.group); shownPlace = segment.scene.place; frameCamera(place);
  }
  if (segment !== shownSegment) { shownSegment = segment; showPaths(segment, entry); }
  if (segment.index !== shownScene) {
    shownScene = segment.index;
    $("crumb").textContent = place.path.join(" › ") + ` · ${place.kind} of ${place.lots.length} buildings`;
    $("scene").textContent = `Scene ${segment.index + 1} of ${data.scenes.length}` + (segment.scene.label ? ` · ${segment.scene.label}` : "");
    const status = { stays: "stays on", arrives: "arrives", enters: "enters" };
    $("people").replaceChildren(...Object.entries(segment.scene.from).map(([person, from]) => { const chip = document.createElement("span"); chip.style.setProperty("--c", data.people[person].color); chip.textContent = `${data.people[person].name} · ${status[from]}`; return chip; }));
  }
  $("event").textContent = segment.kind === "card" ? (segment.scene.label || segment.scene.events[0]?.text || "") : segment.event.text;
  $("count").textContent = segment.kind === "card" ? `scene ${segment.index + 1}/${data.scenes.length}` : `scene ${segment.index + 1}/${data.scenes.length} · event ${segment.eventIndex + 1}/${segment.scene.events.length}`;
  if (document.activeElement !== $("seek")) $("seek").value = Math.round(time / total * 1000);

  // Everyone in the scene: movers along their sampled walks, the rest where the last event left them.
  const present = new Set(Object.keys(segment.scene.starts)), raised = new Set(), movers = [];
  for (const [id, { pawn, body, shadow }] of pawns) {
    const move = segment.moves.find((entry) => entry.person === id), node = segment.positions[id];
    const p = !present.has(id) ? null : move ? position(place, move, elapsed) : node == null ? null : at(place, node);
    if (!p) { if (pawn.parent) world.remove(pawn); shadow.visible = false; continue; }
    if (!pawn.parent) world.add(pawn);
    pawn.position.set(p.x - entry.cx, p.y, p.z - entry.cz);
    body.material.opacity = p.fade ?? 1;
    shadow.visible = p.y > 0.2; shadow.position.set(p.x - entry.cx, 0.03, p.z - entry.cz);
    if (p.y > 0.2 && p.lot) raised.add(p.lot);
    if (move) { movers.push(pawn.position); for (const line of pathLines) if (line.move === move && !line.ensemble) line.object.geometry.setDrawRange(0, Math.max(1, p.k)); }
  }
  for (const [lot, roof] of entry.roofs) { roof.material.opacity = raised.has(lot) ? 0.28 : 0.06; roof.material.color.set(raised.has(lot) ? 0xffd36e : 0x7ce6ff); }
  for (const line of pathLines) if (line.ensemble) line.object.material.opacity = 0.22 * Math.min(1, elapsed / 0.5);
  // Follow: ease the orbit's centre toward whoever is moving.
  if (follow && movers.length) { const centre = movers.reduce((sum, p) => sum.add(p), new THREE.Vector3()).divideScalar(movers.length); controls.target.lerp(new THREE.Vector3(centre.x, 2, centre.z), 0.03); }
  controls.update();
  renderer.render(world, camera);
  requestAnimationFrame(frame);
}

$("play").addEventListener("click", () => { playing = !playing; $("play").textContent = playing ? "⏸ Pause" : "▶ Play"; });
$("follow").addEventListener("click", () => { follow = !follow; $("follow").setAttribute("aria-pressed", String(follow)); if (!follow) controls.target.set(0, 2, 0); });
for (const button of document.querySelectorAll("[data-speed]")) button.addEventListener("click", () => { speed = Number(button.dataset.speed); for (const other of document.querySelectorAll("[data-speed]")) other.setAttribute("aria-pressed", String(other === button)); });
$("seek").addEventListener("input", () => { time = Number($("seek").value) / 1000 * total; });
const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const places = Object.values(data.places), moveCount = data.scenes.reduce((n, s) => n + s.events.reduce((m, e) => m + e.moves.length, 0), 0);
$("how").innerHTML = [
  `<b>One strand of the timeline.</b> ${data.scenes.length} scenes in story order. People keep their place and heading from scene to scene along their own world line ("stays on"), or arrive from elsewhere.`,
  `<b>Places from the place tree.</b> ${places.map((p) => `${esc(p.label)} (${p.kind}, ${p.lots.length} buildings)`).join(", ")}. Each is composed of architectures: its building children (named) take the largest lots, generated buildings fill the rest, each laid out around its hall or corridor and stair core.`,
  `<b>Percolation.</b> Clutter (snow, crowds, furniture: the small blocks) closes each cell independently, 12% outdoors and 8% inside, never in a doorway; a draw that cuts any room off from the avenue is redrawn (${places.map((p) => p.percolation.attempts).join(", ")} draws here).`,
  `<b>Path integral.</b> Each of the ${moveCount} moves is one exact draw from all walks to its destination, weighted e^(−S/T): metres walked, climbs ×${data.lambda}, a turning cost κ=${data.kappa}, T=${data.T} (under the convergence bound). Faint lines are other draws from the same ensemble. Roofs are reached by stair cores, crossed by jumps over alleys, and left by falls.`,
  `<b>Where moves end.</b> Who moves where and how comes from Jev's answers in the book's movement run (typed spot choices); the path engine fills in the way. Upper floors are drawn as outlines: only ground floors and roofs are walkable so far.`,
].map((item) => `<li>${item}</li>`).join("");
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
