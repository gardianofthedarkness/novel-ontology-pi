const laneInfo = new Map(laneOrder.map(k => [k, { key: k, units: [], people: new Map(), books: new Set() }]));
for (const u of units) { const info = laneInfo.get(u.lane); info.units.push(u); info.books.add(u.book); for (const p of u.people) info.people.set(p, (info.people.get(p) ?? 0) + 1); }
const topPeople = info => [...info.people.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(([p]) => p.replace(/（.*?）|\(.*?\)/g, ""));
// What became of a lane: carried on, closed at the next book, joined another strand, or the book's own.
const fateOf = lane => {
  const info = laneInfo.get(lane), lastBook = [...info.books].at(-1), lastKey = [...decided.keys()].find(k => rootOf(k) === lane && k.startsWith(`${lastBook}:`)) ?? lane;
  if (info.books.size > 1) return { kind: "carried", text: `carried across ${info.books.size} books`, by: [...decided.values()].find(d => d.inherited && rootOf(d.candidate) === lane)?.by };
  if (closed.has(lastKey)) return { kind: "closed", text: `closed at ${label(closed.get(lastKey))}`, at: closed.get(lastKey) };
  if (mergedInto.has(lane)) return { kind: "merged", text: "joins another strand", into: rootOf(mergedInto.get(lane)) };
  return { kind: "own", text: `${label(lastBook)}'s own` };
};
const WHY = { work: "the work model read the two books' edges as one story going on", names: "the same people go on in it", hand: "set by hand" };

const dayNum = key => { const m = key.match(/(\d\d)-(\d\d)$/); return m ? Math.round((Date.UTC(2001, +m[1] - 1, +m[2]) - Date.UTC(2001, 0, 1)) / 864e5) : null; };
const between = [];
for (let n = 1; n < BOOKS.length; n++) {
  const a = units.filter(u => u.book === BOOKS[n - 1]).at(-1)?.date, b = units.find(u => u.book === BOOKS[n])?.date;
  const sameYear = a && b && a.split(":")[0] === b.split(":")[0], da = dayNum(a ?? ""), db = dayNum(b ?? "");
  between.push(sameYear && da !== null && db !== null ? Math.max(0, db - da - 1) : null);
}
const span = `${units[0]?.date.split(":").at(-1)} → ${units.at(-1)?.date.split(":").at(-1)}`;
$("stats").innerHTML = [`<span><b>${BOOKS.length}</b> books</span>`, `<span><b>${units.length}</b> units</span>`, `<span><b>${laneOrder.length}</b> strands</span>`,
  `<span><b>${laneOrder.filter(l => laneInfo.get(l).books.size > 1).length}</b> carried across</span>`, `<span>${span}${between.some(n => n !== null) ? ` · <b>${between.filter(n => n !== null).join(", ")}</b> days untold between` : ""}</span>`].join("");
$("books").innerHTML = DATA.books.map(b => `<a href="${encodeURI(b.book)}/?universe=../">${esc(b.label)} · World · Live ›</a>`).join("");
$("notes").textContent = `Runs: ${DATA.books.map(b => `${b.label} ${b.run}`).join(", ")}. The books line up by the dates their readings gave each unit; people are matched across books by name. A book's strands are its run's own until its kept step registers them. The books' words are left out.`;

let zoom = 1, picked = null, selected = null;
const draw = () => {
  const svg = $("chart"), scroller = $("scroller");
  const width = Math.max(320, scroller.clientWidth) * zoom;
  const LEFT = 22, RIGHT = 10, TOP = 30, ROW = 22, FOOT = 34, DAYGAP = 6, BOOKGAP = 54;
  const days = [];
  for (const u of units) { const last = days.at(-1); if (!last || last.date !== u.date || last.book !== u.book) days.push({ date: u.date, book: u.book, units: [] }); days.at(-1).units.push(u); }
  const gaps = days.reduce((sum, day, n) => sum + (n === 0 ? 0 : day.book !== days[n - 1].book ? BOOKGAP : DAYGAP), 0);
  const step = (width - LEFT - RIGHT - gaps) / units.length, H = TOP + laneOrder.length * ROW + FOOT;
  svg.setAttribute("viewBox", `0 0 ${width} ${H}`); svg.setAttribute("width", width); svg.setAttribute("height", H);
  svg.replaceChildren();
  const X = new Map(); let x = LEFT; const dayBox = [];
  days.forEach((day, n) => { if (n > 0) x += day.book !== days[n - 1].book ? BOOKGAP : DAYGAP; const x0 = x; for (const u of day.units) { X.set(u, x + step / 2); x += step; } dayBox.push({ ...day, x0, x1: x }); });
  const Y = lane => TOP + laneIndex.get(lane) * ROW + ROW / 2;
  const edges = BOOKS.map(book => { const boxes = dayBox.filter(d => d.book === book); return { book, x0: boxes[0].x0 - 3, x1: boxes.at(-1).x1 + 3 }; });
  edges.forEach((e, n) => {
    el("rect", { x: e.x0, y: 4, width: e.x1 - e.x0, height: H - 8, rx: 6, fill: css(n % 2 ? "--band-b" : "--band-a") }, svg);
    el("text", { x: e.x0 + 6, y: 17, "font-size": 11, "font-weight": 600, fill: css("--ink") }, svg).textContent = label(e.book);
    if (n > 0) { const a = edges[n - 1].x1, b = e.x0; el("rect", { x: a + 4, y: 4, width: Math.max(0, b - a - 8), height: H - 8, rx: 6, fill: css("--gapband") }, svg); el("text", { x: (a + b) / 2, y: H - 8, "text-anchor": "middle", "font-size": 9.5, fill: css("--dim") }, svg).textContent = between[n - 1] === null ? "?" : `${between[n - 1]} days`; }
  });
  let lastLabel = -Infinity;
  dayBox.forEach((day, n) => {
    if (n > 0 && day.book === dayBox[n - 1].book) el("line", { x1: day.x0 - DAYGAP / 2, x2: day.x0 - DAYGAP / 2, y1: TOP - 4, y2: H - FOOT + 4, stroke: css("--line"), "stroke-width": 1 }, svg);
    if (day.x0 - lastLabel > 40) { lastLabel = day.x0; el("text", { x: day.x0 + 1, y: H - FOOT + 17, "font-size": 10, "font-family": "ui-monospace, monospace", fill: css("--dim") }, svg).textContent = day.date.split(":").at(-1); }
  });
  for (const lane of laneOrder) {
    const info = laneInfo.get(lane), xs = info.units.map(u => X.get(u)), dim = picked && picked !== lane, y = Y(lane), colour = colorOf(lane), f = fateOf(lane);
    el("line", { x1: Math.min(...xs), x2: Math.max(...xs), y1: y, y2: y, stroke: colour, "stroke-width": 1.2, opacity: dim ? 0.1 : 0.35 }, svg);
    el("text", { x: LEFT - 6, y: y + 4, "text-anchor": "end", "font-size": 10, "font-family": "ui-monospace, monospace", fill: picked === lane ? colour : css("--dim") }, svg).textContent = laneIndex.get(lane) + 1;
    // A strand's start in each book it is in: branched from the lane told just before it (its first book), or carried in.
    const first = info.units[0];
    if (laneIndex.get(lane) > 0 && !(info.books.size > 1 && first === units.find(u => u.lane === lane))) {
      const told = units.filter(u => u.book === first.book).sort((a, b) => a.told - b.told), before = told.filter(u => u.told < first.told && u.lane !== lane).at(-1);
      const parent = before?.lane ?? laneOrder[0], x2 = X.get(first);
      el("path", { d: `M${x2 - 14} ${Y(parent)} Q${x2} ${Y(parent)} ${x2} ${y}`, fill: "none", stroke: colour, "stroke-width": 1, opacity: dim ? 0.1 : 0.6 }, svg);
    }
    if (f.kind === "merged" && laneIndex.has(f.into)) { const xl = X.get(info.units.at(-1)); el("path", { d: `M${xl} ${y} Q${xl} ${Y(f.into)} ${xl + 10} ${Y(f.into)}`, fill: "none", stroke: colour, "stroke-width": 1, "stroke-dasharray": "2 2", opacity: dim ? 0.1 : 0.7 }, svg); }
    if (f.kind === "closed") { const edge = edges[BOOKS.indexOf(f.at)], cx = edges[BOOKS.indexOf(f.at) - 1].x1 + 10; el("line", { x1: Math.max(...xs), x2: cx, y1: y, y2: y, stroke: colour, "stroke-width": 1, "stroke-dasharray": "2 3", opacity: 0.6 }, svg); for (const s of [-1, 1]) el("line", { x1: cx - 4, x2: cx + 4, y1: y - 4 * s, y2: y + 4 * s, stroke: colour, "stroke-width": 1.6 }, svg); el("text", { x: cx + 8, y: y + 3.5, "font-size": 9.5, fill: css("--dim") }, svg).textContent = "closed"; void edge; }
    if (f.kind === "carried") for (let n = 1; n < BOOKS.length; n++) {
      if (!info.books.has(BOOKS[n - 1]) || !info.books.has(BOOKS[n])) continue;
      const a = edges[n - 1].x1, b = edges[n].x0;
      el("line", { x1: a, x2: b, y1: y, y2: y, stroke: colour, "stroke-width": 2, "stroke-dasharray": "5 3", opacity: dim ? 0.15 : 0.9 }, svg);
      el("text", { x: (a + b) / 2, y: y - 6, "text-anchor": "middle", "font-size": 9.5, fill: colour }, svg).textContent = "carried";
    }
  }
  const w = Math.max(1.2, step * 0.8);
  units.forEach((u, k) => el("rect", { x: X.get(u) - w / 2, y: Y(u.lane) - 6, width: w, height: 12, rx: Math.min(1.5, w / 2), fill: colorOf(u.lane), opacity: picked && picked !== u.lane ? 0.15 : 0.95, "data-k": k }, svg));
  if (selected) { const xs = X.get(selected); el("line", { x1: xs, x2: xs, y1: TOP - 6, y2: H - FOOT + 4, stroke: css("--now"), "stroke-width": 1.6 }, svg); el("circle", { cx: xs, cy: TOP - 7, r: 3, fill: css("--now") }, svg); }
  svg.onclick = event => {
    const pt = svg.createSVGPoint(); pt.x = event.clientX; pt.y = event.clientY; const at = pt.matrixTransform(svg.getScreenCTM().inverse());
    const lane = laneOrder[Math.floor((at.y - TOP) / ROW)], pool = lane ? units.filter(u => u.lane === lane) : units;
    const near = pool.map(u => [u, Math.abs(X.get(u) - at.x)]).sort((a, b) => a[1] - b[1])[0];
    if (near) { selected = near[0]; renderDetail(); draw(); }
  };
};

const renderDetail = () => {
  const u = selected, box = $("detail");
  if (!u) { box.innerHTML = `<h2>Tap a bar</h2><p>Each bar is a unit of a book, where it stands on the story clock.</p>`; return; }
  const info = laneInfo.get(u.lane), f = fateOf(u.lane), colour = colorOf(u.lane);
  const carriedIn = f.kind === "carried" && u.book !== [...info.books][0];
  box.innerHTML = `
    <h2>${esc(label(u.book))} · unit ${Number(u.id)}</h2>
    <div class="meta"><span>${u.when?.startsWith("~") ? "about " : ""}${esc(u.date.split(":").at(-1))}${u.part ? ` · ${esc(u.part.replace("-", " "))}` : ""}</span><span style="color:${colour}">strand ${laneIndex.get(u.lane) + 1} · ${esc(f.text)}</span><span>${info.units.length} units in it</span></div>
    <div class="chips">${u.people.length ? u.people.map(p => `<span class="chip">${esc(p)}</span>`).join("") : `<span class="chip">no one named</span>`}</div>
    ${carriedIn ? `<p>Carried in from ${esc(label([...info.books][0]))}: ${esc(WHY[f.by] ?? "kept by the carry")}.</p>` : f.kind === "closed" ? `<p>${esc(label(f.at))} does not go on with it: no one of its last group acts as that book begins.</p>` : ""}
    <a class="play" href="${encodeURI(u.book)}/?unit=scene_${u.id}&amp;universe=../">Play in ${esc(label(u.book))} ›</a>`;
};
const renderKeys = () => {
  $("keys").innerHTML = laneOrder.map(lane => {
    const info = laneInfo.get(lane), f = fateOf(lane), who = topPeople(info).join(", ") || "no one named";
    const counts = BOOKS.map(b => [b, info.units.filter(u => u.book === b).length]).filter(([, c]) => c).map(([b, c]) => `${label(b)} ${c}`).join(" + ");
    return `<button class="lane-key" type="button" data-lane="${esc(lane)}" aria-pressed="${picked === lane}"><span class="sw" style="background:${colorOf(lane)}"></span><span><span class="t">${laneIndex.get(lane) + 1} · ${esc(who)}</span><br><span class="s">${counts} units · ${esc(f.text)}</span></span></button>`;
  }).join("");
  for (const b of $("keys").querySelectorAll(".lane-key")) b.onclick = () => { picked = picked === b.dataset.lane ? null : b.dataset.lane; renderKeys(); draw(); };
};
for (const [id, z] of [["z1", 1], ["z3", 3], ["z8", 8]]) $(id).onclick = () => {
  zoom = z; for (const b of ["z1", "z3", "z8"]) $(b).setAttribute("aria-pressed", String(b === id)); draw();
  const r = selected && $("chart").querySelector(`rect[data-k="${units.indexOf(selected)}"]`); if (r) $("scroller").scrollLeft = Math.max(0, Number(r.getAttribute("x")) - $("scroller").clientWidth / 2);
};
selected = units.find(u => laneInfo.get(u.lane).books.size > 1 && u.book !== [...laneInfo.get(u.lane).books][0] && u.people.length) ?? units[0] ?? null;
renderKeys(); renderDetail(); draw();
let resizeTimer = null; addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderKeys(); draw(); });
</script>
</body>
</html>
