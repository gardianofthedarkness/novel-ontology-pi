<script>
const PAGES = {"index.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Overview — novel-ontology-pi design dashboard</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"kicker\">design dashboard · overview</div>\n<h1>Digging a tunnel through a novel</h1>\n<p class=\"sub\">novel-ontology-pi turns a novel into a living ontology — characters, events,\ntimelines that can fork. The product has <b>four parts</b>: a <b>Skill</b> that teaches an\nagent the workflows, a <b>CLI</b> that does the work, one <b>Adaptor</b> that makes both\ninstallable into any popular agent host, and a <b>Frontend</b> where the work is watched.\nInside the CLI, data extraction is told the way tunnels are built: the <b>⛏ Digger</b>\n(miniloop + faculty graph) chews through the raw earth of the text and advances along the\ntimeline; the <b>🧱 Solidifier</b> (merge-gate review, EM, cross-sectional EM) lines the\ntunnel behind the face so what was dug becomes permanent canon. The simulation group is\nkept — deliberately empty for now.</p>\n<p>\n  <span class=\"badge v1\">hierarchy v2 · 2026-10-24</span>\n  <span class=\"badge\">companion: <a href=\"../../DESIGN.md\">DESIGN.md</a></span>\n  <span class=\"badge\">roadmap: <a href=\"roadmap.html\">decisions &amp; tracks</a></span>\n</p>\n\n<h2>The hierarchy — one picture</h2>\n<div class=\"panel\" style=\"padding:10px\">\n<svg class=\"arch\" viewBox=\"0 0 1180 950\" role=\"img\" aria-label=\"Hierarchy graph of novel-ontology-pi: Skill, CLI, Adaptor, Frontend; the CLI's data-extraction group as Digger and Solidifier, and an empty simulation group\">\n  <defs>\n    <marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"#3d4a6b\"></path>\n    </marker>\n  </defs>\n\n  <!-- USER -->\n  <rect class=\"box\" x=\"16\" y=\"400\" width=\"150\" height=\"120\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"91\" y=\"428\" text-anchor=\"middle\">👤 User</text>\n  <text class=\"small\" x=\"91\" y=\"450\" text-anchor=\"middle\">drops in a novel</text>\n  <text class=\"small\" x=\"91\" y=\"468\" text-anchor=\"middle\">provides 2 API keys</text>\n  <text class=\"small\" x=\"91\" y=\"486\" text-anchor=\"middle\">reviews at the gate</text>\n  <text class=\"small\" x=\"91\" y=\"504\" text-anchor=\"middle\">selects fork points</text>\n\n  <!-- AGENT HOSTS -->\n  <rect class=\"zone\" x=\"200\" y=\"14\" width=\"700\" height=\"88\" rx=\"16\"></rect>\n  <text class=\"zonelabel\" x=\"216\" y=\"36\">AGENT HOSTS — ANY POPULAR AGENT</text>\n  <rect class=\"box\" x=\"216\" y=\"46\" width=\"150\" height=\"42\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"291\" y=\"73\" text-anchor=\"middle\">Pi</text>\n  <rect class=\"box\" x=\"382\" y=\"46\" width=\"150\" height=\"42\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"457\" y=\"73\" text-anchor=\"middle\">Codex</text>\n  <rect class=\"box\" x=\"548\" y=\"46\" width=\"170\" height=\"42\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"633\" y=\"73\" text-anchor=\"middle\">Claude Code</text>\n  <rect class=\"box\" x=\"734\" y=\"46\" width=\"150\" height=\"42\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"809\" y=\"73\" text-anchor=\"middle\">… and peers</text>\n\n  <!-- ADAPTOR -->\n  <rect class=\"box\" x=\"200\" y=\"118\" width=\"700\" height=\"56\" rx=\"12\" style=\"stroke:var(--amber)\"></rect>\n  <text class=\"title\" x=\"550\" y=\"142\" text-anchor=\"middle\">🔌 Agent Adaptor — ONE adaptor, every host</text>\n  <text class=\"small\" x=\"550\" y=\"160\" text-anchor=\"middle\">translates Skill + CLI into each host's native format · one-step install · key entry</text>\n\n  <!-- SKILL / SYSTEM 2 -->\n  <rect class=\"zone\" x=\"200\" y=\"190\" width=\"700\" height=\"100\" rx=\"16\"></rect>\n  <text class=\"zonelabel\" x=\"216\" y=\"212\">SYSTEM 2 — THE SKILL (RUNS IN THE HOST AGENT)</text>\n  <rect class=\"box sys2\" x=\"216\" y=\"222\" width=\"668\" height=\"54\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"550\" y=\"245\" text-anchor=\"middle\">📜 novel-ontology Skill — workflows · gate staffing · tie-breaks · repairs</text>\n  <text class=\"small\" x=\"550\" y=\"263\" text-anchor=\"middle\">subskills mirror the CLI: data-extraction ▸ digger / solidifier · simulation (empty)</text>\n\n  <!-- CLI -->\n  <rect class=\"zone\" x=\"200\" y=\"306\" width=\"700\" height=\"462\" rx=\"16\"></rect>\n  <text class=\"zonelabel\" x=\"216\" y=\"328\">THE CLI — TWO COMMAND GROUPS</text>\n\n  <!-- DATA EXTRACTION GROUP -->\n  <rect class=\"zone\" x=\"216\" y=\"338\" width=\"440\" height=\"414\" rx=\"14\"></rect>\n  <text class=\"zonelabel\" x=\"232\" y=\"360\">CLI GROUP · DATA EXTRACTION</text>\n\n  <!-- DIGGER -->\n  <rect class=\"zone\" x=\"232\" y=\"370\" width=\"408\" height=\"192\" rx=\"12\" style=\"stroke:var(--teal)\"></rect>\n  <text class=\"zonelabel\" x=\"248\" y=\"392\" style=\"fill:var(--teal)\">⛏ THE DIGGER — MINILOOP + FACULTY GRAPH</text>\n  <rect class=\"box\" x=\"248\" y=\"402\" width=\"180\" height=\"54\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"338\" y=\"425\" text-anchor=\"middle\">✂️ Sectioning</text>\n  <text class=\"small\" x=\"338\" y=\"443\" text-anchor=\"middle\">code only · sentences + IDs</text>\n  <rect class=\"box sys1\" x=\"444\" y=\"402\" width=\"180\" height=\"54\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"534\" y=\"425\" text-anchor=\"middle\">🧠 Faculty graph</text>\n  <text class=\"small\" x=\"534\" y=\"443\" text-anchor=\"middle\">S1: Jev decision patches</text>\n  <rect class=\"box\" x=\"248\" y=\"470\" width=\"180\" height=\"54\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"338\" y=\"493\" text-anchor=\"middle\">📚 Extraction</text>\n  <text class=\"small\" x=\"338\" y=\"511\" text-anchor=\"middle\">work-LLM faculties, per scene</text>\n  <rect class=\"box sys2\" x=\"444\" y=\"470\" width=\"180\" height=\"54\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"534\" y=\"493\" text-anchor=\"middle\">⚖️ S2 adjudication</text>\n  <text class=\"small\" x=\"534\" y=\"511\" text-anchor=\"middle\">bounded · unresolved only</text>\n  <text class=\"small\" x=\"436\" y=\"546\" text-anchor=\"middle\">digs one block at a time · the face advances along the timeline →</text>\n\n  <!-- CHANGESET -->\n  <rect class=\"box\" x=\"232\" y=\"574\" width=\"408\" height=\"42\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"436\" y=\"592\" text-anchor=\"middle\">📝 ChangeSet — proposals per block</text>\n  <text class=\"small\" x=\"436\" y=\"608\" text-anchor=\"middle\">the loose rock: dug out, not yet canon</text>\n\n  <!-- SOLIDIFIER -->\n  <rect class=\"zone\" x=\"232\" y=\"628\" width=\"408\" height=\"108\" rx=\"12\" style=\"stroke:var(--amber)\"></rect>\n  <text class=\"zonelabel\" x=\"248\" y=\"650\" style=\"fill:var(--amber)\">🧱 THE SOLIDIFIER — MAKE IT CANON</text>\n  <rect class=\"box sys1\" x=\"248\" y=\"660\" width=\"180\" height=\"54\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"338\" y=\"683\" text-anchor=\"middle\">🛂 Merge gate</text>\n  <text class=\"small\" x=\"338\" y=\"701\" text-anchor=\"middle\">semantic fact review</text>\n  <rect class=\"box\" x=\"444\" y=\"660\" width=\"180\" height=\"54\" rx=\"10\"></rect>\n  <text class=\"title\" x=\"534\" y=\"683\" text-anchor=\"middle\">🧲 EM faculty</text>\n  <text class=\"small\" x=\"534\" y=\"701\" text-anchor=\"middle\">per-block · cross-sectional sweep</text>\n\n  <!-- SIMULATION GROUP -->\n  <rect class=\"zone\" x=\"672\" y=\"338\" width=\"212\" height=\"414\" rx=\"14\"></rect>\n  <text class=\"zonelabel\" x=\"688\" y=\"360\">CLI GROUP · SIMULATION</text>\n  <rect class=\"box ext\" x=\"688\" y=\"370\" width=\"180\" height=\"110\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"778\" y=\"412\" text-anchor=\"middle\">— empty for now —</text>\n  <text class=\"small\" x=\"778\" y=\"434\" text-anchor=\"middle\">timelines &amp; forks (11)</text>\n  <text class=\"small\" x=\"778\" y=\"452\" text-anchor=\"middle\">are the foundation;</text>\n  <text class=\"small\" x=\"778\" y=\"470\" text-anchor=\"middle\">simulation (12) lands later</text>\n\n  <!-- FRONTEND -->\n  <rect class=\"box\" x=\"916\" y=\"338\" width=\"248\" height=\"96\" rx=\"12\" style=\"stroke:var(--rose)\"></rect>\n  <text class=\"title\" x=\"1040\" y=\"366\" text-anchor=\"middle\">🖥️ Frontend — playground</text>\n  <text class=\"small\" x=\"1040\" y=\"386\" text-anchor=\"middle\">Live Theater · gate queue</text>\n  <text class=\"small\" x=\"1040\" y=\"404\" text-anchor=\"middle\">join animations · 3D graph</text>\n  <text class=\"small\" x=\"1040\" y=\"422\" text-anchor=\"middle\">watches the CLI event stream</text>\n\n  <!-- EXTERNAL APIS -->\n  <rect class=\"box ext\" x=\"916\" y=\"470\" width=\"248\" height=\"54\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"1040\" y=\"493\" text-anchor=\"middle\">🎯 Jev — decision model</text>\n  <text class=\"small\" x=\"1040\" y=\"511\" text-anchor=\"middle\">noul · choice · score — user API #2</text>\n  <rect class=\"box ext\" x=\"916\" y=\"538\" width=\"248\" height=\"54\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"1040\" y=\"561\" text-anchor=\"middle\">✍️ Work LLM</text>\n  <text class=\"small\" x=\"1040\" y=\"579\" text-anchor=\"middle\">generation model — user API #1</text>\n\n  <!-- STORAGE -->\n  <rect class=\"zone\" x=\"200\" y=\"784\" width=\"700\" height=\"112\" rx=\"16\"></rect>\n  <text class=\"zonelabel\" x=\"216\" y=\"806\">ONTOLOGY STORAGE — EMBEDDED, NO DOCKER</text>\n  <rect class=\"box\" x=\"216\" y=\"816\" width=\"330\" height=\"58\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"381\" y=\"841\" text-anchor=\"middle\">📦 Bundle (JSONL)</text>\n  <text class=\"small\" x=\"381\" y=\"859\" text-anchor=\"middle\">source of truth · portable · git-friendly</text>\n  <rect class=\"box\" x=\"562\" y=\"816\" width=\"322\" height=\"58\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"723\" y=\"841\" text-anchor=\"middle\">🐞 Ladybug — graph.lbug</text>\n  <text class=\"small\" x=\"723\" y=\"859\" text-anchor=\"middle\">disposable index · rebuilt from the bundle · Cypher</text>\n\n  <!-- EDGES -->\n  <path id=\"pIn\" class=\"edge hot flowdash\" d=\"M166 446 C 196 446, 186 250, 198 246\"></path>\n  <text class=\"elabel\" transform=\"rotate(-90 182 350)\" x=\"182\" y=\"350\" text-anchor=\"middle\">novel · requests · keys</text>\n\n  <path class=\"edge\" d=\"M291 88 L291 116\"></path>\n  <path class=\"edge\" d=\"M457 88 L457 116\"></path>\n  <path class=\"edge\" d=\"M633 88 L633 116\"></path>\n  <path class=\"edge\" d=\"M809 88 L809 116\"></path>\n\n  <path class=\"edge\" d=\"M550 174 L550 188\"></path>\n  <path class=\"edge\" d=\"M550 276 L550 304\"></path>\n  <text class=\"elabel\" x=\"562\" y=\"294\">drives the CLI (JSON)</text>\n\n  <path class=\"edge\" d=\"M428 429 L442 429\"></path>\n  <text class=\"elabel\" x=\"435\" y=\"419\" text-anchor=\"middle\">IDs</text>\n  <path class=\"edge\" d=\"M534 456 C 534 486, 440 478, 430 490\"></path>\n  <text class=\"elabel\" x=\"520\" y=\"478\">structured scenes</text>\n  <path class=\"edge\" d=\"M338 524 C 338 548, 400 566, 420 572\"></path>\n  <text class=\"elabel\" x=\"330\" y=\"552\">proposals</text>\n\n  <path id=\"pJev\" class=\"edge jev flowdash\" d=\"M624 415 C 760 400, 830 480, 914 490\"></path>\n  <path class=\"edge jev\" d=\"M914 510 C 830 520, 760 460, 626 445\"></path>\n  <text class=\"elabel\" x=\"790\" y=\"430\" text-anchor=\"middle\">batched questions</text>\n  <text class=\"elabel\" x=\"790\" y=\"540\" text-anchor=\"middle\">probabilities</text>\n\n  <path class=\"edge llm\" d=\"M428 497 L700 497 C 800 497, 850 556, 914 558\"></path>\n  <text class=\"elabel\" x=\"700\" y=\"488\" text-anchor=\"middle\">per-scene generation</text>\n\n  <path class=\"edge\" d=\"M338 616 L338 658\"></path>\n  <text class=\"elabel\" x=\"348\" y=\"640\">facts for review</text>\n  <path class=\"edge\" d=\"M428 687 L442 687\"></path>\n\n  <path id=\"pReview\" class=\"edge hot flowdash\" d=\"M610 660 C 660 500, 640 300, 600 278\"></path>\n  <text class=\"elabel\" x=\"662\" y=\"420\">ChangeSet for review ↑</text>\n  <text class=\"elabel\" x=\"662\" y=\"436\">verdicts · tie-breaks ↓</text>\n\n  <path id=\"pMerge\" class=\"edge hot flowdash\" d=\"M436 736 C 436 770, 400 790, 392 814\"></path>\n  <text class=\"elabel\" x=\"452\" y=\"772\">approved merge only</text>\n\n  <path class=\"edge\" d=\"M640 595 C 800 600, 880 520, 960 436\"></path>\n  <text class=\"elabel\" x=\"800\" y=\"580\" text-anchor=\"middle\">event stream — watch</text>\n\n  <path class=\"edge\" d=\"M546 845 L560 845\"></path>\n  <text class=\"elabel\" x=\"553\" y=\"835\" text-anchor=\"middle\">rebuild</text>\n\n  <path class=\"edge\" d=\"M700 874 L700 926 L91 926 L91 522\"></path>\n  <text class=\"elabel\" x=\"400\" y=\"918\" text-anchor=\"middle\">answers · character simulation · parallel-universe forks</text>\n\n  <!-- moving pulses -->\n  <circle class=\"pulse\" r=\"4\"><animateMotion dur=\"3.2s\" repeatCount=\"indefinite\"><mpath href=\"#pIn\"/></animateMotion></circle>\n  <circle class=\"pulse\" r=\"4\" fill=\"#c084fc\"><animateMotion dur=\"2.2s\" repeatCount=\"indefinite\"><mpath href=\"#pJev\"/></animateMotion></circle>\n  <circle class=\"pulse\" r=\"4\"><animateMotion dur=\"3.8s\" repeatCount=\"indefinite\"><mpath href=\"#pMerge\"/></animateMotion></circle>\n</svg>\n</div>\n\n<p class=\"sub\"><b>Rule zero:</b> never ask a model what code can compute exactly. Sectioning, offsets,\nand scanning for <i>known</i> names are code. Jev is only asked genuinely ambiguous questions — and it\nanswers with probabilities, not text, batched: one call per window, all questions at once.\nThe one hard boundary in the picture: <b>nothing crosses from ChangeSet to storage except through\nthe Solidifier, on approval.</b> And the Digger never waits for the Solidifier to finish the whole\ntunnel — it digs the next block while the last one is being lined.</p>\n\n<h2>The four parts</h2>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"../../skills/novel-ontology/SKILL.md\"><h3>📜 The Skill</h3><p>Workflows that teach the host agent to run the CLI, staff the gate, break ties and repair. Its subskills mirror the CLI groups: <b>data-extraction</b> (digger / solidifier) and <b>simulation</b> (empty for now).</p><span class=\"go\">Read the Skill →</span></a>\n  <a class=\"card\" href=\"roadmap.html\"><h3>⌘ The CLI</h3><p>All machinery lives here: two command groups — <b>data extraction</b> and <b>simulation</b> — over an embedded ontology bundle. Deterministic where possible; models only where ambiguity is real.</p><span class=\"go\">Roadmap &amp; decisions →</span></a>\n  <a class=\"card\" href=\"roadmap.html\"><h3>🔌 The Adaptor</h3><p>One adaptor makes Skill + CLI installable into every popular agent host — Pi, Codex, Claude Code, peers — in each host's native format. Spec: roadmap decision #21; built by Track C.</p><span class=\"go\">See the decision →</span></a>\n  <a class=\"card\" href=\"playground-frontend.html\"><h3>🖥️ The Frontend</h3><p>The playground: watches the CLI's event stream — Live Theater, gate queue, growing graph, join animations. Transparency for the user, replay for debugging.</p><span class=\"go\">Open sector 13 →</span></a>\n  <a class=\"card\" href=\"storage-connectors.html\"><h3>📦 The Ground</h3><p>What both CLI groups stand on: the JSONL bundle (source of truth) + the disposable Ladybug index. Sector 10.</p><span class=\"go\">Open sector 10 →</span></a>\n  <a class=\"card\" href=\"../../DESIGN.md\"><h3>📐 DESIGN.md</h3><p>The overall architecture in document form: decisions, schema v1, CLI surface, test plan.</p><span class=\"go\">Read the doc →</span></a>\n</div>\n\n<h2>The sectors — one page per functionality</h2>\n<a class=\"card\" href=\"roadmap.html\" style=\"margin-bottom:14px;border-color:var(--teal)\"><h3>🗺 Roadmap — implementation timeline &amp; decision log</h3>\n<p>Phases and parallel tracks in implementation order, the milestone that ends each, and the decision log — <b>updated in GitHub every time something is completed.</b></p><span class=\"go\">Open the roadmap →</span></a>\n<p class=\"sub\">Sector pages keep their pipeline numbering (01–13); they are grouped below the way\nthe CLI is grouped. Every sector page follows the same structure —\n<b>what it does → its own demo → design details → implementation mapping → open questions\nfor that sector only</b>.</p>\n\n<h3 style=\"margin-top:22px\">CLI · Data extraction — ⛏ The Digger <span style=\"color:var(--faint);font-size:13px\">(System 1 + faculties: from raw earth to proposals)</span></h3>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"sectioning.html\"><h3>01 · Sectioning</h3><p>Intake &amp; auto sentence segregation. Deterministic code — the only sector with no model at all.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"scene-boundary.html\"><h3>02 · Scene boundary</h3><p>Faculty: where scenes start, chosen as spans over long windows — location, time, viewpoint.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"dialogue-detector.html\"><h3>03 · Dialogue detector</h3><p>Faculty: which sentences are dialogue, stitched into exchanges (dialogue cards).</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"name-detector.html\"><h3>04 · Name detector</h3><p>Faculty: known names by code scan (language-map keys); new names &amp; nicknames by decision.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"presence-detector.html\"><h3>05 · Presence detector</h3><p>Faculty: who is in the scene vs. merely mentioned — proposed per window, refined per scene.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"speaker-attribution.html\"><h3>06 · Speaker attribution</h3><p>Faculty: which characters take part in each dialogue card — membership, not per-turn winners.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"miniloop-engine.html\"><h3>07 · Miniloop engine</h3><p>The digger's engine room: the faculty graph, the shared pool, batched Jev calls, S2 adjudication, the legacy miniloop.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"extraction.html\"><h3>08 · Extraction</h3><p>The work-LLM faculties read structured scenes and propose events, causality, state changes — and resolve identity at birth (own page: 08a).</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"em-at-birth.html\"><h3>08a · EM at birth</h3><p>Identity resolved before minting: descriptive candidates and name fragments get one strict Jev round; only true newcomers mint.</p><span class=\"go\">Open →</span></a>\n</div>\n\n<h3 style=\"margin-top:22px\">CLI · Data extraction — 🧱 The Solidifier <span style=\"color:var(--faint);font-size:13px\">(from proposals to canon that holds)</span></h3>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"merge-gate.html\"><h3>09 · Merge gate</h3><p>The semantic fact gate: per-fact review under a revision digest; apply materializes accepted facts only. Identity's two dedicated pages: 08a (birth, Digger) and 09a (global, Solidifier).</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"em-global.html\"><h3>09a · EM across the novel</h3><p>The strict backstop: structural nomination across the whole graph, per block for new-entity pairs and cross-sectionally at chapter close; merges through the audited fix path.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"storage-connectors.html\"><h3>10 · Storage connectors</h3><p>Where canon lands: the JSONL bundle (truth) and the Ladybug graph engine (hot queries), rebuilt from the bundle.</p><span class=\"go\">Open →</span></a>\n</div>\n\n<h3 style=\"margin-top:22px\">CLI · Simulation group <span style=\"color:var(--faint);font-size:13px\">(kept — empty for now)</span></h3>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"timeline-forking.html\"><h3>11 · Timelines &amp; forking</h3><p>The foundation the group stands on: canon as an event timeline; the user picks a time point; a branch forks, canon untouched.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"simulation.html\"><h3>12 · Simulation</h3><p>The group's future tenant: character state as a fold of events; roleplay that knows only what the character should know.</p><span class=\"go\">Open →</span></a>\n</div>\n\n<h3 style=\"margin-top:22px\">Frontend <span style=\"color:var(--faint);font-size:13px\">(watching the tunnel being dug)</span></h3>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"playground-frontend.html\"><h3>13 · Playground frontend</h3><p>The live theater: pipeline strip, growing 3D graph (Reagraph), decision stream, gate queue — the digger's advance and the solidifier's lining, visible as they happen.</p><span class=\"go\">Open →</span></a>\n</div>\n\n<h2>One block's journey, in one breath</h2>\n<div class=\"flow\">\n  <div class=\"node\"><b>📖 Novel block</b><span>raw earth — one chapter or a long block, any language</span></div>\n  <div class=\"arrow\">→</div>\n  <div class=\"node\" style=\"border-color:var(--teal)\"><b>⛏ Digger</b><span>sectioning → faculty graph (S1 Jev · S2 adjudication) → extraction</span></div>\n  <div class=\"arrow\">→</div>\n  <div class=\"node\"><b>📝 ChangeSet</b><span>loose rock — proposals for this block</span></div>\n  <div class=\"arrow\">→</div>\n  <div class=\"node\" style=\"border-color:var(--amber)\"><b>🧱 Solidifier</b><span>fact gate → apply → EM + cross-sectional EM</span></div>\n  <div class=\"arrow\">→</div>\n  <div class=\"node\"><b>📦 Canon</b><span>the lined tunnel — bundle + graph, one block further</span></div>\n</div>\n\n<footer>novel-ontology-pi · design dashboard · hierarchy v2 · 2026-10-24 ·\nCode: <code>src/</code> · Doc: <a href=\"../../DESIGN.md\">DESIGN.md</a> · Roadmap: <a href=\"roadmap.html\">decisions &amp; tracks</a></footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","roadmap.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Roadmap — novel-ontology-pi design dashboard</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"kicker\">dashboard · implementation timeline</div>\n<h1>Roadmap — implementation order &amp; decision log</h1>\n<p class=\"sub\">The work, sequenced. Each phase lists what gets built (with the sectors it touches),\nthe milestone that ends it, and the open questions that get decided <i>in that phase</i> — nothing\nis decided earlier than it needs to be.</p>\n<div class=\"panel\" style=\"border-color:var(--teal)\">\n  <b>Update rule:</b> this page is updated in GitHub <b>every time something is completed</b> —\n  phase statuses and the decision log here are the project's progress record of truth.\n  <span style=\"color:var(--dim)\">Last updated: 2026-10-24 · Phase 1 COMPLETE. <b>Sectioning K1/K2 fix merged 2026-10-23 (PR #29)</b> — front-matter credit lines and body-less headings no longer spawn phantom chapters; main verified at 203/203 core tests. <b>Streaming faculties merged 2026-10-23 (PR #30, decision #16):</b> the Jev/work-model pipeline is now a dependency-aware faculty pool with bounded System 2 adjudication — main verified at 194/194 core tests. Phase B (agent-activity live view) has also landed (PR #31, decision #15 complete). <b>Dialogue cards + semantic fact gate merged 2026-10-23 (PRs #34 + #35, decision #17):</b> speaker assignment is now exchange-level participant sets under a precision-first per-fact gate — main verified at 254/254 core tests. <b>Entity identity system merged 2026-10-23 (PRs #36 + #37, decision #18):</b> descriptions and name fragments resolve at birth under one strict Jev round, the EM faculty backstops with strict structural matching, and matches join with an animation in the playground — main verified at 273/273 core tests. <b>Variant name mapping merged 2026-10-23 (PR #33, decision #19):</b> identity keys now come from a swappable language map on the language management path, decoupled from the matching design — main verified at 281/281 core tests. <b>Next (decision #20):</b> open the repo — a structure &amp; decoupling pass, the core pipeline documented at multiple levels, and an agent-native install front door, organized as three decoupled tracks for parallel work from 2026-10-24. <b>Dashboard restructured 2026-10-24 (decision #21):</b> the design site now presents the product hierarchy — Skill + CLI + Adaptor + Frontend; inside data extraction, the ⛏ Digger and the 🧱 Solidifier; the simulation group an explicit empty placeholder — and the overview topology finally shows the faculty processor (S1 + S2 adjudication) as actually built. <b>Codebase restructured 2026-10-24 (decision #22, in review):</b> <code>src/</code> now mirrors the hierarchy — <code>digger/</code>, <code>solidifier/</code>, <code>ground/</code>, CLI groups under <code>cli/commands/</code> with <code>simulate/</code> an explicit empty group, and a new <code>adapters/</code> registry whose design follows REA's researched setup pattern (one canonical skill, plan → approve → apply-with-backups, one descriptor + acceptance test per host). <span style=\"color:var(--dim)\">Previous: landing wave 2026-10-22 — span-selection segmentation (PR #21), state materialization (PR #26), miniloop pipelining stage 1 (PR #27), spatial explorer (PR #20), orbital explorer (PR #25), eval scaffolding + extract adapter (PRs #18/#22), all merged; decisions #7–#15. First full-volume run (GT vol 1, Codex setup) in progress.</span></span>\n</div>\n\n<div class=\"rtl\">\n\n  <div class=\"rphase done\">\n    <h3>Phase 0 — Foundation <span class=\"status done\">✓ done · 2026-10-21</span></h3>\n    <ul>\n      <li>Founding design (DESIGN.md), English-canonical schema v1, Pi Skill</li>\n      <li>CLI skeleton: sectioning working, miniloop + v1 decision patches, ChangeSet / merge machinery</li>\n      <li>Connector interfaces: Ladybug · bundle · Jev · work LLM — tests green with a mocked Jev</li>\n      <li>This design dashboard: overview + 12 sector pages + single-file viewer</li>\n    </ul>\n    <p class=\"mile\">Milestone: repo live at gardianofthedarkness/novel-ontology-pi, skeleton verified.</p>\n  </div>\n\n  <div class=\"rphase done\">\n    <h3>Phase 1 — Live, end to end, on one test novel <span class=\"status done\">✓ done</span></h3>\n    <ul>\n      <li><b>Storage wiring</b> (10) <span class=\"status done\">✓ done</span> — real Ladybug driver (<code>@ladybugdb/core</code>): schema DDL applied, bundle → graph build, parameterized Cypher</li>\n      <li><b>Cypher-sufficiency experiment</b> (10) <span class=\"status done\">✓ built</span> — graph-only retrieval layer: presence, co-presence, causal ancestors/descendants, scene location, character event streams, fork points. Embeddings DEFERRED until one of these provably falls short</li>\n      <li><b>Block cutting</b> (01) <span class=\"status done\">✓ done</span> — multilingual chapter detection + paragraph-boundary blocks (<code>novel blocks</code>)</li>\n      <li><b>Gate tooling</b> (09) <span class=\"status done\">✓ done</span> — ChangeSet persistence + <code>changeset list|show|approve|hold</code>; approve applies to the bundle and rebuilds the graph (verified end to end in tests). <span style=\"color:var(--dim)\">Review toolkit landed 2026-10-22 (PR #17, merged): <code>novel match</code> (entity matching with a batched Jev checklist pre-review — only uncertain pairs reach the agent), audited pointwise <code>novel fix</code> (merge/rename/add-form/relate/unrelate/remove), and the recall protocol (<code>novel fix correct</code> pins + <code>novel recall</code>) — everything the main agent needs to staff the gate live.</span></li>\n      <li><b>Model wiring</b> (07/08) — Jev client live; DeepSeek as the work LLM via the provider layer. <span style=\"color:var(--dim)\">Plumbing landed 2026-10-21 (PR #8): OpenAI-compatible <code>HttpWorkModel</code> + <code>novel llm ping|probe</code>, mock-tested only. Jev side landed the same day (PR #11): the CLI holds its own secure key store (<code>novel jev login|status|logout|ping</code>, env → store → indirection resolution) and the JevClient speaks the real System One wire format — verified locally end to end against the live API. Ingest wiring landed the same evening (PR #13, merged): <code>novel ingest</code> runs blocks → miniloop → ChangeSets → merge gate → graph, the name registry is cumulative across blocks, and the test corpus (GT Index vols 1–2, zh-CN) is in hand locally. Both API keys were received via Secure Vault and verified live the same evening. The final Phase-1 piece — extraction — landed 2026-10-22 (PR #14, merged; see below).</span></li>\n      <li><b>Extraction step</b> (08) <span class=\"status done\">✓ done</span> — per-structured-scene work-LLM extraction inside the block processor (PR #14, merged 2026-10-22): English summaries + original-language evidence, CAUSES, six-dimension state deltas as gate-visible proposals, the sector-04 name pipeline completed (code nomination → zero-context refiner → one batched Jev judgment per block). Verified live on the real corpus: prologue blocks of both GT volumes produced held ChangeSets of ~130–390 proposals through real Jev + real DeepSeek.</li>\n    </ul>\n    <p class=\"mile\">Milestone: one real chapter of Index → ChangeSet → main-agent review → merged into Ladybug → queried back.</p>\n    <p style=\"color:var(--dim);font-size:13px\">Phase 1 milestone met 2026-10-22: real novel text → ChangeSets → merge gate → graph, watched live in the hosted frontend. First full gate exercise the same day: Pi itself staffed the gate over 6 blocks (prologue + chapters 1–3) with no auto-approve — 2,558 applied / 594 deferred / 39 audited repairs, report in PR #19 (merged 2026-10-22; PR #15 closed as superseded by #17, PR #16 closed — the frontend live view is being rebuilt on the working-draft stream, Phase B). The deferred pile is cleared: state materialization landed 2026-10-22 (PR #26, decision #12).</p>\n  </div>\n\n  <div class=\"rphase now\">\n    <h3>Phase 2 — Miniloop quality <span class=\"status now\">in progress</span></h3>\n    <ul>\n      <li><b>Segmentation by span selection</b> (02/03) <span class=\"status done\">✓ done</span> — Jev selects scene starts over long windows; scenes tile exactly; dialogue as exchanges with two-scene straddle links (PR #21, merged 2026-10-22; decision #11)</li>\n      <li><b>State materialization</b> (08/10) <span class=\"status done\">✓ done</span> — deferred set_state_change/add_alias proposals now apply; deterministic fold-on-read + <code>novel state</code> (PR #26, merged 2026-10-22; decisions #10/#12)</li>\n      <li><b>Miniloop pipelining, stage 1</b> (07) <span class=\"status done\">✓ done</span> — scene tiling ∥ dialogue selection ∥ name refinement run concurrently per block; links join after (PR #27, merged 2026-10-22; decision #13). Stage 2 (speaker(k) ∥ presence(k+1); bounded-concurrency extraction) still open</li>\n      <li><b>Streaming faculties</b> (07) <span class=\"status done\">✓ done</span> — the per-block pipeline is a dependency-aware faculty graph over a shared bounded pool; scenes stream into identity/understanding/alignment/attribution faculties as they close; bounded System 2 adjudication for uncertain boundaries and speakers (PR #30, merged 2026-10-23; decision #16). Supersedes pipelining stage 2's hand-scheduled overlaps</li>\n      <li><b>Sectioning robustness — K1/K2</b> (01) <span class=\"status done\">✓ done</span> — false chapter headings demoted: clustered translator-credit lines (第一章：ICERUSH) no longer open phantom chapters, and body-less headings (EPUB combined-title duplicates, TOC runs) never emit orphan blocks. On the real corpus both GT volumes go from 13 chapters / 5 tiny blocks to 7 / 0 (PR #29, merged 2026-10-23)</li>\n      <li><b>Calibration instruments</b> (07) <span class=\"status done\">✓ built</span> — <code>novel inspect</code> + <code>novel eval run</code> (metrics only, NO thresholds) + <code>novel eval extract</code> (PRs #18/#22, merged 2026-10-22). Matching keys are the format of record (decision #14). Golden-chapter scoring itself is next</li>\n      <li><b>Entity identity — alias-at-birth + EM faculty</b> (04/08) <span class=\"status done\">✓ done</span> — descriptive candidates and name fragments are resolved at mint time by one strict Jev round (attach ≥0.85) instead of minting duplicates; the EM faculty backstops with strict structural nomination + one batched Jev review per pass, merging through the audited fix path; matches emit <code>entity.merged</code> events and join with an animation in the playground (PRs #36/#37, merged 2026-10-23; decision #18)</li>\n      <li><b>Variant name mapping — language management path</b> (04) <span class=\"status done\">✓ done</span> — the full OpenCC fold (4,335 chars: JP shinjitai, traditional, TW/HK regional → one simplified canonical) lives behind the <code>LanguageMap</code> registry in <code>src/ground/language/languageMap.ts</code>; extraction, matching and fragment checks consume only the <code>nameForms</code> facade, so a future language case is solved by registering or selecting a different map — no design changes (PR #33, merged 2026-10-23; decision #19)</li>\n      <li><b>Name candidates, full build</b> (04): cumulative per-novel name registry scan + zero-context LLM extraction for new names</li>\n      <li><b>Calibration</b> (07): gate thresholds + window size measured on a golden chapter</li>\n      <li><b>Presence ranges</b> (05): entrances/exits mid-scene · <b>speech-tag attachment</b> (03)</li>\n      <li><b>Story-so-far digest</b> (07): cross-window memory in the state summary</li>\n    </ul>\n    <p class=\"mile\">Milestone: the miniloop's decisions are measured, not hoped — precision/recall known per patch.</p>\n    <p style=\"color:var(--dim);font-size:13px\">Parallel track — <b>Playground frontend</b> (13): event emission from the CLI + Live Theater v1 on Reagraph, so ingestion becomes watchable as soon as live models land. <b>Landed 2026-10-21:</b> the frontend v1 is built and merged to main (PR #4) — unified one-world view in <code>apps/playground</code> (three.js via Reagraph, React 19), reading local bundle files (<code>public/db/novel/</code>) behind the real EventSource interface, gate queue with distinct held-ghost state, verified end-to-end headlessly. Next on this track: the CLI's event emission (<code>novel watch</code> / SSE) so the same UI runs on live ingestion. <b>Live view landed 2026-10-21</b> (PR #13, merged): the playground consumes <code>novel watch</code> SSE through an <code>SseEventSource</code> drop-in (<code>?live=</code> URL switch) with a single ProcessingEvent → PlaygroundEvent projection — feed, pipeline strip, gate queue and activity shine all run live; in-place ghost nodes for live proposals await a CLI view-model endpoint (the stream carries transport facts only, by design). <b>Redesign merged 2026-10-21</b> (PR #9): fullscreen dark narrative-archive presentation — event files as archive cards on straight directed tracks, character spheres, semantic zoom (scroll/pinch into a file, zoom back out to return), collapsible Record / Activity / Review sheets, relations on by default, overview ghosts tethered to their parent file. <b>Spatial explorer merged 2026-10-22</b> (PR #20): weighted 3D relationship neighborhoods, Chronology/Relation switch, recursive in-place expansion (20 scene slots per level, camera and positions preserved), chapter characters persistent at every level. <b>Orbital explorer merged 2026-10-22</b> (PR #25): nested timelines on chronological spines, helices inside transparent spheres, double-click promote/uncoil, classic explorer retained. <b>Phase B — the agent-activity live view — landed 2026-10-23</b> (decision #15; PR #31, adapted to the faculty stream at landing): the working-draft stream (PR #19) rendered as nodes emerging batch by batch in the explorer; activity never steals the camera; clicking it flies to where the agent is knitting.</p>\n  </div>\n\n  <div class=\"rphase\">\n    <h3>Parallel tracks — open the repo <span class=\"status now\">from 2026-10-24</span></h3>\n    <ul>\n      <li><b>Track A — Structure &amp; decoupling audit</b>: reexamine the whole repo for coupling of the kind decision #19 just removed — specific knowledge compiled into design modules, sideways imports between peer modules, shared state with unclear ownership. Each finding becomes a bounded extraction behind a registry/facade seam, landed one at a time with the test suite green. Owns: <code>src/</code> internals (no behavior changes, no schema changes without routing back to the design owner)</li>\n      <li><b>Track B — The core pipeline, legible at every level</b>: one source of truth that states the core idea and the logical data pipeline at three levels — the one-paragraph idea (novel → ontology graph → timelines that fork), the pipeline map (sectioning → faculties → proposals → semantic gate → bundle → views), and the module contracts (inputs/outputs/invariants per stage). Every level must be interpretable on its own; diagrams drawn from the code, not beside it. Owns: <code>docs/</code> narrative + DESIGN.md. First deliverable landed 2026-10-24: the dashboard restructure itself (decision #21)</li>\n      <li><b>Track C — Agent-native front door</b>: lower the entry level until installation is one step for any major agent host — Pi, Codex, Claude Code, and peers: the repo's main page leads with a quick install per host, the Skill packaging validates in each host's format, and a fresh agent can go from clone to a first gated ingest on the golden chapter without reading the design site. Owns: README, <code>skills/</code> packaging, install/validation scripts</li>\n    </ul>\n    <p class=\"mile\">Milestone: at least three people/agents work in parallel on decoupled tracks without collisions — and a newcomer, human or agent, can install the project and explain its core pipeline in one sitting.</p>\n  </div>\n\n  <div class=\"rphase\">\n    <h3>Phase 3 — Whole-novel ingestion <span class=\"status plan\">planned</span></h3>\n    <ul>\n      <li><b>Gate at scale</b> (09): revision granularity, review digest, cross-block consistency checks</li>\n      <li><b>Storage at scale</b> (10): incremental Ladybug sync, multi-novel library layout</li>\n      <li><b>Robustness</b> (01/02/03/04/06): damaged text, unquoted dialogue, style profiles, name collisions, cross-language merges, first-person narration, scene granularity</li>\n    </ul>\n    <p class=\"mile\">Milestone: a full novel ingested block by block, human hands only at the gate.</p>\n    <p style=\"color:var(--dim);font-size:13px\">First attempt started 2026-10-22 (evening): full GT volume 1 run in the Codex setup on the landed stack (span segmentation + state materialization + pipelining). Watch items: deferred ≈ 0, scene granularity vs the old per-sentence baseline, identity-duplicate census (defect class #1 from the first live test — co-presence nomination is the candidate fix, sector 04 design).</p>\n  </div>\n\n  <div class=\"rphase\">\n    <h3>Phase 4 — The use phase <span class=\"status plan\">planned</span></h3>\n    <ul>\n      <li><b>Timelines &amp; forking</b> (11): fork-point browser, branch creation, pinned state snapshots, diverge
