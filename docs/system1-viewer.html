haracters, locations, scenes, dialogue turns and micro-events laid out in 3D roughly in chronological order along a time-flow axis, single-directional links only. A story narrated in parallel places shows <i>parallel chains</i> — one per location — interleaved only where the narration actually crosses (a phone call, a meeting). Data-wise this is containment: a big event groups scenes/events; zoom = Reagraph expand/collapse over those relations, not a camera trick alone.</li>\n  <li><b>Ghosts before facts:</b> proposals render as translucent amber ghosts in the graph <i>before</i> approval and solidify on merge — the user literally sees the difference between what the miniloop believes and what is canon.</li>\n  <li><b>Replay for debugging:</b> the event stream is recorded, so any ingestion run can be replayed step-by-step later (the Agent Flow pattern) — a bug report becomes a rewatchable session.</li>\n  <li><b>Host-agnostic:</b> no filesystem or VS Code APIs inside the component. A later VS Code extension is a thin shell (webview + the same event feed); the standalone app remains the public face.</li>\n</ul>\n\n<h2>Implementation mapping</h2>\n<table>\n  <tr><th>Piece</th><th>Lands as</th></tr>\n  <tr><td>Playground app</td><td><code>apps/playground/</code> — Vite + React + TS, Reagraph + React Flow deps</td></tr>\n  <tr><td>Event emission</td><td>CLI: block processor + miniloop + changeset store emit <code>PlaygroundEvent</code> records (<code>src/ground/events/</code>)</td></tr>\n  <tr><td>Live transport</td><td><code>novel watch &lt;novel-dir&gt;</code> — tails events.jsonl, serves SSE + the built frontend</td></tr>\n  <tr><td>Graph data</td><td>CLI query endpoints over LadybugStore/retrieval (initial snapshot + deltas)</td></tr>\n  <tr><td>Gate actions</td><td>UI calls the same changeset approve/hold path as the CLI — one gate, two doors</td></tr>\n</table>\n\n<h2>Open questions — this sector only</h2>\n<ul class=\"qlist\">\n    <li>Transport final form.<span>SSE from a local server (current plan) vs. WebSocket vs. plain file-tail polling — SSE is simplest and one-directional like the data; bidirectional needs (gate clicks) are ordinary HTTP posts. Confirm SSE?</span></li>\n    <li>Session recording format.<span>Events already persist as JSONL — how much UI state (camera, selections) joins the recording for faithful replay?</span></li>\n    <li>Scale guardrails.<span>Reagraph is comfortable in the low thousands of nodes; at whole-novel scale the explorer needs cluster-first rendering (chapters as supernodes) — the default view decision: always clustered, expand on demand?</span></li>\n    <li>2D fallback.<span>Reagraph offers 2D layouts in the same component — ship a 2D/3D toggle from day one for weaker GPUs?</span></li>\n    <li>Notification policy.<span>What earns a shine vs. a silent feed entry — merges and gate arrivals always; escalations (low-confidence, held ChangeSets) immediately? Multiple simultaneous knitting sites: one tab entry per site, or a single rolled-up \"3 sites active\"?</span></li>\n</ul>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · System 1 design · 13 Playground frontend</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\n(function () {\n  const svg = document.getElementById('uniSvg');\n  const NS = 'http://www.w3.org/2000/svg';\n  function el(tag, attrs, parent) {\n    const e = document.createElementNS(NS, tag);\n    for (const k in attrs) e.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n  function txt(x, y, str, size, fill, parent, anchor) {\n    const t = el('text', { x, y, 'font-size': size, fill, 'text-anchor': anchor || 'middle',\n      'paint-order': 'stroke', stroke: '#0a0e16', 'stroke-width': 3 }, parent);\n    t.textContent = str;\n    return t;\n  }\n  const styleEl = document.createElement('style');\n  styleEl.textContent = '@keyframes tpulse { 0%,100% { stroke-width:3 } 50% { stroke-width:6 } } .targetPulse { animation: tpulse 1.2s infinite } .flowline { animation: dashmove 1.2s linear infinite } @keyframes dashmove { to { stroke-dashoffset: -11 } }';\n  document.head.appendChild(styleEl);\n  const defs = el('defs', {}, svg);\n  [['arr', '#5f6d88'], ['arrT', '#2dd4bf'], ['arrV', '#a78bfa']].forEach(([id, col]) => {\n    const mk = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);\n    el('path', { d: 'M0,0 L10,5 L0,10 z', fill: col }, mk);\n  });\n\n  /* ============ MACRO: timeline lanes, big events ============ */\n  const macro = el('g', {}, svg);\n  el('rect', { x: 14, y: 52, width: 672, height: 128, rx: 14, fill: 'rgba(38,48,74,.22)', stroke: '#26304a' }, macro);\n  txt(26, 74, 'CANON LANE', 11, '#9aa7bd', macro, 'start');\n  el('rect', { x: 14, y: 232, width: 672, height: 128, rx: 14, fill: 'rgba(167,139,250,.06)', stroke: '#3d3358' }, macro);\n  txt(26, 254, 'BRANCH LANE · what-if', 11, '#a78bfa', macro, 'start');\n  el('line', { x1: 24, y1: 122, x2: 672, y2: 122, stroke: '#3b4a6b', 'stroke-width': 2, 'marker-end': 'url(#arr)' }, macro);\n  el('line', { x1: 24, y1: 302, x2: 672, y2: 302, stroke: '#3d3358', 'stroke-width': 2, 'marker-end': 'url(#arr)' }, macro);\n  txt(672, 200, 'time →', 12, '#5f6d88', macro, 'end');\n  txt(180, 66, '第一章', 11.5, '#5f6d88', macro);\n  txt(400, 66, '第二章', 11.5, '#5f6d88', macro);\n  txt(556, 66, '第三章', 11.5, '#5f6d88', macro);\n  const CANON = [[110, '相遇'], [250, '约定'], [400, '归还终端'], [556, '傍晚']];\n  CANON.forEach(([x, name], i) => {\n    if (i > 0) {\n      const l = el('line', { x1: CANON[i - 1][0] + 28, y1: 122, x2: x - 32, y2: 122, stroke: '#2dd4bf', 'stroke-width': 2, 'stroke-dasharray': '6 5', 'marker-end': 'url(#arrT)', opacity: .8 }, macro);\n      l.classList.add('flowline');\n    }\n    const r = name === '归还终端' ? 30 : 25;\n    const c = el('circle', { cx: x, cy: 122, r, fill: '#12333a', stroke: '#2dd4bf', 'stroke-width': name === '归还终端' ? 3 : 2 }, macro);\n    if (name === '归还终端') c.setAttribute('class', 'targetPulse');\n    txt(x, 127, name, name.length > 3 ? 11.5 : 13, '#e8ecf4', macro);\n  });\n  txt(400, 84, 'click ⤢', 12, '#fbbf24', macro);\n  const focus = el('rect', { x: 330, y: 56, width: 140, height: 122, rx: 12, fill: 'none', stroke: '#2dd4bf', 'stroke-width': 1.4, 'stroke-dasharray': '5 4', opacity: .8 }, macro);\n  const BR = [[170, '终端未丢'], [420, '寻回'], [596, '芭菲']];\n  BR.forEach(([x, name], i) => {\n    if (i > 0) {\n      const l = el('line', { x1: BR[i - 1][0] + 26, y1: 302, x2: x - 30, y2: 302, stroke: '#a78bfa', 'stroke-width': 2, 'stroke-dasharray': '6 5', 'marker-end': 'url(#arrV)', opacity: .7 }, macro);\n      l.classList.add('flowline');\n    }\n    el('circle', { cx: x, cy: 302, r: 24, fill: '#241b3e', stroke: '#a78bfa', 'stroke-width': 2 }, macro);\n    txt(x, 307, name, 11.5, '#e8ecf4', macro);\n  });\n  txt(420, 262, 'agent knitting here ⤵', 12, '#fbbf24', macro);\n  const halo = el('circle', { cx: 420, cy: 302, r: 30, fill: 'none', stroke: '#fbbf24', 'stroke-width': 2, opacity: 0 }, macro);\n  const GHOSTS = [[382, 270], [458, 268], [384, 336], [456, 334]];\n  const ghostEls = GHOSTS.map(([x, y]) => el('circle', { cx: x, cy: y, r: 10, fill: '#fbbf24', stroke: '#fbbf24', 'stroke-dasharray': '3 2', opacity: 0 }, macro));\n  const ripple = el('circle', { cx: 420, cy: 302, r: 10, fill: 'none', stroke: '#34d399', 'stroke-width': 2.5, opacity: 0 }, macro);\n  const arrive = el('rect', { x: 348, y: 236, width: 144, height: 122, rx: 12, fill: 'none', stroke: '#34d399', 'stroke-width': 1.8, 'stroke-dasharray': '5 4', opacity: 0 }, macro);\n\n  /* ============ MICRO: 3D interior of 归还终端 — two parallel chains ============ */\n  const micro = el('g', { opacity: 0 }, svg);\n  const COL = { char: '#a78bfa', loc: '#7dd3fc', scene: '#94a3b8', event: '#2dd4bf', dlg: '#fbbf24' };\n  const MN = [\n    // chain A — café\n    ['cafe', '咖啡店', 'loc', -238, -2, -26, ''],\n    ['sceneA', '场景·柜台', 'scene', -192, -60, -12, ''],\n    ['uiharu', '初春饰利', 'char', -150, -132, 2, ''],\n    ['dlgA1', '对话①', 'dlg', -108, -60, 10, '「终端好像落在店里了…」'],\n    ['evA1', '发现终端', 'event', -18, -60, -16, ''],\n    ['mikoto', '御坂美琴', 'char', 28, -134, 8, ''],\n    ['dlgA2', '对话②', 'dlg', 78, -60, 12, '「店员捡到一台，是这个？」'],\n    ['evA2', '确认归属', 'event', 196, -60, -8, ''],\n    // chain B — street\n    ['street', '街道', 'loc', -228, 118, 16, ''],\n    ['sceneB', '场景·巡逻', 'scene', -172, 60, 26, ''],\n    ['kuroko', '白井黒子', 'char', -118, -6, 32, ''],\n    ['dlgB1', '对话③', 'dlg', -58, 60, 40, '「姐姐大人，我这边还没找到」'],\n    ['evB1', '街道巡查', 'event', 122, 60, 18, ''],\n  ];\n  const ME = [\n    ['cafe', 'sceneA', 'thin'], ['sceneA', 'dlgA1', 'flow'], ['dlgA1', 'evA1', 'flow'],\n    ['evA1', 'dlgA2', 'flow'], ['dlgA2', 'evA2', 'flow'],\n    ['street', 'sceneB', 'thin'], ['sceneB', 'dlgB1', 'flow'], ['dlgB1', 'evB1', 'flow'],\n    ['uiharu', 'dlgA1', 'thin'], ['dlgA1', 'mikoto', 'thin'], ['mikoto', 'dlgA2', 'thin'],\n    ['kuroko', 'dlgB1', 'thin'], ['dlgB1', 'mikoto', 'dash'],\n  ];\n  const mNodes = {}, mEdges = [];\n  const gME = el('g', {}, micro), gMN = el('g', {}, micro);\n  for (const [a, b, type] of ME) {\n    const l = el('line', { stroke: type === 'flow' ? '#2dd4bf' : type === 'dash' ? '#a78bfa' : '#5f6d88',\n      'stroke-width': type === 'flow' ? 2 : 1.2, 'stroke-dasharray': type === 'dash' ? '4 3' : 'none',\n      'marker-end': type === 'flow' ? 'url(#arrT)' : type === 'dash' ? 'url(#arrV)' : 'url(#arr)', opacity: 0 }, gME);\n    mEdges.push({ a, b, type, l });\n  }\n  for (const [id, label, kind, x, y, z, quote] of MN) {\n    const g = el('g', {}, gMN);\n    const c = el('circle', { fill: COL[kind], stroke: '#0a0e16', 'stroke-width': 1.5 }, g);\n    const t = txt(0, 0, label, 10.5, '#c7d0e0', g);\n    const q = quote ? txt(0, 0, quote, 11.5, '#fbbf24', g) : null;\n    if (q) q.setAttribute('opacity', 0);\n    mNodes[id] = { id, label, kind, x, y, z, g, c, t, q };\n  }\n  // 3D time axis: a line + chevrons + label, positioned per-frame by projection\n  const axisL = el('line', { stroke: '#3b4a6b', 'stroke-width': 2, 'marker-end': 'url(#arr)' }, gME);\n  const chevs = [-90, 30, 150].map(x => { const c = txt(0, 0, '»', 16, '#2dd4bf', gME); return { x, c }; });\n  const axisLabel = txt(0, 0, 'time flow →', 12.5, '#5f6d88', gME);\n  txt(-238, -196, 'chain A · 咖啡店', 12.5, '#7dd3fc', micro, 'start').setAttribute('class', 'chainLabel');\n  const chainBLabel = txt(-238, 196, 'chain B · 街道（与 A 并行叙述）', 12.5, '#7dd3fc', micro, 'start');\n\n  /* ============ shared UI state ============ */\n  const cap = document.getElementById('uniCap');\n  const crumb = document.getElementById('uniCrumb');\n  const chip = document.getElementById('uniChip');\n  const badge = document.getElementById('uniBadge');\n  const CAPS = [\n    [0, 'One world: the timeline at chapter range. Down in the branch lane, System 1 is already knitting — ghosts appearing in place.'],\n    [4700, 'You click 归还终端 — semantic zoom: the summary node dissolves into its 3D interior…'],\n    [6800, 'Inside: TWO locations narrated in parallel — two chains of scenes, dialogue and events, every link one-directional, laid out in chronological order along the time-flow axis.'],\n    [13300, 'The branch ChangeSet reaches the gate — the activity tab shines. Nothing has touched your camera.'],\n    [14800, 'You tap it: a guided flight out of the interior, across lanes, straight to the knitting site…'],\n    [18000, '…arriving as the merge lands: the ghosts solidify into branch canon. One graph, one truth.'],\n    [20500, 'The tab rests. The agent moves on to the next block — and the loop begins again.'],\n  ];\n  const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;\n  const F = 340, CX = 350, CY = 200;\n  const LOO );\n      c.setAttribute('fill', solid ? '#a78bfa' : '#fbbf24');\n      c.setAttribute('stroke-dasharray', solid ? 'none' : '3 2');\n    });\n    const hp = (t % 1400) / 1400;\n    halo.setAttribute('r', 28 + hp * 15);\n    halo.setAttribute('opacity', t >= 1100 && t < 18000 ? String(0.7 * (1 - hp)) : 0);\n    const caught = t >= 18000 && t < 21400;\n    chip.className = caught ? 'caught' : (gcount > 0 ? 'shine' : '');\n    chip.childNodes[0].textContent = caught ? '✓ Caught up ' : (t >= 13300 && t < 14800 ? '⚖ Gate + Agent activity ' : '✦ Agent activity ');\n    badge.textContent = caught ? '0' : String(gcount);\n    const rt = (t - 18000) / 1000;\n    if (rt >= 0 && rt <= 1) { ripple.setAttribute('r', 12 + rt * 44); ripple.setAttribute('opacity', String(0.85 * (1 - rt))); }\n    else ripple.setAttribute('opacity', 0);\n    /* ---- rail: pipeline, feed, gate ---- */\n    const stage = t < 1300 ? 0 : t < 3500 ? 1 : t < 4400 ? 2 : t < 5600 ? 3 : t < 13300 ? 4 : 5;\n    for (let i = 0; i < 5; i++) {\n      const e2 = document.getElementById('ps' + i);\n      e2.className = 'pstage' + (i < stage || stage === 5 ? ' done' : i === stage ? ' on' : '');\n    }\n    document.getElementById('blk').className = 'blockchip' + (t > 250 ? ' show' : '');\n    document.querySelectorAll('#feedList li').forEach(li => li.classList.toggle('show', t >= +li.dataset.t && t < 21400));\n    const gate = document.getElementById('gateBox');\n    gate.className = 'gatebox' + (t >= 4600 && t < 21400 ? ' show' : '') + (caught ? ' merged' : '');\n    gate.textContent = caught ? '✓ GATE · cs_b0011 merged' : '⧗ GATE · 6 proposals pending';\n    /* ---- micro 3D render ---- */\n    if (microO > 0.01) {\n      const mt = Math.max(0, t - 6500);\n      const ang = Math.sin(now * 0.00022) * 0.17;\n      const pos = {};\n      const ordered = Object.values(mNodes).slice();\n      for (const n of ordered) {\n        const xr = n.x * Math.cos(ang) - n.z * Math.sin(ang);\n        const zr = n.x * Math.sin(ang) + n.z * Math.cos(ang);\n        const s = F / (F + zr);\n        pos[n.id] = { px: CX + xr * s, py: CY + n.y * s, s, zr };\n      }\n      // time axis in 3D\n      const ax = [-272, 272].map(x => {\n        const xr = x * Math.cos(ang), zr = x * Math.sin(ang), s = F / (F + zr);\n        return { px: CX + xr * s, py: CY + 158 * s, s };\n      });\n      axisL.setAttribute('x1', ax[0].px); axisL.setAttribute('y1', ax[0].py);\n      axisL.setAttribute('x2', ax[1].px); axisL.setAttribute('y2', ax[1].py);\n      for (const cv of chevs) {\n        const xr = cv.x * Math.cos(ang), zr = cv.x * Math.sin(ang), s = F / (F + zr);\n        cv.c.setAttribute('x', CX + xr * s); cv.c.setAttribute('y', CY + 152 * s);\n      }\n      axisLabel.setAttribute('x', ax[1].px); axisLabel.setAttribute('y', ax[1].py + 22);\n      // progressive reveal of the time-flow chain edges\n      const flowIdx = { 'sceneA>dlgA1': 0, 'dlgA1>evA1': 1, 'evA1>dlgA2': 2, 'dlgA2>evA2': 3, 'sceneB>dlgB1': 0.5, 'dlgB1>evB1': 2.5 };\n      for (const e of mEdges) {\n        const a = pos[e.a], b = pos[e.b];\n        let vis = 1;\n        if (e.type === 'flow') vis = mt > 500 + (flowIdx[e.a + '>' + e.b] || 0) * 620 ? 1 : 0;\n        e.l.setAttribute('x1', a.px); e.l.setAttribute('y1', a.py);\n        e.l.setAttribute('x2', b.px); e.l.setAttribute('y2', b.py);\n        e.l.setAttribute('opacity', String(vis * (e.type === 'flow' ? 0.9 : e.type === 'dash' ? 0.55 : 0.4)));\n      }\n      // active dialogue turn cycles\n      const dlgIds = ['dlgA1', 'dlgB1', 'dlgA2'];\n      const activeDlg = dlgIds[Math.floor(mt / 1200) % 3];\n      for (const n of ordered) {\n        const p = pos[n.id];\n        const r = (n.kind === 'char' ? 12 : n.kind === 'loc' ? 11 : n.kind === 'dlg' ? 9 : 10) * p.s;\n        n.c.setAttribute('cx', p.px); n.c.setAttribute('cy', p.py); n.c.setAttribute('r', r);\n        n.c.setAttribute('stroke', n.id === activeDlg ? '#fbbf24' : '#0a0e16');\n        n.c.setAttribute('stroke-width', n.id
