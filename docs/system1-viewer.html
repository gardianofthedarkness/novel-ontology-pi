entence IDs, producing patch, and confidence. Every node in the graph can answer: which block, which sentences, which patch, what confidence, whose approval.</li>\n  <li><b>A natural end:</b> when the last block the user asked for merges, ingestion is done — the loop terminates on the work, not on a timer.</li>\n  <li><b>Review is staged (decided 2026-10-22):</b> before the agent deliberates, System 1 pre-reviews the batch itself. Entity matching is the first stage: code nominates duplicate pairs (shared forms, script-variant folds, containment, near-identical forms), and one batched Jev checklist per batch (same entity? treated as distinct? mere form variant?) routes them — confident pairs arrive as ready merge fixes, only unsettled pairs are raised to the agent as real requests. Duplicates are the known failure mode of extraction; they are settled at the gate, not inside the extractor.</li>\n  <li><b>Pointwise before wholesale:</b> small errors are fixed pointwise by the agent over the bundle (<code>novel fix merge|rename|add-form|relate|unrelate|remove-entity|remove-event</code>), each fix audited in <code>maintenance.jsonl</code> with the graph rebuilt after it. A block is never re-run for a typo.</li>\n  <li><b>Recall nominates the chain:</b> when an entire subtree is wrong midway, the agent traces the cascade to the earliest decision that caused it, pins that decision (<code>novel fix correct --block --key --value</code>), and recalls System 1 (<code>novel recall</code>): the block re-runs from the stored source with the pin honored and logged, producing a fresh ChangeSet; the superseded one is kept for audit.</li>\n</ul>\n\n<h2>Implementation</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><code>src/solidifier/merge/changeset.ts</code> — ChangeSet / ChangeProposal types and lifecycle states.</li>\n  <li><code>src/solidifier/merge/apply.ts</code> — the single apply path, status-checked.</li>\n  <li><code>src/digger/processing/blockProcessor.ts</code> — the roll: section → faculty graph (legacy: miniloop) → review callback → apply / stop / revise. Revisions are surgical (<code>revise.ts</code>, reason required; applied packets refused).</li>\n  <li><b>Semantic fact gate (decision #17):</b> proposals decompose into per-field facts bound to a revision digest (<code>novel changeset facts|decide</code>); apply materializes only accepted facts, and the digest fails closed on pending reviews.</li>\n  <li><b>EM composition (decision #18):</b> birth-time identity output reaches the gate as ordinary identity facts; EM merges run post-apply through the audited fix path, never as gate proposals. Identity now has its own pages: <a href=\"em-at-birth.html\">08a EM at birth</a> (Digger) and <a href=\"em-global.html\">09a EM across the novel</a> (Solidifier).</li>\n  <li>The Skill teaches the agent its reviewer duties: <code>skills/novel-ontology/SKILL.md</code>.</li>\n  <li>Review tooling (2026-10-22): <code>src/solidifier/matching/entityMatch.ts</code> + <code>novel match</code> — duplicate nomination + the System 1 batch checklist; <code>src/solidifier/maintenance/fixes.ts</code> + <code>novel fix …</code> — audited pointwise repairs with graph rebuild; <code>src/solidifier/maintenance/corrections.ts</code> + <code>novel recall</code> — pinned decisions honored on a single-block re-run.</li>\n</ul>\n\n<h2>Open questions — the merge gate</h2>\n<div class=\"panel\">\n  <ul class=\"tight oq\" style=\"font-size:14px\">\n    <li>Revision granularity.<span>When the agent sends a ChangeSet back, what is the unit — a single proposal, a scene, or a patch's whole output for the block? The skeleton re-runs the block; finer units need per-proposal patch provenance to pay off.</span></li>\n    <li>Review presentation.<span>How should a ChangeSet be summarized for review — counts by kind, lowest-confidence first, new entities spotlighted? The agent reviews faster with the right digest; the user spot-checks with the same view.</span></li>\n    <li>Auto-approval envelope.<span>Should very high-confidence, low-risk proposal classes (e.g. PRESENT_IN at 0.97) ever skip review in bulk, with the agent auditing samples? Speed vs. the safety property.</span></li>\n    <li>Cross-block consistency checks.<span>Before approving block N, should the gate run standing queries — duplicate-name suspects, state contradictions — against everything merged so far?</span></li>\n  </ul>\n</div>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design by sector · v0.1 · 2026-10-21</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\nconst blocks=document.getElementById('blocks');\nblocks.innerHTML='<span class=\"chip\" id=\"bk0\">Chapter 1</span> <span class=\"chip\" id=\"bk1\">Chapter 2</span> <span class=\"chip\" id=\"bk2\">Chapter 3</span>';\nlet merged=0;\nfunction setProgress(){document.getElementById('novelFill').style.width=(merged/3*100)+'%';document.getElementById('novelLbl').textContent=merged+' of 3 blocks merged';}\nfunction resetAll(){merged=0;setProgress();document.getElementById('gatearea').innerHTML='';[0,1,2].forEach(i=>document.getElementById('bk'+i).style.borderColor='');}\nconst steps=[\n {t:3000,cap:[\"Block 1: a clean ChangeSet\",\"18 proposals — 2 new characters, 9 events, all confidences ≥ 0.8. The main agent approves; the merge applies; block 2 rolls.\"],run(){document.getElementById('gatearea').innerHTML='<div class=\"verdict good on\">ChangeSet cs_b0001 · 18 proposals · <span class=\"stamp\" style=\"color:var(--green)\">APPROVED</span></div>';document.getElementById('bk0').style.borderColor='var(--green)';merged=1;setProgress();}},\n {t:3400,cap:[\"Block 2: the agent doubts one part\",\"A nickname proposal looks wrong — it would attach 黑子 as an alias of the wrong character. Verdict: REVISE, scoped to that proposal. The miniloop re-runs just the name patch for those sentences and returns a corrected ChangeSet, which is approved.\"],run(){document.getElementById('gatearea').innerHTML='<div class=\"verdict bad on\">ChangeSet cs_b0002 · <span class=\"stamp\" style=\"color:var(--rose)\">REVISE</span> · note: “alias 黑子 — check against ch.1 cast”</div>';document.getElementById('bk1').style.borderColor='var(--amber)';}},\n {t:3000,cap:[\"Block 2 revised → approved; block 3 held\",\"The corrected alias merges. In block 3, a new character's identity contradicts an earlier chapter — the agent HOLDS and asks the user. Nothing from block 3 touches the graph.\"],run(){document.getElementById('gatearea').innerHTML='<div class=\"verdict good on\">ChangeSet cs_b0002 (rev. 2) · <span class=\"stamp\" style=\"color:var(--green)\">APPROVED</span></div><div class=\"verdict warn on\">ChangeSet cs_b0003 · <span class=\"stamp\" style=\"color:var(--amber)\">HELD</span> · identity conflict — user consulted</div>';document.getElementById('bk1').style.borderColor='var(--green)';document.getElementById('bk2').style.borderColor='var(--amber)';merged=2;setProgress();}},\n];\nrunSectorDemo(steps.map(s=>({...s,reset:resetAll})));\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","em-global.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>09a EM across the novel — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"sectorno\">09a</div>\n<div class=\"kicker\">sector 09a · Solidifier — identity across the novel</div>\n<h1>EM across the novel — the strict backstop</h1>\n<p>\n  <span class=\"badge\">status: implemented</span>\n  <span class=\"badge\">repo: <code>src/solidifier/matching/</code> (structuralMatch, emFaculty, entityMatch)</span>\n  <span class=\"badge\">CLI: <code>novel match</code> · <code>novel fix merge</code></span>\n</p>\n<p class=\"sub\">Birth resolution (08a) catches most duplicates. What it misses — spelling\ntwins, under-threshold declines, referents named only in later chapters — is the\nEM faculty's job. It re-checks identity <b>structurally</b>, across the whole\ngraph, and it is deliberately strict: a miss is cheap, because the check re-runs\nevery block and scores only grow — while a bad merge is permanent.</p>\n\n<table class=\"io\">\n  <tr><th>Inputs</th><td>Entity pairs + graph structure (shared scenes, shared neighbors, co-actor events) + the verdict memory in <code>&lt;novelDir&gt;/matching.json</code></td></tr>\n  <tr><th>Outputs</th><td>A merge through the audited fix path, or a distinct verdict remembered until the evidence grows</td></tr>\n  <tr><th>Depends on</th><td>08a EM at birth (what it missed), 09 Merge gate (post-apply composition), 10 Storage</td></tr>\n  <tr><th>Feeds into</th><td>Canon (audited merges) · the playground join animation · <code>novel match</code> retries</td></tr>\n</table>\n\n<h2>Demo — a score grows until it merges</h2>\n<div class=\"panel\">\n  <div class=\"caption\" id=\"caption\"><span class=\"stepno\">▶</span>The demo plays and loops on its own.</div>\n  <div class=\"progressdots\" id=\"dots\"></div>\n  <div class=\"stage\">\n    <div class=\"card\" style=\"margin:0 0 10px\"><h3 style=\"font-size:13.5px\">Pair under watch · 御坂美琴 × \"Misaka\" (spelling twin)</h3>\n      <p style=\"margin:2px 0\">birth missed it: the twin arrived in a later chapter, under threshold. Structure will catch it.</p></div>\n    <div id=\"events\"></div>\n    <div class=\"items\" id=\"props\"></div>\n  </div>\n  <p style=\"margin-top:12px\"><button class=\"replay\" id=\"replay\">↻ Replay</button></p>\n</div>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>Structural nomination, strict bar:</b> score ≥ 0.6, with a support floor of ≥ 2 shared scenes or ≥ 3 shared neighbors. Zero co-actor events is a veto — two figures who act together are not the same person. Alias-linked pairs are excluded outright.</li>\n  <li><b>One batched checklist per pass:</b> nominated pairs go through a single batched Jev checklist, not one call per pair. The checklist is the only model step; nomination itself is code.</li>\n  <li><b>Two rhythms:</b> per block, only pairs touching new entities are checked. At chapter close, the old × old sweep runs over every pair the block passes skipped.</li>\n  <li><b>Distinct verdicts are remembered:</b> a pair judged distinct is written to <code>matching.json</code> and skipped until its shared evidence grows by +2. Scores only grow, so a miss today can become a merge next chapter — safely.</li>\n  <li><b>Merges never bypass the audit:</b> a confirmed merge goes through the audited post-apply <code>mergeEntities</code> path, never as a gate proposal. EM composes under the semantic fact gate (decision #17): the revision digest fails closed on pending reviews.</li>\n</ul>\n\n<h2>Implementation</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><code>src/solidifier/matching/structuralMatch.ts</code> — <code>buildStructuralIndex</code> / <code>nominateStructuralCandidates</code>: the nomination pass over shared scenes and neighbors.</li>\n  <li><code>src/solidifier/matching/emFaculty.ts</code> — the EM faculty: per-block passes over new-entity pairs, the chapter-close old × old sweep, and the <code>matching.json</code> memory (read/write, +2 growth rule).</li>\n  <li><code>src/solidifier/matching/entityMatch.ts</code> — thresholds: <code>CONFIDENT_THRESHOLD = 0.85</code>, <code>UNCERTAIN_THRESHOLD = 0.45</code>, <code>DISTINCT_THRESHOLD = 0.6</code>; <code>nominateMatchCandidates</code> for the <code>novel match</code> CLI surface.</li>\n  <li><code>src/solidifier/maintenance/fixes.ts</code> — <code>mergeEntities</code>: the audited merge path. Follow-up open: <code>novel fix merge</code> does not emit join events yet.</li>\n  <li>Matched entities get a playground join animation (orbital morph + classic glide) — the user sees the merge happen in the graph (sector 13).</li>\n</ul>\n\n<h2>Open questions — EM across the novel</h2>\n<div class=\"panel\">\n  <ul class=\"tight oq\" style=\"font-size:14px\">\n    <li>Volume-scale thresholds.<span>Nomination score, support floor and the +2 rule were set on small runs. They need a volume-scale retest — that rides on the Phase 3 whole-novel run, currently paused.</span></li>\n    <li>Cross-script pairs.<span>安娜 vs \"Anna Sprengel\" is invisible to both the language map and structural nomination until the two appear together — co-presence nomination is the open design item, shared with 08a.</span></li>\n    <li>Join events for manual merges.<span><code>novel fix merge</code> merges without emitting the playground join animation. Small follow-up, not yet built.</span></li>\n  </ul>\n</div>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design by sector · 2026-10-24</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\nfunction resetAll(){document.getElementById('events').innerHTML='';document.getElementById('props').innerHTML='';}\nconst steps=[\n {t:2800,cap:[\"A pair the birth pass missed\",\"The spelling twin \\\"Misaka\\\" arrived chapters later and slipped under the birth threshold. It shares scenes and neighbors with 御坂美琴 — structure notices what names missed.\"],run(){document.getElementById('events').innerHTML='<div class=\"verdict warn on\">Nominated · <b>御坂美琴 × \"Misaka\"</b> <span style=\"color:var(--faint)\">shared scenes: 1 · shared neighbors: 2 · score 0.52 — below bar</span></div>';}},\n {t:2800,cap:[\"Scores only grow\",\"Two chapters later the pair shares a second scene. Score 0.67 — past the 0.6 bar, support floor met. The batched checklist confirms: same person.\"],run(){document.getElementById('events').innerHTML+='<div class=\"verdict good on\">Checklist confirms · <b>same entity</b> <span style=\"color:var(--faint)\">score 0.67 · shared scenes 2 · no co-actor events</span></div>';}},\n {t:2200,cap:[\"Audited merge, visible join\",\"The merge runs through the audited fix path — never as a gate proposal — and the playground plays the join animation. One entity, two names, full history.\"],run(){document.getElementById('props').innerHTML='<span class=\"chip\">＋ mergeEntities (audited)</span> <span class=\"chip\">＋ join animation</span>';}},\n];\nrunSectorDemo(steps.map(s=>({...s,reset:resetAll})));\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","storage-connectors.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>10 Storage connectors — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"sectorno\">10</div>\n<div class=\"kicker\">sector 10 · phase B — knowledge</div>\n<h1>Storage connectors — upload, query, rebuild</h1>\n<p>\n  <span class=\"badge v1\">status: bundle implemented · Ladybug interface defined</span>\n  <span class=\"badge\">repo: <code>src/ground/connectors/bundle.ts</code> · <code>src/ground/connectors/ladybug.ts</code> · <code>src/ground/ontology/</code></span>\n  <span class=\"badge\">engines: JSONL bundle + Ladybug (embedded)</span>\n</p>\n<p class=\"sub\">The connectors that upload to and query from the databases — the sector that replaced\nfive Docker services. Two layers with distinct jobs: the <b>bundle</b> (plain JSONL files) is the\nportable source of truth; <b>Ladybug</b> (embedded property graph + Cypher, with native vector and\nfull-text indexes in the same file) is the hot query engine rebuilt from it. All access flows\nthrough one <code>OntologyStore</code> interface.</p>\n\n<table class=\"io\">\n  <tr><th>Inputs</th><td>Approved ChangeSets (writes, via 09 only) · queries from the agent/CLI (reads)</td></tr>\n  <tr><th>Outputs</th><td>Bundle files per novel · Ladybug answers: traversals, FTS hits, vector seeds</td></tr>\n  <tr><th>Depends on</th><td>09 Merge gate (the only writer)</td></tr>\n  <tr><th>Feeds into</th><td>04 Name detector (alias table), 08 Extraction (context), 11 Timelines, 12 Simulation</td></tr>\n</table>\n\n<h2>Demo — build the graph, then ask it something</h2>\n<div class=\"panel\">\n  <div class=\"caption\" id=\"caption\"><span class=\"stepno\">▶</span>The demo plays and loops on its own.</div>\n  <div class=\"progressdots\" id=\"dots\"></div>\n  <div class=\"stage\">\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <div class=\"outcol\"><h4>Bundle — truth (JSONL)</h4><div id=\"bundle\"></div></div>\n      <div class=\"outcol\"><h4>Ladybug — hot engine (.lbug)</h4><div id=\"lbug\"></div></div>\n    </div>\n    <div id=\"query\" style=\"margin-top:12px\"></div>\n  </div>\n  <p style=\"margin-top:12px\"><button class=\"replay\" id=\"replay\">↻ Replay</button></p>\n</div>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>Why two layers:</b> the bundle is diffable, git-friendly, shareable by copying a folder, and engine-independent — insurance if Ladybug is ever swapped. Ladybug is a disposable cache: delete <code>graph.lbug</code>, rebuild, same answers.</li>\n  <li><b>GraphRAG in one engine:</b> a question seeds via vector similarity (event summaries) and FTS (exact names), then Cypher traverses — causal chains, presence, timeline order — from the seeds.</li>\n  <li><b>Closed schema, designed once:</b> Ladybug requires declared node/relation tables (<code>src/ground/ontology/schema.ts</code>). The English vocabulary is schema v1; new types arrive as CLI migrations.</li>\n  <li><b>One writer, many readers:</b> only the merge gate writes; queries open read-only. That matches Ladybug's concurrency model exactly — and the CLI's.</li>\n  <li><b>Retrieval is GRAPH-FIRST (decided 2026-10-21, embeddings deferred):</b> every current need — presence, co-presence, causal chains, scene location, event streams, fork points — is a relational Cypher traversal (<code>src/ground/ontology/retrieval.ts</code>, implemented and tested). No embedding model gets chosen until one of those provably falls short. The fallback design, if that day comes: a lightweight local model on CPU (~500–1000 dims) for wide recall, <b>Jev post-selecting among the top 32</b> for precision.</li>\n  <li><b>Vector dimension is manifest data:</b> the embedding model + dimension are recorded per novel; changing models triggers <code>novel graph reindex</code>, not silent corruption.</li>\n</ul>\n\n<h2>Implementation</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><code>src/ground/ontology/store.ts</code> — the <code>OntologyStore</code> interface every read/write passes through.</li>\n  <li><code>src/ground/connectors/bundle.ts</code> — <code>BundleStore</code>: JSONL append/load, manifest. Working today.</li>\n  <li><code>src/ground/connectors/ladybug.ts</code> — <code>LadybugStore</code>: driver wired (<code>@ladybugdb/core</code> + schema DDL); <code>novel graph build|reindex</code> rebuilds the disposable graph from the JSONL bundle, and live runs query it.</li>\n  <li>CLI surface: <code>novel graph build|reindex</code>, <code>novel bundle export|import</code>, <code>novel query</code>, <code>novel search</code>.</li>\n</ul>\n\n<h2>Open questions — storage</h2>\n<div class=\"panel\">\n  <ul class=\"tight oq\" style=\"font-size:14px\">\n    <li>Embedding provider — <span class=\"status plan\">deferred 2026-10-21</span><span>Graph-first: no embedding model until relational Cypher is proven insufficient for a concrete need. Fallback design stands by: local CPU model ~500–1000 dims + Jev top-32 post-selection.</span></li>\n    <li>Incremental sync.<span>After each approved block, append deltas to Ladybug incrementally, or rebuild per block? Rebuild is simpler and safe; incremental is faster for long novels. Where's the crossover?</span></li>\n    <li>Library layout.<span>Many novels, one user: a <code>novels/</code> library folder with per-novel bundles — plus a cross-novel index? (Cross-novel character universes are a real light-novel pattern…)</span></li>\n    <li>Bundle in git.<span>Should a novel's bundle live in its own git repo for history/diffing of merges? ChangeSets map naturally to commits.</span></li>\n  </ul>\n</div>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design by sector · v0.1 · 2026-10-21</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\nfunction resetAll(){document.getElementById('bundle').innerHTML='';document.getElementById('lbug').innerHTML='';document.getElementById('query').innerHTML='';}\nconst steps=[\n {t:2600,cap:[\"Approved merges land in the bundle\",\"Each novel is a folder of JSONL: entities, relations, events, scenes, timelines, branches + a manifest. Plain text — diff it, copy it, version it.\"],run(){document.getElementById('bundle').innerHTML=['entities.jsonl','relations.jsonl','events.jsonl','scenes.jsonl','timelines.jsonl','branches.jsonl','manifest.json'].map(f=>`<div><span class=\"chip\">${f}</span></div>`).join('');}},\n {t:2600,cap:[\"graph build → Ladybug\",\"The hot engine is built from the bundle and indexed: HNSW vector index over event summaries, BM25 full-text over names and summaries. Delete the .lbug and this step recreates it exactly.\"],run(){document.getElementById('lbug').innerHTML='<span class=\"chip\">graph.lbug</span><div style=\"margin-top:6px\"><span class=\"chip\">vector index · HNSW · cosine</span> <span class=\"chip\">FTS · BM25</span> <span class=\"chip\">Cypher ready</span></div>';}},\n {t:3200,cap:[\"Query: seed, then traverse\",\"“Who was at the café when Uiharu arrived?” — FTS seeds the name, vector seeds the event, Cypher walks PRESENT_IN from the scene. One engine, one query path.\"],run(){document.getElementById('query').innerHTML='<div class=\"verdict good on\">Q: Who was at the café when Uiharu arrived?<br>seed(FTS): 初春饰利 → evt_…41 · traverse: evt —IN_SCENE→ Scene B —PRESENT_IN⁻¹→ <b>Mikoto · Kuroko · Uiharu</b></div>';}},\n];\nrunSectorDemo(steps.map(s=>({...s,reset:resetAll})));\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","timeline-forking.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>11 Timelines &amp; forking — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amb
