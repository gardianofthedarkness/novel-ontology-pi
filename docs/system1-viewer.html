nce scoring</li>\n      <li><b>Simulation v1</b> (12): one character, folded state, voice from their own turns, Jev referee in flag-only mode. <span style=\"color:var(--dim)\">Design ratified 2026-10-22 (decision #10): every character is a state machine — their state (emotion, knowledge, goals, relationships, location, possessions) is a chain over the timeline, folded deterministically from canon deltas up to any time point; the stochastic element enters only when simulation generates forward from a folded snapshot at a fork.</span></li>\n    </ul>\n    <p class=\"mile\">Milestone: pick a time point, fork the world, talk to someone who lives there.</p>\n  </div>\n\n  <div class=\"rphase\">\n    <h3>Phase 5 — Expansion <span class=\"status plan\">planned</span></h3>\n    <ul>\n      <li>Multi-character simulation (12) · branch auto-discovery (11) · auto-approval envelope (09)</li>\n      <li>Bundle-in-git (10) · candidate patches: addressee, state-change, event-worthiness, causal-candidate, coreference, foreshadowing</li>\n      <li>Discord as a thin client over the CLI</li>\n    </ul>\n    <p class=\"mile\">Milestone: the platform the original Discord bot wanted to be — on the new foundation.</p>\n  </div>\n\n</div>\n\n<h2>Decision log</h2>\n<table class=\"dec\">\n  <tr><th style=\"width:36px\">#</th><th>Decision</th><th>Choice</th><th style=\"width:150px\">Status</th></tr>\n  <tr><td>1</td><td>First test novel</td><td>Re-ingest the legacy <i>Index</i> corpus</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>2</td><td>Jev access</td><td>His own TypeSafe/Jev API, via the CLI secure store (PR #11); verified live 2026-10-21</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>3</td><td>Work LLM for testing</td><td>DeepSeek API (his), via the Pi provider layer</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>4</td><td>Embedding model</td><td><b>Deferred</b> (revised 2026-10-21): graph-first — verify relational Cypher can't satisfy our needs before adding any embedding model. Fallback if needed: lightweight local CPU model (~500–1000 dims), vector recall top-32 → Jev post-selection</td><td><span class=\"status plan\">deferred</span></td></tr>\n  <tr><td>5</td><td>Name-candidate generation</td><td>Hybrid: plain-text scan against a <b>cumulative registry of every name ever seen in this novel</b>; a new candidate triggers a <b>zero-context LLM call</b> to extract the new name</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>7</td><td>Language policy (2026-10-22)</td><td><b>Content always in the novel's original language</b> — summaries, state facts, names, everything user-facing derived from the novel (the reader prefers the original language). Intermediate process (review, reasoning, internal notes) may be English. <code>summaryEn</code> is a legacy key name.</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>8</td><td>Transient characters (2026-10-22)</td><td>Do <b>not</b> mint entities for transient, unnamed figures — a random animal, a passing worker, an unnamed \"him\" — when the reviewing agent judges them transient. <b>Exception:</b> a figure clearly being set up (mysterious person, later identity reveal, signaled by a major descriptive block) is kept as an entity. Generalizes the \"no animal nodes\" line from the first live test.</td><td><span class=\"status now\">direction recorded — general rule later</span></td></tr>\n  <tr><td>9</td><td>Presence layering (2026-10-22)</td><td><b>Official:</b> Jev proposes presence per window → extraction refines present/mentioned per scene → the reviewing agent breaks ties (e.g. mentioned-only revisions). \"Mentioned\" requires an actual name hit in the window, never mere non-presence.</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>12</td><td>State materialization semantics (2026-10-22)</td><td>Decision #10 implemented: set_state_change deltas persist as first-class bundle records (state-changes.jsonl) and add_alias materializes at apply — deferred count for both kinds drops to zero and changeset.merged fires truthfully again. Character state is <b>fold-on-read</b> (never a stored row; snapshots only if a real query ever feels slow). <b>Emotions and relationships are ADDITIVE deltas, clamped to [-1, 1]</b> (owner's explicit call); knowledge/goals/possessions are set add/remove, location replaces on non-null. Read surface: <code>novel state &lt;dir&gt; &lt;character&gt; [--at &lt;event&gt;]</code>. This is the snapshot machinery Phase 4 simulation will consume.</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>11</td><td>Segmentation by span selection (2026-10-22)</td><td><b>Scenes:</b> Jev chooses where scenes START over 80-sentence batches (20 look-back); a scene's end is defined by the next chosen start, so scenes tile the block exactly (start = last end + 1). Per-scene end-picks are cross-checks; an open scene at a batch seam gets ONE continuation query with its tail text injected (\"ended\" ratifies its provisional end). <b>Dialogue:</b> exchanges (not lines) via start+end selection, stitched on ≥3-sentence overlap, each linked to one scene — or two when the conversation straddles a cut; turns live inside exchanges. Measured: 77 scenes (median 1) → 10 scenes, exact partition, on the same 15K chars; the 6K prologue went from 32 scenes / 364 proposals to 4 scenes / 99. Retires the per-sentence boundary/kind questions.</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>10</td><td>Character state model (2026-10-22)</td><td><b>Every character is a state machine:</b> state (six dimensions from sector 08) evolves as a chain over chronological time — state at any point = the deterministic fold of all canon state deltas up to that point. Folding canon is <b>not</b> stochastic (it happened); stochastic sampling enters only in simulation, generating forward from a folded snapshot (Phase 4). Materializing the deferred <code>set_state_change</code> proposals into this chain is the prerequisite build.</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>6</td><td>Playground frontend (sector 13)</td><td><b>Reagraph</b> (React, true 3D, clustering/badges built in) + React Flow pipeline strip; <b>standalone-first, host-agnostic</b> — a VS Code webview wrap stays possible later; extension-host research concluded no existing app provides this for free</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>13</td><td>Miniloop pipelining (2026-10-22)</td><td>Blocks stay sequential (registry, counts, presence carry-over), but <b>within one block the independent Jev pipelines run concurrently</b> — block cost = the longest pipeline, not the sum. Stage 1 (PR #27): scene tiling ∥ dialogue selection ∥ name refinement; exchange→scene links are a pure join after all pipelines land. Presence across windows, speaker (needs same-window presence), and extraction (cast threading) stay sequential — true dependencies, not accidents. Measured: 15K miniloop 65s → 44.7s (−31%), same quality.</td><td><span class=\"status done\">✓ decided · stage 1 built</span></td></tr>\n  <tr><td>14</td><td>Eval matching keys (2026-10-22)</td><td>Ratified by the merge of PR #18: two-pass matching (exact id, then semantic-key multiset) with keys — entity = kind + canonical name; event = timeline + whitespace-normalized summary; relation = type + resolved endpoint keys. These keys are the <b>format of record</b>: changing them breaks score comparability across runs. Accepted consequence: real-ingest event scoring is summary-text-exact (strict, deterministic).</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>15</td><td>Agent-activity live view (2026-10-22)</td><td><b>One ontology graph is the source of truth; views are cameras.</b> Clicking agent activity shows new nodes <b>emerging in place, batch by batch</b>, as processing pushes the timeline forward — the working-draft stream (PR #19) rendered in the layered/orbital explorer, ghosts first, resolving on gate verdicts; held/revised proposals get a distinct ghost state. The activity tab accumulates and shines (escalations immediately, verdicts batched silently); agent activity <b>never steals the camera</b> — clicking flies the user to where the agent and System 1 are knitting. Build started 2026-10-22 (Phase B); <b>landed 2026-10-23 as PR #31</b> (supersedes #28), adapted to the streaming-faculty pipeline (decision #16): legacy miniloop, extraction and faculty batches (scene-closed / dialogue-structure / grounding-assembly) all announce through the one serialized publish funnel, and the draft projector renders them in the explorer. Merged tree verified 199/199 + playground build + scripted faculty live proof (26 draft.updated batches before the gate).</td><td><span class=\"status done\">✓ decided · built (PR #31)</span></td></tr>\n  <tr><td>16</td><td>Streaming faculties — the pool system (2026-10-23)</td><td>Live ingestion with a work model now runs a <b>dependency-aware faculty graph</b> (PR #30, merged 2026-10-23; design in <code>docs/faculty-graph.md</code>). Jev keeps scene segmentation and dialogue structure; as each scene <b>closes</b>, scene-local faculties stream concurrently — identity/participants, scene understanding (summary, events, state observations), dialogue alignment, then speaker/turn attribution — under one shared pool (4 concurrent calls, 1 slot reserved for adjudication, 256-call per-block budget, in-run caching only). <b>Bounded System 2 adjudication:</b> unpinned scene choices under 0.85 and speaker choices under 0.80 (routing thresholds, not calibrated probabilities; originals preserved in review notes) get ONE scoped LLM adjudication constrained to the offered options; unresolved speakers stay null. Assembly is deterministic and source-ordered; <b>no faculty output approves or writes canon</b> — the Pi gate is unchanged, state remains the deterministic fold, and continuity previews are explicitly unapproved. Legacy pins (name/presence/window-speaker) route the block to the legacy path with an explicit note; the legacy path also stays available via <code>facultyGraph: false</code>. This supersedes decision #13's hand-scheduled stage-2 overlaps. Small-batch benchmark (493-sentence prologue, 193-sentence annotated sample): strict speech precision 38.7% → 94.1%, named-speaker sentences 0/38 → 30/38, latency −29% — at 3.82× work-model tokens (quality bought with tokens, disclosed; full-volume numbers pending). Scene gains an optional <code>summary</code> field (original language, decision #7).</td><td><span class=\"status done\">✓ decided · built (PR #30)</span></td></tr>\n  <tr><td>17</td><td>Dialogue cards + precision-first semantic gate (2026-10-23)</td><td>Per-turn, sentence-by-sentence speaker assignment is replaced as the <b>default</b> by <b>dialogue cards</b> (PR #35, stacked on PR #34's faculty-scoped S1 DecisionRouter; merged 2026-10-23; contracts in <code>docs/dialogue-card-benchmark.md</code> and <code>docs/semantic-review.md</code>). An exchange is one logical card holding an <b>unordered participant set</b>: membership is decided per candidate (Jev choice ≥0.8, bounded context widening, one shared S2 adjudication per card), alternating speakers never split a card, and no single-winner speaker question runs on the default path. Unresolved candidates are kept as candidates — never guessed — and co-membership implies neither presence nor any directed relation. <code>Scene.dialogues</code> stores stable logical card ids, source spans and participants (scene-cut fragments share identity; audited entity merges/removals remap memberships); legacy scopes remain via <code>NOVEL_DIALOGUE_SCOPE=scene|block-turn</code>. Consequential facts are gated <b>individually</b>: proposals decompose into semantic facts (identity / alias / actors / presence / mention / location / turn / dialogue-member / relation / state) bound to a revision digest over changeset + source + canonical context, and apply materializes only accepted facts. <code>--auto-approve</code> with a live work model is <b>rejected by design</b> (the flag survives for legacy miniloop-only smoke runs). Independent re-check before landing caught a blocker — extraction emitted duplicate event actors, which the semantic validator rejects — fixed at assembly (<code>d72a07d</code>) with regression tests; live acceptance on the GT vol-1 slice: gate-held changeset → 245 facts paged and accepted → approve applied 270 proposals, 0 deferred/rejected facts, all card participants resolving to bundle entities. Merged tree verified <b>254/254</b> core tests (tree hash identical to the tested branch head).</td><td><span class=\"status done\">✓ decided · built (PRs #34 + #35)</span></td></tr>\n  <tr><td>18</td><td>Entity identity: alias-at-birth + EM faculty + fragment-at-birth (2026-10-23)</td><td>Identity is resolved <b>at birth, not after</b> (PR #36, merged 2026-10-23). Real-tested policy first: on hand-labeled descriptive records, universal structural matching scored 2/5 while alias-at-birth scored 4/5 with 0 false attachments — reading the passage beats trusting derived structure, which inherits extraction noise. The identity faculty flags <b>descriptive</b> declarations; before minting, ONE strict Jev choice round over the scene passage attaches the description as an alias of an existing character at confidence ≥0.85 (<code>BIRTH_ALIAS_THRESHOLD</code>); only true newcomers mint entities. <b>Fragment-at-birth</b> covers the live duplicate class the structural check cannot see — surname/given-name fragments partition scenes (0 shared scenes with their full-name twins): strict containment over variant-folded name forms (shorter side ≥2 chars) triggers the same Jev round and folds the fragment as a form; declines are remembered in <code>matching.json</code> and suppress only the birth question, never later matching; the miniloop path gets evidence injection into its existing name questions only, and extraction's cast-name mint path is a named v1 limit. The <b>EM faculty</b> remains the backstop for named-record twins and under-threshold declines: strict structural nomination (score ≥0.6, support floor ≥2 shared scenes or ≥3 shared neighbors, <b>zero co-actor events</b> as a veto, alias-linked pairs excluded), one batched Jev checklist per pass, confident merges through the audited <code>mergeEntities</code> path (which now also rewires <code>state-changes.jsonl</code>). Cadence: per-block pass over pairs touching new entities after apply — including at the gate-mode <code>changeset approve</code> path; old×old pairs sweep only at chapter close, skipping remembered-distinct pairs unless shared evidence grew by +2. <b>Composition with decision #17 verified at rebase:</b> birth attachments reach the reviewer as ordinary identity/alias facts, EM merges are post-apply maintenance on applied canon, and the revision digest fails closed if a merge lands mid-review. <b>Join animation</b> (PR #37): matches emit <code>entity.merged</code> / <code>entity.distinct</code> transport facts; the playground joins the dropped node into the survivor in place in both renderers (orbital morph, classic glide) and applies the merge to its world state on settle, without stealing the camera. Live verification on the 15K GT vol-1 slice (real Jev + DeepSeek): 蜂蜜色少女 born as 食蜂操祈's alias @0.99, 双马尾少女 folded to 白井黑子 @1.00, fragments 御坂/美琴 folded to 御坂美琴 @0.94–0.96, traps refused (unnamed teacher and little girl minted NEW); 12/12 attachments/folds correct across offline policy checks + live runs, 0 false; EM nominated 0 pairs at this graph size — an honest zero, below its structural firing scale. Rebased onto the semantic-gate main and landed by tree push (the PRs' GitHub conflict flags were phantom, from snapshot branch history); merged tree verified <b>273/273</b> core tests + playground build.</td><td><span class=\"status done\">✓ decided · built (PRs #36 + #37)</span></td></tr>\n  <tr><td>19</td><td>Variant mapping belongs to language management, not the design (2026-10-23)</td><td>How a name is folded into a matching key is a <b>language</b> fact, not a matching-design fact (PR #33, merged 2026-10-23). The full OpenCC fold (4,335 chars: JP shinjitai inverted from JPVariants + TW/HK variants, all through TSCharacters to one simplified canonical) is <b>data</b> behind the <code>LanguageMap</code> registry in <code>src/ground/language/languageMap.ts</code> — the only module that touches the generated table. Design code (extraction's <code>formToId</code> registry, entity nomination, fragment containment) consumes only the <code>nameForms</code> facade (<code>foldVariants</code> / <code>formKey</code>). Swapping the language situation = registering a new table-built map or selecting one (explicit id → <code>setActiveLanguageMap()</code> → <code>NOVEL_LANGUAGE_MAP</code> env → default <code>zh-variants</code>; <code>identity</code> ships as the no-fold built-in; unknown ids fail loudly). Keys only — stored names are never rewritten (decision #7). Proven by swap tests: a toy one-entry map changes <code>formKey</code> behavior through the facade with zero call-site changes. Rebased over the identity system (decision #18) so fragment-at-birth folds through the same facade; landed by tree push; merged tree verified <b>281/281</b>.</td><td><span class=\"status done\">✓ decided · built (PR #33)</span></td></tr>\n  <tr><td>20</td><td>Open the repo: structure audit, leveled docs, agent-native install (2026-10-23)</td><td>Direction set 2026-10-23: before scaling further, <b>reexamine the repo structure</b> — hunt the remaining coupling of the kind decision #19 removed, and make the <b>core idea and the core logical data pipeline</b> clear enough to be interpreted at different levels (one-paragraph idea → pipeline map → module contracts, one source of truth). <b>Lower the level of entry:</b> the main page must be quickly installable to Pi, Codex, Claude Code and all major agents — one-step install per host, validated Skill packaging, clone-to-first-ingest without reading the design site. Organized as three decoupled tracks (A: structure &amp; decoupling audit; B: leveled pipeline documentation; C: agent-native front door) with disjoint file ownership, so at least three people/agents can work in parallel from 2026-10-24. Design-owner keep-list unchanged: schema changes and new retrieval functions still route back for ratification.</td><td><span class=\"status now\">✓ decided · tracks open</span></td></tr>\n  <tr><td>21</td><td>The hierarchy: Skill + CLI + Adaptor + Frontend; the Digger and the Solidifier (2026-10-24)</td><td>The dashboard — and with it the project's self-description — is restructured around the <b>product hierarchy</b>. The core idea is four parts: a <b>Skill</b> (workflows for the host agent), a <b>CLI</b> (all machinery), one <b>Adaptor</b> that makes Skill + CLI installable into every popular agent host (Pi, Codex, Claude Code, peers — Track C builds it), and a <b>Frontend</b> (the playground, watching the event stream). The CLI holds two command groups: <b>data extraction</b> and <b>simulation</b> — the simulation group is <b>kept empty for now</b>, with timelines/forking as its foundation. Data extraction is told as <b>tunnel building</b>: the <b>⛏ Digger</b> — sectioning, the miniloop/faculty graph (S1 Jev decisions + bounded S2 adjudication), the extraction faculties — digs through the raw earth of the text one block at a time, advancing along the timeline and producing ChangeSets (loose rock); the <b>🧱 Solidifier</b> — semantic merge-gate review, apply, the EM faculty per block and <b>cross-sectional EM</b> in the chapter sweep — lines the tunnel behind the face so dug ground becomes canon that holds. The <b>Skill mirrors the CLI</b>: its subskills are structured by the same groups (a data-extraction subskill with digger and solidifier references; a simulation subskill, empty) — Track C implements that packaging. Sector pages keep their 01–13 pipeline numbers and demos; nav and overview group them under the hierarchy. Also verified in passing: no Codex upload had landed on main when this restructure was made (main was <code>2b50d4e</code>), and the old overview graph predated the faculty processor — it drew the original miniloop chain with no faculty graph, no S2 topology and no EM; the new overview topology shows the processor as built (decisions #16–#19).</td><td><span class=\"status done\">✓ decided · built (dashboard)</span></td></tr>\n  <tr><td>22</td><td>The codebase wears the hierarchy; the Adaptor follows REA's pattern (2026-10-24)</td><td>The <code>src/</code> tree now has the same shape as the dashboard (decision #21). <b><code>src/digger/</code></b> — intake (sectioning + blocks, from <code>text/</code>), <code>autostep/</code>, <code>processing/</code>, <code>extraction/</code>. <b><code>src/solidifier/</code></b> — <code>merge/</code> (ChangeSets, semantic gate, apply), <code>matching/</code> (entity match, EM faculty, fragment-at-birth), <code>maintenance/</code> (audited fix path). <b><code>src/ground/</code></b> — <code>ontology/</code>, <code>connectors/</code>, <code>language/</code> (the language management path), <code>events/</code>, <code>watch/</code>, <code>workspace/</code>. <b><code>src/cli/</code></b> — the entry point and config, with commands split by group: <code>commands/extract/</code> (ingest, changeset tooling via solidifier modules, match, fix, recall, eval, inspect), <code>commands/shared/</code> (query/search/timeline, jev, llm), and <code>commands/simulate/</code> — the simulation group as an <b>explicit empty placeholder</b> (<code>SIMULATE_GROUP</code> + README), per \"keep it empty for now\". Pure restructure: 71 files moved, every import rewritten mechanically (resolved against the old tree, re-relativized), zero behavior change, and every pointer updated in the same pass — the package <code>bin</code>, <code>tools/pi-review</code>, test CLI-path literals, README/DESIGN, and the dashboard's own implementation mappings (viewer regenerated). Suite <b>303/303</b> on the final tree (the 281 pre-restructure tests carried over unchanged, +4 restructure tests, +18 from PR #39 — the frontend live-console PR was merged FIRST and this restructure was then redone on top of it, so the moved files carry its changes). <b>Adaptor:</b> researched how REA — <a href=\"https://github.com/morluto/rea\">morluto/rea</a>, \"Reverse Engineer Anything/Everything\" — adapts one skill+CLI/MCP product to many agent hosts: one canonical skill set (<code>.agents/skills/</code> + root <code>AGENTS.md</code> canon), one setup command (<code>npx rea-agents setup</code>) that computes a plan, shows it for approval, applies it <b>with backups and rollback</b>, a per-host \"client\" descriptor layer absorbing each host's config quirks (Claude Code strict JSON, Codex TOML edited preserving comments, Gemini workspace trust; Pi, OpenCode, Hermes, Qwen and more), and <b>one acceptance test per host</b>. Ours mirrors it (<code>adapters/README.md</code> is the design of record): the canonical Skill stays in <code>skills/</code>; per-host differences live ONLY in the descriptor registry <code>src/adapters/hosts.ts</code> (Pi / Codex / Claude Code specified, Cursor / Gemini CLI stubs; paths marked <code>verified: false</code> until confirmed against each host's docs) — the decision-#19 decoupling applied to agent hosts. The setup engine (<code>novel setup [--agent …] [--plan]</code>) remains Track C's build.</td><td><span class=\"status now\">⏳ built · in review (PR #38)</span></td></tr>\n</table>\n\n<h2>How open questions map to phases</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>Phase 1:</b> block cutting &amp; chapter detection (01) · embedding model pick (10) · state dimensions default from legacy (08)</li>\n  <li><b>Phase 2:</b> thresholds &amp; window size (07) · off-screen presence (05) · escalation budget (07)</li>\n  <li><b>Phase 3:</b> revision granularity, review digest, auto-approval pre-checks (09) · incremental sync, library layout, bundle-in-git (10) · scene granularity &amp; soft boundaries (02) · thought conventions &amp; nested quotation (03) · collisions &amp; title-vs-alias (04) · groups &amp; non-person presence (05)</li>\n  <li><b>Phase 4:</b> divergence measure, branch-of-branch, canon updates under branches (11) · referee strictness, talk-becomes-story threshold (12)</li>\n  <li><b>Phase 5:</b> branch auto-discovery (11) · multi-character turn-taking (12) · voice drift control (12)</li>\n</ul>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design dashboard · roadmap v0.3 · updated 2026-10-22</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","sectioning.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>01 Sectioning — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"sectorno\">01</div>\n<div class=\"kicker\">sector 01 · phase A — structure</div>\n<h1>Sectioning — intake &amp; auto sentence segregation</h1>\n<p>\n  <span class=\"badge v1\">status: implemented</span>\n  <span class=\"badge\">repo: <code>src/digger/intake/sectioning.ts</code></span>\n  <span class=\"badge\">model: none — deterministic code</span>\n</p>\n<p class=\"sub\">The front door of the whole system. A novel arrives as one big text; this sector cuts it\ninto <b>blocks</b> (a chapter, or a long block) and segregates each block into <b>sentences</b> with\nstable IDs and character offsets. Every later decision, scene, event and proposal cites these IDs —\nsectioning is the provenance anchor for the entire ontology.</p>\n\n<table class=\"io\">\n  <tr><th>Inputs</th><td>Raw novel file (EPUB / TXT), in any language</td></tr>\n  <tr><th>Outputs</th><td>Blocks → sentences: <code>{ id, index, paragraphIndex, text, startOffset, endOffset }</code></td></tr>\n  <tr><th>Depends on</th><td>Nothing — first sector in the pipeline</td></tr>\n  <tr><th>Feeds into</th><td>Every patch (02–06), the miniloop engine (07), extraction (08)</td></tr>\n</table>\n\n<h2>Demo — a block segregates itself</h2>\n<div class=\"panel\">\n  <div class=\"caption\" id=\"caption\"><span class=\"stepno\">▶</span>The demo plays and loops on its own.</div>\n  <div class=\"progressdots\" id=\"dots\"></div>\n  <div class=\"stage\">\n    <div id=\"rawblock\" style=\"font-size:14px;color:var(--dim);opacity:.3;transition:opacity .5s\">\n      御坂美琴推开咖啡店的门，环顾四周。「姐姐大人，您迟到了十分钟。」白井黑子坐在窗边，晃了晃手中的杯子。「初春说她马上就到。」话音未落，初春饰利推门进来。「抱歉，我来晚了！」美琴想起黑子早上提到的风纪委员巡逻。</div>\n    <div class=\"items\" id=\"sentitems\"></div>\n    <div id=\"sumrow\" style=\"margin-top:8px\"></div>\n  </div>\n  <p style=\"margin-top:12px\"><button class=\"replay\" id=\"replay\">↻ Replay</button></p>\n</div>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>Rule zero lives here:</b> never ask a model what code can compute exactly. Splitting text is exactly computable, so no model — Jev or LLM — is ever consulted in this sector.</li>\n  <li><b>Language-aware rules:</b> CJK terminal punctuation (。！？) and quote nesting (「」『』) close sentences; ellipses (……) don't split mid-thought; English abbreviations (Dr., e.g.) and decimals (3.5) don't split either.</li>\n  <li><b>Stable IDs:</b> <code>b0007_s0003</code> = block 7, sentence 3. IDs never change after assignment, so a ChangeSet proposal can cite a sentence forever.</li>\n  <li><b>Offsets are evidence:</b> every sentence knows its exact character range in the source block, so any ontology node can be traced back to the literal text that produced it.</li>\n  <li><b>Blocks are the processing unit:</b> ingestion rolls block by block (see sector 09); a block is one chapter when chapters exist, otherwise a long slice of text.</li>\n</ul>\n\n<h2>Implementation</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><code>src/digger/intake/sectioning.ts</code> — <code>sectionBlock(text, blockIndex)</code>; paragraph split first, then terminator scan with a closer-absorption run (。』 ?! etc.).</li>\n  <li>Exposed as <code>novel section &lt;file&gt;</code> — works today, prints JSON.</li>\n  <li>Tests: <code>test/sectioning.test.ts</code> — CJK quotes, English abbreviations/decimals, paragraph tracking. All passing.</li>\n  <li>Real-corpus fixes (decision #29): credit-cluster demotion, body-less heading demotion, and heading-only block merge — the real corpus went from 13 chapters / 5 tiny blocks to 7 / 0 in both volumes.</li>\n</ul>\n\n<h2>Open questions — sectioning</h2>\n<div class=\"panel\">\n  <ul class=\"tight oq\" style=\"font-size:14px\">\n    <li>Block cutting.<span>How are chapters detected across EPUB structures and raw TXT conventions (第X章 headings, TOC entries, volume splits)? When a book has no chapters, how long is a \"long block\", and should blocks overlap by a few sentences for context?</span></li>\n    <li>More languages' rules.<span>European quotes («» „ \"), Korean spacing, Japanese vertical-text artifacts — which languages get hand-tuned rules in v1, and which fall back to a generic splitter?</span></li>\n    <li>Non-narrative matter.<span>Author notes, afterwords, illustrations' captions, tables — sectioned like prose, flagged, or skipped?</span></li>\n    <li>Damaged text.<span>OCR errors and missing punctuation in fan-translated files — how much fuzz should the splitter tolerate before a block is flagged for the merge gate?</span></li>\n  </ul>\n</div>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design by sector · v0.1 · 2026-10-21</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\nconst SENTS=[\"御坂美琴推开咖啡店的门，环顾四周。\",\"「姐姐大人，您迟到了十分钟。」\",\"白井黑子坐在窗边，晃了晃手中的杯子。\",\"「初春说她马上就到。」\",\"话音未落，初春饰利推门进来。\",\"「抱歉，我来晚了！」\",\"美琴想起黑子早上提到的风纪委员巡逻。\"];\nconst box=document.getElementById('sentitems');\nbox.innerHTML=SENTS.map((t,i)=>`<div class=\"item\" id=\"si${i}\"><small>b0007_s000${i} · offset ${i*14}–${i*14+13}</small>${t}</div>`).join('');\nconst steps=[\n {t:2000,cap:[\"A block arrives as raw text\",\"One chapter, unpunctuated by structure — a single string. Nothing downstream can cite anything yet.\"],run(){document.getElementById('rawblock').style.opacity=1;}},\n {t:2600,cap:[\"Segregation: terminators + quote closers\",\"The splitter scans for terminal punctuation, absorbing closing quotes (。」) into the sentence they end. Seven sentences appear — each with its ID.\"],run(){SENTS.forEach((_,i)=>document.getElementById('si'+i).classList.add('on'));}},\n {t:2400,cap:[\"IDs + offsets are stamped\",\"Every sentence now carries a stable ID and its exact character range. This is the last time this sector runs — and the first thing every other sector reads.\"],run(){document.getElementById('sumrow').innerHTML='<span class=\"chip\">7 sentences</span> <span class=\"chip\">1 block</span> <span class=\"chip\">0 model calls</span> <span class=\"chip\">provenance: ready</span>';}},\n];\nrunSectorDemo(steps.map(s=>({...s,reset(){document.getElementById('rawblock').style.opacity=.3;SENTS.forEach((_,i)=>document.getElementById('si'+i).classList.remove('on'));document.getElementById('sumrow').innerHTML='';}})));\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","scene-boundary.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>02 Scene boundary — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"sectorno\">02</div>\n<div class=\"kicker\">sector 02 · phase A — structure · decision patch</div>\n<h1>Scene boundary — where scenes start</h1>\n<p>\n  <span class=\"badge v1\">status: implemented (span selection)</span>\n  <span class=\"badge\">repo: <code>src/digger/autostep/patches/scene-boundary.ts</code></span>\n  <span class=\"badge\">model: Jev · <span class=\"prim choice\">choice</span> (span selection)</span>\n</p>\n<p class=\"sub\">Scenes are the unit everything else keys off: presence is per-scene, dialogue groups\ninside scenes, and extraction reads one scene at a time.</p>\n<div class=\"panel\" style=\"border-color:var(--teal)\"><b>Redesigned 2026-10-22 — span selection.</b>\nThe per-sentence design below the line is retired: asking one <code>noul</code> per sentence\n(\"does a scene begin here?\") over disjoint 40-sentence windows produced 77 scenes with a\nmedian size of ONE sentence on real text. Jev now <b>points</b>: over 80-sentence batches with a\n20-sentence look-back it chooses where scenes <b>start</b>; each scene's end is defined by the next\nchosen start, so scenes tile the block exactly (start = last end + 1). An end-pick per scene serves\nas cross-check, and a scene open at a batch seam gets one continuation query with its tail text\ninjected. Measured reason starts rule: asked for the end of a scene whose start was imposed, Jev\npicks the batch's last sentence at 0.95 confidence and the block collapses into one scene; asked to\nchoose starts, it finds the real joints (10 scenes, exact partition, on the same 15K chars).\nThe demo below still illustrates the retired scanning design.</div>\n\n<table class=\"io\">\n  <tr><th>Inputs</th><td>The block's sentences (IDs + text), in 80-sentence batches with a 20-sentence look-back; the open scene's tail at each seam</td></tr>\n  <tr><th>Outputs</th><td>Scene spans — ordered sentence-ID ranges, into shared context for patches 03–06 and extraction</td></tr>\n  <tr><th>Depends on</th><td>01 Sectioning</td></tr>\n  <tr><th>Feeds into</th><td>03 Dialogue, 05 Presence, 08 Extraction (per-scene unit)</td></tr>\n</table>\n\n<h2>Demo — scanning for the seam</h2>\n<div class=\"panel\">\n  <div class=\"caption\" id=\"caption\"><span class=\"stepno\">▶</span>The demo plays and loops on its own.</div>\n  <div class=\"progressdots\" id=\"dots\"></div>\n  <div class=\"stage\">\n    <div class=\"items\" id=\"items\"></div>\n    <div class=\"items\" id=\"spans\"></div>\n  </div>\n  <p style=\"margin-top:12px\"><button class=\"replay\" id=\"replay\">↻ Replay</button></p>\n</div>\n\n<h2>Decision questions</h2>\n<div class=\"qcard\"><b>scene_start</b> · <span class=\"prim choice\">choice</span> — Which sentence id BEGINS the next scene at or after the anchor (place change, time skip, viewpoint shift), or NONE? The boundary detector: each chosen start closes the open scene at start − 1.</div>\n<div class=\"qcard\"><b>scene_end</b> · <span class=\"prim choice\">choice</span> — Which sentence id is the LAST sentence of the scene that begins at the given start? Advisory: cross-check (a chosen start far past it flags a possible missed boundary) and the provisional end a seam can ratify.</div>\n<div class=\"qcard\"><b>scene_seam</b> · <span class=\"prim choice\">choice</span> — Shown the open scene's tail tex
