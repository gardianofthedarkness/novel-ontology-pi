er);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"sectorno\">11</div>\n<div class=\"kicker\">sector 11 · phase C — use</div>\n<h1>Timelines &amp; forking — parallel universes from one canon</h1>\n<p>\n  <span class=\"badge open\">status: partially implemented — timeline list/show built, fork create not yet built</span>\n  <span class=\"badge\">repo: planned <code>src/timeline/</code> · types in <code>src/ground/ontology/types.ts</code></span>\n  <span class=\"badge\">decision assist: Jev · <span class=\"prim score\">score</span> / <span class=\"prim choice\">choice</span></span>\n</p>\n<p class=\"sub\">Canon is an event-sourced timeline: immutable, totally ordered. A <b>fork</b> is what the\nuser came for — they browse the timeline, <b>select a time point</b>, and a parallel universe\nbranches off there: sharing everything before the point, diverging after it, with canon never mutated.</p>\n\n<table class=\"io\">\n  <tr><th>Inputs</th><td>The canon event stream (10) + the user's chosen fork event + a branch label</td></tr>\n  <tr><th>Outputs</th><td><code>Branch { parentTimelineId, forkEventId, label }</code> + a character-state snapshot at the fork point; branch delta events thereafter</td></tr>\n  <tr><th>Depends on</th><td>08 Extraction (events), 10 Storage</td></tr>\n  <tr><th>Feeds into</th><td>12 Simulation (runs on canon or on a branch)</td></tr>\n</table>\n\n<h2>Demo — pick a point, split the world</h2>\n<div class=\"panel\">\n  <div class=\"caption\" id=\"caption\"><span class=\"stepno\">▶</span>The demo plays and loops on its own.</div>\n  <div class=\"progressdots\" id=\"dots\"></div>\n  <div class=\"stage\">\n    <div class=\"tlwrap\" style=\"height:120px\">\n      <div class=\"tlline\"></div>\n      <div class=\"tlbranch\" id=\"branchline\" style=\"top:64px\"></div>\n      <div id=\"dotsbox\"></div>\n      <div class=\"tllabel\" style=\"left:6%\">ch.1<br>meeting</div>\n      <div class=\"tllabel\" style=\"left:30%\">ch.4<br>the promise</div>\n      <div class=\"tllabel\" style=\"left:54%\">ch.7<br>the confession</div>\n      <div class=\"tllabel\" style=\"left:78%\">ch.9<br>the accident</div>\n      <div class=\"tllabel\" id=\"branchlbl\" style=\"left:54%;top:86px;color:var(--teal);opacity:0;transition:opacity .6s\">branch: “she says yes”</div>\n    </div>\n    <div id=\"forkout\"></div>\n  </div>\n  <p style=\"margin-top:12px\"><button class=\"replay\" id=\"replay\">↻ Replay</button></p>\n</div>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>Fork = pointer + snapshot + deltas:</b> a branch stores its fork event, a fold of character states at that point, and only its own new events. No copying the canon prefix — branches are cheap, so users can keep many.</li>\n  <li><b>Canon is never mutated:</b> branch events live on the branch. Deleting a branch loses nothing canonical.</li>\n  <li><b>Browsing is importance-led:</b> the fork-point browser lists events by chapter with their importance scores (extraction + the event-worthiness candidate), so the interesting seams surface first — but any event is a legal fork point.</li>\n  <li><b>Decision assist, not decision maker:</b> Jev can score \"how divergent would a fork here be\" and match \"which existing branch is this conversation closest to\" (the legacy UniverseFingerprint idea, rebuilt on distributions) — the user still picks the point.</li>\n  <li><b>Salvaged design:</b> the legacy repo's TimelineNode tree and branch auto-selection live on here, re-expressed on the event-sourced model.</li>\n</ul>\n\n<h2>Implementation</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li>Types ready: <code>Branch</code>, <code>CharacterStateAtPoint</code> in <code>src/ground/ontology/types.ts</code>; <code>FORKS_FROM</code> relation + <code>Branch</code> node table in schema v1.</li>\n  <li>CLI surface: <code>novel timeline list|show</code> — built and working. <code>novel fork create</code> does <b>not</b> exist yet; it is the simulation group's foundation work, not a shipped command.</li>\n  <li>State snapshot = the deterministic fold over the canon prefix (<code>foldStateAt</code> in <code>src/ground/ontology/state.ts</code>, decision #12) — not a store sketch method.</li>\n</ul>\n\n<h2>Open questions — timelines &amp; forking</h2>\n<div class=\"panel\">\n  <ul class=\"tight oq\" style=\"font-size:14px\">\n    <li>Branch-of-branch.<span>Forking from inside a branch — supported by the model (parent can be any timeline), but does the UX and the state fold stay comprehensible two levels deep?</span></li>\n    <li>Divergence measurement.<span>How do we quantify how far a branch has drifted (event overlap, state distance, relationship deltas) — and does the user see a number, a summary, or both?</span></li>\n    <li>Branch discovery.<span>When a simulation conversation drifts, should the system suggest \"this now matches branch X\" (legacy auto-selection at similarity &gt; 0.6) or wait to be asked?</span></li>\n    <li>Canon updates under live branches.<span>If ingestion later adds canon events before a fork point (a re-merge), do branch snapshots pin the old fold or re-fold? Pinning is safer; say so explicitly.</span></li>\n  </ul>\n</div>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design by sector · v0.1 · 2026-10-21</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\nconst POS=[6,30,54,78,94];\nconst dotsbox=document.getElementById('dotsbox');\ndotsbox.innerHTML=POS.map((p,i)=>`<div class=\"tldot\" id=\"d${i}\" style=\"left:${p}%\"></div>`).join('')+\n  POS.slice(3).map((p,i)=>`<div class=\"tldot\" id=\"bd${i}\" style=\"left:${p+4}%;top:58px;border-color:var(--teal)\"></div>`).join('');\nfunction resetAll(){POS.forEach((_,i)=>document.getElementById('d'+i).className='tldot');document.getElementById('branchline').style.width=0;document.getElementById('branchlbl').style.opacity=0;document.getElementById('forkout').innerHTML='';}\nconst steps=[\n {t:2400,cap:[\"Canon: one ordered event stream\",\"Every merged event takes its place on the canon timeline — chapter-anchored, importance-scored, immutable.\"],run(){POS.forEach((_,i)=>document.getElementById('d'+i).classList.add('hit'));}},\n {t:2600,cap:[\"The user selects the time point\",\"Not the system — the user. Here: the confession in chapter 7. Everything before it is shared history; everything after is negotiable.\"],run(){document.getElementById('d2').classList.add('fork');document.getElementById('forkout').innerHTML='<span class=\"chip\" style=\"border-color:var(--amber)\">fork point: evt_…77 · the confession · importance 0.92</span>';}},\n {t:2800,cap:[\"The branch forks\",\"A state snapshot is folded at the fork point (who knows what, who feels what, who holds what). The branch appends only its own delta events — canon, above, continues untouched.\"],run(){const bl=document.getElementById('branchline');bl.style.left='54%';bl.style.width='42%';document.getElementById('branchlbl').style.opacity=1;document.getElementById('forkout').innerHTML+=' <span class=\"chip\">＋ Branch “she says yes” · snapshot ×3 characters · deltas: 0</span>';}},\n];\nrunSectorDemo(steps.map(s=>({...s,reset:resetAll})));\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","simulation.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>12 Simulation — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"sectorno\">12</div>\n<div class=\"kicker\">sector 12 · phase C — use</div>\n<h1>Simulation — characters who know only what they should</h1>\n<p>\n  <span class=\"badge open\">status: designed, not yet implemented</span>\n  <span class=\"badge\">repo: planned <code>src/simulation/</code> · CLI <code>novel simulate</code></span>\n  <span class=\"badge\">model: work LLM (generation) + Jev (gates)</span>\n</p>\n<p class=\"sub\">The payoff sector. A simulated character is not a persona prompt — it is a\n<b>state folded from the event stream</b> up to a point on a timeline (canon or a branch):\nwhat they know, feel, want, and how they speak, all derived from what actually happened to them\n<i>by then</i>. Talk to Mikoto before the confession and after it, and you talk to two honestly\ndifferent people.</p>\n\n<table class=\"io\">\n  <tr><th>Inputs</th><td>Character + timeline/branch + current point · folded state · voice evidence (their turns, 06)</td></tr>\n  <tr><th>Outputs</th><td>In-character replies; new branch events when the conversation itself advances a branch's story</td></tr>\n  <tr><th>Depends on</th><td>10 Storage (state fold), 11 Timelines (which world), 06 Turns (voice)</td></tr>\n  <tr><th>Feeds into</th><td>11 Branches (conversation events can become branch deltas — via the merge discipline, not silently)</td></tr>\n</table>\n\n<h2>Demo — state first, voice second</h2>\n<div class=\"panel\">\n  <div class=\"caption\" id=\"caption\"><span class=\"stepno\">▶</span>The demo plays and loops on its own.</div>\n  <div class=\"progressdots\" id=\"dots\"></div>\n  <div class=\"stage\">\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <div class=\"outcol\" style=\"max-width:300px\"><h4>御坂美琴 · state at evt_…77 (canon)</h4>\n        <div style=\"font-size:12.5px\">knows about the patrol <div class=\"statebar\"><i id=\"sb1\"></i></div></div>\n        <div style=\"font-size:12.5px\">trust in Kuroko <div class=\"statebar\"><i id=\"sb2\"></i></div></div>\n        <div style=\"font-size:12.5px\">awareness of the experiment <div class=\"statebar\"><i id=\"sb3\"></i></div></div>\n        <p style=\"font-size:12px;color:var(--faint);margin:6px 0 0\">knowledge she gains in ch. 9 is <b>absent</b> — the fold stops here.</p>\n      </div>\n      <div style=\"flex:2;min-width:260px\" id=\"chat\"></div>\n    </div>\n  </div>\n  <p style=\"margin-top:12px\"><button class=\"replay\" id=\"replay\">↻ Replay</button></p>\n</div>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>Materialization v1 landed (2026-10-22):</b> state deltas persist as bundle records (<code>state-changes.jsonl</code>) at apply time and the fold is implemented (<code>src/ground/ontology/state.ts</code>, <code>novel state</code> CLI) — emotions/relationships additive and clamped to [-1, 1], knowledge/goals/possessions set add/remove, location replaces on non-null. Simulation itself (generate forward from a folded snapshot at a fork) remains Phase 4.</li>\n  <li><b>State = fold, never a row:</b> emotions, knowledge, goals and relationships are computed by replaying events up to the point. Move the point, the person changes — on canon and on every branch, consistently.</li>\n  <li><b>Ignorance is a feature:</b> the fold is also a wall. Facts from later chapters or other branches are not in the prompt, so the character cannot leak them.</li>\n  <li><b>Voice from evidence:</b> speech style is grounded in the character's own attributed turns (06) — forms of address, verbal tics, sentence length — not in a hand-written persona sketch.</li>\n  <li><b>Jev as the referee:</b> the same decision connector can gate replies — <i>in_character</i> (noul), <i>would_say_this</i> vs. alternatives (choice), divergence drift (score) — the simulation-side reuse of System 1.</li>\n  <li><b>Conversations can become canon-for-a-branch:</b> when talk turns into story, the resulting events are branch deltas proposed through the same ChangeSet discipline — simulation never silently rewrites a world.</li>\n</ul>\n\n<h2>Implementation</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li>State fold: <code>OntologyStore.getStateAt()</code> (10) over the timeline prefix (11).</li>\n  <li>Generation: the work LLM via <code>src/ground/connectors/llm.ts</code>, prompted with folded state + retrieved turns + scene context. No hybrid vector search exists — embeddings are deferred (decision #4); retrieval today is the graph/Cypher layer.</li>\n  <li>CLI surface: <code>novel simulate &lt;character&gt; [--branch &lt;id&gt;] [--at &lt;event-id&gt;]</code> — a design sketch, not a shipped command; the simulation CLI group is kept empty (decision #21). The form factor is the Pi Skill + CLI, not Discord (the legacy bot).</li>\n</ul>\n\n<h2>Open questions — simulation</h2>\n<div class=\"panel\">\n  <ul class=\"tight oq\" style=\"font-size:14px\">\n    <li>Referee strictness.<span>How hard should Jev gate replies — block out-of-character lines, regenerate, or just flag drift? Latency vs. fidelity per message is a real trade.</span></li>\n    <li>Multi-character scenes.<span>Simulating a conversation among several characters (the legacy bot's group roleplay) — one fold per character, one speaker-choice per turn: reuse sector 06's question in reverse?</span></li>\n    <li>When talk becomes story.<span>What threshold turns chat events into proposed branch deltas — every session, on user command, or when Jev scores a beat as event-worthy?</span></li>\n    <li>Voice drift over long sessions.<span>Re-anchor to retrieved turns every N messages? Measure drift how?</span></li>\n  </ul>\n</div>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design by sector · v0.1 · 2026-10-21</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\n/* Sectors keep their pipeline numbers; `g` is the hierarchy group the\n   dashboard presents them under (decision #21): the CLI's data-extraction\n   group splits into the Digger and the Solidifier, the simulation group\n   is kept empty for now, and the frontend stands on its own. */\nconst GROUPS = [\n  { g: \"digger\", label: \"⛏ Digger\" },\n  { g: \"solidifier\", label: \"🧱 Solidifier\" },\n  { g: \"ground\", label: \"📦 Ground\" },\n  { g: \"simulation\", label: \"Simulation group\" },\n  { g: \"frontend\", label: \"Frontend\" },\n];\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\", g: \"digger\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\", g: \"digger\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\", g: \"digger\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\", g: \"digger\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\", g: \"digger\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\", g: \"digger\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\", g: \"digger\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\", g: \"digger\" },\n  { n: \"08a\", slug: \"em-at-birth\", label: \"EM at birth\", g: \"digger\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\", g: \"solidifier\" },\n  { n: \"09a\", slug: \"em-global\", label: \"EM across the novel\", g: \"solidifier\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\", g: \"ground\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\", g: \"simulation\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\", g: \"simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\", g: \"frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  /* The top bar carries only the hierarchy: Overview, Roadmap, and one\n     dropdown per group. The 15 sector pages live inside the dropdowns —\n     never as 15 loose pills in a row. */\n  const menus = GROUPS.map((grp) => {\n    const items = SECTORS.filter((s) => s.g === grp.g);\n    const active = items.some((s) => here === s.slug + \".html\");\n    const links = items\n      .map(\n        (s) =>\n          `<a class=\"${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} · ${s.label}</a>`,\n      )\n      .join(\"\");\n    return `<div class=\"menu\"><button type=\"button\" class=\"menubtn ${active ? \"here\" : \"\"}\" aria-haspopup=\"true\">${grp.label} <span class=\"caret\">▾</span></button><div class=\"dropdown\">${links}</div></div>`;\n  }).join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>Skill + CLI + Adaptor + Frontend</small></a><div class=\"links\"><a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a><a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>${menus}</div>`;\n  // Touch/click support: tap a group to open it, tap anywhere else to close.\n  nav.querySelectorAll(\".menubtn\").forEach((btn) => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const menu = btn.parentElement;\n      const wasOpen = menu.classList.contains(\"open\");\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n      if (!wasOpen) menu.classList.add(\"open\");\n    });\n  });\n  document.addEventListener(\"click\", () => {\n    nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\")\n      nav.querySelectorAll(\".menu.open\").forEach((m) => m.classList.remove(\"open\"));\n  });\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\nfunction resetAll(){['sb1','sb2','sb3'].forEach(id=>document.getElementById(id).style.width='20%');document.getElementById('chat').innerHTML='';}\nconst steps=[\n {t:2600,cap:[\"Fold the state at the point\",\"Before a word is generated, the event stream is replayed up to evt_…77. Her ch. 9 knowledge isn't in the fold — she cannot know it, so she cannot leak it.\"],run(){document.getElementById('sb1').style.width='85%';document.getElementById('sb2').style.width='72%';document.getElementById('sb3').style.width='8%';}},\n {t:3200,cap:[\"Talk — grounded in her own turns\",\"Replies draw voice from her attributed dialogue: the blunt sentences, the tsundere deflections. Ask about the experiment and she deflects — at this point she genuinely doesn't know.\"],run(){document.getElementById('chat').innerHTML='<div class=\"chatline user on\">美琴，你知道那个实验的事吗？</div><div class=\"chatline char on\">「实验？……不知道你在说什么。别随便打听别人的事。」<br><small style=\"color:var(--faint)\">(What experiment? …I don\\'t know what you mean. Stop prying.)</small></div>';}},\n {t:2800,cap:[\"Same question, later point, different person\",\"Re-fold at ch. 10 and the awareness bar is full — the answer changes because the person did. That is the entire value of the ontology underneath.\"],run(){document.getElementById('sb3').style.width='95%';document.getElementById('chat').innerHTML+='<div class=\"chatline char on\">「……你也知道了吗。那件事，我不会再让它继续下去。」<br><small style=\"color:var(--faint)\">(…So you know too. That — I won\\'t let it continue.)</small></div>';}},\n];\nrunSectorDemo(steps.map(s=>({...s,reset:resetAll})));\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","playground-frontend.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>13 · Playground frontend — System 1 design · novel-ontology-pi</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px;align-items:center}\nnav.site .menu{position:relative}\nnav.site .menubtn{font:inherit;color:var(--dim);background:none;cursor:pointer;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;white-space:nowrap}\nnav.site .menubtn:hover{color:var(--ink);border-color:var(--teal)}\nnav.site .menubtn.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\nnav.site .menubtn .caret{font-size:10px;opacity:.7}\nnav.site .dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:none;\n  flex-direction:column;gap:2px;min-width:220px;padding:6px;\n  background:var(--panel2);border:1px solid var(--line);border-radius:12px;\n  box-shadow:0 14px 34px rgba(0,0,0,.5)}\nnav.site .menu.open .dropdown{display:flex}\n@media (hover:hover){ nav.site .menu:hover .dropdown{display:flex} }\nnav.site .dropdown a{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:7px 10px;border-radius:8px;white-space:nowrap}\nnav.site .dropdown a:hover{background:#1d2639;color:var(--ink)}\nnav.site .dropdown a.here{background:var(--teal);color:#0b0e14;font-weight:600}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n<style>\n  .pg { background:#0a0e16; border:1px solid var(--line); border-radius:14px; overflow:hidden }\n  .pgbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#111827;\n    border-bottom:1px solid var(--line); font-size:12px; color:var(--dim) }\n  .pgbar .dot3 { width:10px; height:10px; border-radius:50% }\n  .live { margin-left:auto; color:#f87171; font-weight:700; letter-spacing:.08em; font-size:11px }\n  .live i { display:inline-block; width:7px; height:7px; border-radius:50%; background:#f87171;\n    margin-right:5px; animation:blink 1.1s infinite }\n  @keyframes blink { 50% { opacity:.25 } }\n  .pgmain { display:grid; grid-template-columns: 172px 1fr 208px; min-height:308px }\n  .pipe { border-right:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:7px }\n  .pstage { border:1px solid var(--line); border-radius:9px; padding:6px 9px; font-size:11.5px;\n    color:var(--faint); background:var(--panel); transition:all .3s }\n  .pstage b { display:block; font-size:12px; color:var(--dim) }\n  .pstage.on { border-color:var(--teal); color:var(--teal); box-shadow:0 0 12px rgba(45,212,191,.25) }\n  .pstage.on b { color:var(--ink) }\n  .pstage.done { border-color:var(--green); color:var(--green) }\n  .blockchip { font-size:11px; border:1px dashed var(--amber); color:var(--amber); border-radius:99px;\n    padding:3px 9px; text-align:center; opacity:0; transition:opacity .4s }\n  .blockchip.show { opacity:1 }\n  .stage3d { position:relative }\n  .stage3d svg { width:100%; height:100%; display:block }\n  .feed { border-left:1px solid var(--line); padding:10px; font-size:11.5px; overflow:hidden }\n  .feed h4 { margin:0 0 7px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }\n  .feed li { list-style:none; margin:0 0 6px; color:var(--dim); opacity:0; transform:translateX(8px);\n    transition:all .45s; line-height:1.45 }\n  .feed li.show { opacity:1; transform:none }\n  .feed ul { margin:0; padding:0 }\n  .feed .ok { color:var(--green) } .feed .warn { color:var(--amber) } .feed .jev { color:var(--violet) }\n  .gatebox { margin-top:9px; border:1px solid var(--amber); border-radius:9px; padding:7px 9px;\n    font-size:11.5px; color:var(--amber); opacity:0; transition:all .4s }\n  .gatebox.show { opacity:1 } .gatebox.merged { border-color:var(--green); color:var(--green) }\n  #uniChip { position:absolute; top:44px; right:12px; z-index:5; background:#171e2e; color:var(--dim);\n    border:1px solid var(--line); border-radius:99px; padding:5px 12px; font-size:12.5px;\n    display:flex; gap:7px; align-items:center; transition:all .4s }\n  #uniChip #uniBadge { background:#26304a; color:var(--dim); border-radius:99px; padding:0 7px;\n    font-size:11.5px; font-weight:700 }\n  #uniChip.shine { color:#0b0e14; background:var(--amber); border-color:var(--amber); font-weight:700;\n    animation:chipGlow 1s ease-in-out infinite }\n  #uniChip.shine #uniBadge { background:#0b0e14; color:var(--amber) }\n  #uniChip.caught { background:var(--green); border-color:var(--green); color:#0b0e14; font-weight:700; animation:none }\n  #uniChip.caught #uniBadge { background:#0b0e14; color:var(--green) }\n  @keyframes chipGlow { 0%,100% { box-shadow:0 0 4px rgba(251,191,36,.5) } 50% { box-shadow:0 0 22px rgba(251,191,36,.95) } }\n  .uniwrap { display:grid; grid-template-columns: 178px 1fr }\n  .rail { border-right:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:7px }\n  .railfeed { margin-top:6px; font-size:11.5px }\n  .railfeed h4 { margin:0 0 7px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }\n  .railfeed ul { margin:0; padding:0 }\n  .railfeed li { list-style:none; margin:0 0 6px; color:var(--dim); opacity:0; transform:translateX(8px); transition:all .45s; line-height:1.45 }\n  .railfeed li.show { opacity:1; transform:none }\n  .railfeed .ok { color:var(--green) } .railfeed .warn { color:var(--amber) } .railfeed .jev { color:var(--violet) }\n  @media (max-width:760px){ .uniwrap{grid-template-columns:1fr} .rail{border:0} }\n  @media (max-width:760px){ .pgmain{grid-template-columns:1fr} .pipe,.feed{border:0} }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"kicker\">Phase D — Experience · Sector 13</div>\n<h1>Playground frontend — the live theater</h1>\n<p class=\"sub\">A standalone web app (React + <b>Reagraph</b>, chosen 2026-10-21) that makes the whole\nsystem <i>watchable</i>: as blocks roll through the miniloop, the ontology graph grows on screen in 3D —\ndecisions stream in, proposed changes glow as ghosts, merges land with a pulse. Transparency as a\nfeature: for the user's attention, and for our debugging. Host-agnostic by design — a VS Code webview\nwrapper can adopt the same component later.</p>\n\n<h2>The demo — one world, watched live</h2>\n<div class=\"demo\">\n  <div class=\"pg\" style=\"position:relative\">\n    <div class=\"pgbar\">\n      <span class=\"dot3\" style=\"background:#f87171\"></span><span class=\"dot3\" style=\"background:#fbbf24\"></span><span class=\"dot3\" style=\"background:#34d399\"></span>\n      <span id=\"uniCrumb\">playground · timeline — chapter range</span>\n      <span class=\"live\"><i></i>LIVE</span>\n    </div>\n    <div id=\"uniChip\">✦ Agent activity <span id=\"uniBadge\">0</span></div>\n    <div class=\"uniwrap\">\n      <div class=\"rail\">\n        <div class=\"blockchip\" id=\"blk\">▣ block b0011 · branch ch.2</div>\n        <div class=\"pstage\" id=\"ps0\"><b>Sectioning</b>deterministic · code</div>\n        <div class=\"pstage\" id=\"ps1\"><b>Miniloop patches</b>Jev decisions</div>\n        <div class=\"pstage\" id=\"ps2\"><b>Extraction</b>DeepSeek · per scene</div>\n        <div class=\"pstage\" id=\"ps3\"><b>ChangeSet</b>proposals accumulate</div>\n        <div class=\"pstage\" id=\"ps4\"><b>Merge gate</b>main agent reviews</div>\n        <div class=\"railfeed\">\n          <h4>Decision stream</h4>\n          <ul id=\"feedList\">\n            <li data-t=\"400\">▸ b0011 sectioned — 38 sentences</li>\n            <li data-t=\"1700\"><span class=\"jev\">jev</span> present · 黒子 .96</li>\n            <li data-t=\"3100\"><span class=\"jev\">jev</span> dialogue · 4 turns attributed</li>\n            <li data-t=\"4600\"><span class=\"warn\">cs_b0011</span> — 6 proposals (branch)</li>\n            <li data-t=\"13300\"><span class=\"warn\">⚖ cs_b0011 at the GATE</span></li>\n            <li data-t=\"18000\"><span class=\"ok\">approved → merged</span> · graph rebuilt</li>\n          </ul>\n          <div class=\"gatebox\" id=\"gateBox\">⧗ GATE · 6 proposals pending</div>\n        </div>\n      </div>\n      <div class=\"stage3d\">\n        <svg id=\"uniSvg\" viewBox=\"0 0 700 400\" preserveAspectRatio=\"xMidYMid meet\"></svg>\n      </div>\n    </div>\n  </div>\n  <div class=\"caption\" id=\"uniCap\">One world: the timeline at chapter range. Down in the branch lane, System 1 is already knitting — ghosts appearing in place.</div>\n</div>\n<p style=\"color:var(--dim);font-size:13.5px\">This single loop is the whole product idea. <b>One\nworld:</b> the ontology graph is the only source of truth; the timeline, the 3D interior and the\nlive feed are cameras over it, never separate data. <b>Two zoom levels:</b> chapter-range\n<i>big events</i> on the outside; click one and it opens into its <i>3D interior</i> — character,\nlocation, scene, dialogue and event nodes laid out in 3D roughly in chronological order, every link\nsingle-directional along an explicit time-flow axis. A story told in two places at once shows\n<b>two parallel chains</b> (here: the café and the street patrol, interleaved by one phone call).\n<b>Live, without fighting:</b> while you are inside, the agent keeps knitting in another lane —\nghosts appear there, in place, and the <b>activity tab</b> quietly shines. Tap it and a guided\nflight carries your camera out, across lanes, to the knitting site, arriving as the merge lands.</p>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>One graph, many cameras (core principle):</b> live activity and timeline browsing are the SAME surface. Views are cameras/filters over the single ontology graph (the source of truth) — never separate data. The agent's knitting renders in place wherever it belongs (any lane, any chapter, inside any big event) as ghosts, and never moves the user's camera. A follow-agent mode exists, but it is a toggle, off by default.</li>\n  <li><b>The shining activity tab:</b> agent/System-1 activity elsewhere accumulates as notifications with a location attached (lane, big event, zoom level). The tab glows when something noteworthy lands — new knitting site, a ChangeSet reaching the gate, a merge. Tapping an entry runs a <i>guided flight</i>: the camera travels across lanes and semantic zoom levels to the exact site, expanding containers on the way in. Notification policy is a design knob: merges and gate arrivals always shine; raw verdicts batch silently.</li>\n  <li><b>Stack:</b> Vite + React + TypeScript; <b>Reagraph</b> (Apache-2.0) for the graph stage — clustering, expand/collapse (chapter → scene → event zoom), node badges for pending proposals; a <b>React Flow</b> strip for the pipeline itself. Both views share selection state: click a block in the strip, the graph flies to what it produced.</li>\n  <li><b>Event feed is the contract:</b> the CLI emits a typed event stream (block started · sentence sectioned · patch verdict · proposal added · changeset pending · merged · graph rebuilt). The frontend is a pure consumer — first transport is the CLI writing an append-only <code>events.jsonl</code> per novel plus a tiny local SSE server (<code>novel watch</code>); the component never touches the DB directly.</li>\n  <li><b>Four views, one state:</b> <i>Live Theater</i> (this demo), <i>Ontology Explorer</i> (free 3D browse, search, focus), <i>Timeline Lanes</i> (canon + branches as lanes, scrub/play through event order — DIY over chronologicalOrder), <i>Gate Queue</i> (ChangeSets as cards with diff-style review, approve/hold from the UI).</li>\n  <li><b>Timeline zoom is semantic, two levels:</b> level 1 shows <i>big events</i> — summarized beats spanning chapter ranges; clicking one expands it into its <i>3D interior</i> (level 2): c
