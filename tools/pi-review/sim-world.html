<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World · Live</title>
<style>
  :root { color-scheme: dark; --bg: #060c12; --panel: #0b1620e6; --ink: #d9e3ea; --dim: #8aa0b0; --line: #1d3442; --accent: #7ce6ff; --jev: #ffd36e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); transition: opacity .35s ease; }
  iframe.waiting { opacity: 0; pointer-events: none; }
  .hud { position: fixed; z-index: 5; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); max-width: min(440px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
  .hud h1 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .row { color: var(--dim); font-size: 12px; }
  .jev { color: var(--jev); font-size: 12px; }
  .counts { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 11px; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); }
  .empty[hidden] { display: none; }
  .bar { position: fixed; z-index: 5; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .bar a, .bar button { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; text-decoration: none; cursor: pointer; }
  .bar button[aria-pressed="true"] { border-color: var(--jev); color: var(--jev); }
  .legend { position: fixed; z-index: 5; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 11px; color: var(--dim); max-width: min(340px, calc(100vw - 24px)); }
  .legend b { color: var(--ink); font-weight: 600; }
  @media (max-width: 719px) { .legend { display: none; } }
</style>
</head>
<body>
<div class="empty" id="empty">Waiting for the engine to play a moment…</div>
<section class="hud" aria-live="polite">
  <h1>World · live</h1>
  <div class="row" id="where"></div>
  <div class="jev" id="jev"></div>
  <div class="counts" id="counts"></div>
</section>
<div class="legend">The engine's own player, at each moment it plays: drawn round <b>where Jev looks</b> and <b>where the people are</b> (within 112 m, gone beyond 160 m), never round the camera.</div>
<nav class="bar"><button id="follow" aria-pressed="true">Follow Jev</button><a id="live" href="live">Jev's questions</a><a id="play" href="./">Player</a></nav>
<script>
(() => {
  const $ = (id) => document.getElementById(id), query = location.search, origin = location.origin;
  $("live").href = `live${query}`; $("play").href = `./${query}`;
  // Two frames at most: the one shown, and the next one loading over it, unseen and untouchable, until it says it is
  // ready; then it fades in on top and the old one goes, so a finger never lands on a frame about to go. Building a frame
  // is heavy (the whole world so far), so one loads at most every few seconds, only for a newer moment, and it plays
  // every moment since the one shown before it, so none is skipped; a phone keeps the time between for drawing and for
  // the viewer's finger. While a finger is down, or just lifted, the swap waits: it would cut the gesture off.
  const GAP = 5000, SETTLE = 1500;
  let shown = null, next = null, page = 0, shownPage = 0, wanted = 0, epoch = null, shownMoment = null, camera = null, touching = false, ready = false, lastLoad = 0, lastTouch = 0, swapTimer = 0, loadTimer = 0;
  /** A frame goes: told first to let its WebGL context go (a phone allows only a few), then emptied and removed. */
  const retire = (frame) => { try { frame.contentWindow?.postMessage({ type: "dispose" }, origin); } catch {} setTimeout(() => { frame.src = "about:blank"; frame.remove(); }, 100); };
  /** A frame that could not start its 3D view (or never got ready): dropped, the shown one stays, and the moment is loaded again. */
  const drop = (frame) => { if (next !== frame) return; next = null; ready = false; page = shownPage; retire(frame); queue(); };
  const showFollow = (on) => $("follow").setAttribute("aria-pressed", String(on));
  $("follow").addEventListener("click", () => {
    const on = $("follow").getAttribute("aria-pressed") !== "true";
    showFollow(on); if (camera) camera.follow = on;
    for (const frame of [shown, next]) frame?.contentWindow.postMessage({ type: "follow", on }, origin);
  });
  /** The loading frame takes over once it is ready and the viewer's finger has settled: it gets the camera the shown one had, fades in on top, and the old one goes. */
  const swap = () => {
    clearTimeout(swapTimer);
    if (!next || !ready) return;
    const wait = touching ? SETTLE : lastTouch + SETTLE - Date.now();
    if (wait > 0) { swapTimer = setTimeout(swap, wait); return; }
    ready = false;
    if (camera) next.contentWindow.postMessage({ ...camera, type: "camera" }, origin);
    const old = shown; shown = next; next = null; shownMoment = shown.moment ?? shownMoment; shownPage = page;
    shown.classList.remove("waiting"); $("empty").hidden = true;
    if (old) setTimeout(() => retire(old), 450);
    queue();
  };
  /** Load the newest moment wanted, when none is loading and the last load was long enough ago. */
  const queue = () => {
    clearTimeout(loadTimer);
    if (next || wanted <= page) return;
    const wait = lastLoad + GAP - Date.now();
    if (wait > 0) { loadTimer = setTimeout(queue, wait); return; }
    page = wanted; load(page);
  };
  addEventListener("message", (event) => {
    if (event.origin !== origin) return;
    const message = event.data;
    if (message?.type === "camera" && shown && event.source === shown.contentWindow) { camera = message; showFollow(!!message.follow); }
    if (message?.type === "touch" && shown && event.source === shown.contentWindow) { touching = message.active; lastTouch = Date.now(); if (!touching) swap(); }
    if (message?.type === "interact" && shown && event.source === shown.contentWindow) lastTouch = Date.now();
    if (message?.type === "ready" && next && event.source === next.contentWindow) { next.moment = message.moment; ready = true; swap(); }
    if (message?.type === "failed" && next && event.source === next.contentWindow) drop(next);
  });
  const load = (run) => {
    lastLoad = Date.now(); ready = false;
    next = document.createElement("iframe"); next.className = "waiting"; next.title = "The world at this moment";
    next.src = `now${query}${query ? "&" : "?"}run=${run}${shownMoment ? `&from=${encodeURIComponent(shownMoment)}` : ""}`;
    // A frame that loaded but never says it is ready because this tab is hidden (nothing draws) takes over anyway after a few
    // seconds; in a tab being looked at, a slow one is waited for, and one not ready in 30 s is dropped and loaded again.
    const frame = next;
    frame.addEventListener("load", () => setTimeout(() => { if (next === frame && document.hidden) { ready = true; swap(); } }, 4000));
    setTimeout(() => { if (next === frame && !ready) drop(frame); }, 30000);
    document.body.append(next);
  };
  async function poll() {
    try {
      const state = await fetch(`live.json${query}`, { cache: "no-store" }).then((r) => r.json()).catch(() => null);
      if (state) {
        $("jev").textContent = state.status === "running" ? `Jev · ${state.phase ?? state.command ?? "working"}${state.ask?.subject ? ` · ${state.ask.subject}` : ""} · ${state.calls ?? 0} calls` : `Jev · ${state.status}`;
        const world = state.world;
        if (world) {
          $("where").textContent = `${world.moment ?? ""}${world.final ? " · end" : ""}`;
          $("counts").textContent = world.notes ? `${state.engine ? `engine v${state.engine} · ` : ""}chunks ${world.notes.chunks} · buildings ${world.notes.lots} · ${world.notes.nodes} walk nodes${world.notes.applied ? ` · ${world.notes.applied} broken earlier` : ""}` : "";
          // A new command counts its pages from 1 again: start over with it.
          if (state.startedAt !== epoch) { epoch = state.startedAt; page = 0; shownPage = 0; wanted = 0; shownMoment = null; }
          if (world.page > wanted) { wanted = world.page; queue(); }
        }
      }
    } finally { setTimeout(poll, 1000); }
  }
  poll();
})();
</script>
</body>
</html>
