<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World · Replay</title>
<style>
  :root { --bg: #0b141c; --panel: #0f1c27f2; --line: #1d3242; --text: #d8e6ef; --dim: #7f97a8; --accent: #7ce6ff; --lot: #22384a; --lot-edge: #2d4a60; --named: #f2c66d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #map.dragging { cursor: grabbing; }
  header { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 8px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(#0b141cf0, #0b141c00); pointer-events: none; }
  header > * { pointer-events: auto; }
  h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
  .sub { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  button, select, input { font: inherit; color: var(--text); background: #132636; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #time { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); display: grid; gap: 6px; }
  #time .row { display: flex; gap: 8px; align-items: center; min-width: 0; }
  #slider { flex: 1; min-width: 0; accent-color: var(--accent); }
  #now { font-size: 12px; color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #now b { color: var(--text); font-weight: 600; }
  #side { position: fixed; top: calc(52px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: min(320px, calc(100vw - 24px)); max-height: calc(100vh - 190px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #side.closed .body { display: none; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 9px 4px; font-size: 13px; color: var(--dim); }
  .tabs button.on { color: var(--accent); box-shadow: inset 0 -2px var(--accent); }
  .tabs button.small { flex: 0 0 auto; padding: 9px 10px; }
  .body { overflow: auto; padding: 8px; display: grid; gap: 4px; align-content: start; }
  .body input { width: 100%; margin-bottom: 4px; }
  .item { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; min-width: 0; }
  .item:hover { background: #ffffff0d; }
  .item.on { background: #7ce6ff1f; outline: 1px solid #7ce6ff55; }
  .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .note { color: var(--dim); font-size: 12px; padding: 4px 8px; }
  #empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); text-align: center; padding: 24px; }
  @media (max-width: 640px) {
    #side { top: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); right: 8px; left: 8px; width: auto; max-height: 42vh; }
    .sub { display: none; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<header>
  <h1>World · Replay</h1>
  <span class="sub" id="sub"></span>
  <button id="fit" title="See the whole world">Fit</button>
</header>
<aside id="side">
  <div class="tabs">
    <button data-tab="people" class="on">People</button>
    <button data-tab="strands">Strands</button>
    <button data-tab="buildings">Buildings</button>
    <button data-tab="places" class="small" title="The book's places (folded)">Places</button>
    <button id="fold" class="small" title="Fold the panel">▾</button>
  </div>
  <div class="body" id="list"></div>
</aside>
<section id="time">
  <div class="row">
    <button id="play">▶</button>
    <input id="slider" type="range" min="0" max="0" value="0">
    <select id="speed" title="Moments a second"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
  </div>
  <div class="row"><span id="now">Loading the run…</span><button id="trails" class="on" title="The ways taken so far">Paths</button></div>
</section>
<div id="empty" hidden></div>
<script>
(() => {
  const STRAND = ['#7ce6ff', '#ff8fb1', '#b6f27a', '#f2c66d', '#c9a2ff', '#ff9e5e', '#5ef2c4', '#f27aa8', '#9ec1ff', '#e6e66d'];
  const $ = id => document.getElementById(id), canvas = $('map'), ctx = canvas.getContext('2d');
  let data = null, view = { x: 0, z: 0, scale: 1 }, moment = 0, sub = 1, playing = false, last = 0, tab = 'people', filter = '';
  const selected = new Set(); let strandOn = null;
  const dpr = () => Math.min(2, window.devicePixelRatio || 1);
  const resize = () => { canvas.width = innerWidth * dpr(); canvas.height = innerHeight * dpr(); draw(); };
  const toScreen = (x, z) => [(x - view.x) * view.scale + innerWidth / 2, (z - view.z) * view.scale + innerHeight / 2];
  const toWorld = (sx, sz) => [(sx - innerWidth / 2) / view.scale + view.x, (sz - innerHeight / 2) / view.scale + view.z];
  const fit = () => { const b = data?.bounds; if (!b) return; view.x = (b.x0 + b.x1) / 2; view.z = (b.z0 + b.z1) / 2; view.scale = Math.min(innerWidth / (b.x1 - b.x0 + 80), (innerHeight - 160) / (b.z1 - b.z0 + 80)); draw(); };

  // Where each person stands at a moment (and part way, `t`, along the way they take in it).
  const at = (track, m, t) => {
    let here = null;
    for (const entry of track) {
      if (entry.m > m) break;
      if (entry.m === m && entry.path && t < 1) { const p = alongPath(entry.path, t); return { p, moving: true }; }
      here = entry.at;
    }
    return here ? { p: [here[0], here[1]], moving: false } : null;
  };
  const alongPath = (path, t) => {
    if (path.length < 2) return path[0];
    const lengths = [0]; for (let k = 1; k < path.length; k++) lengths.push(lengths[k - 1] + Math.hypot(path[k][0] - path[k - 1][0], path[k][1] - path[k - 1][1]));
    const want = t * lengths.at(-1); let k = 1; while (k < lengths.length - 1 && lengths[k] < want) k++;
    const span = lengths[k] - lengths[k - 1] || 1, u = (want - lengths[k - 1]) / span;
    return [path[k - 1][0] + (path[k][0] - path[k - 1][0]) * u, path[k - 1][1] + (path[k][1] - path[k - 1][1]) * u];
  };
  const forkOfMoment = m => data.moments[m]?.fork ?? 0;
  const highlighted = id => selected.size ? selected.has(id) : strandOn === null || (data.tracks[id] ?? []).some(entry => forkOfMoment(entry.m) === strandOn);

  function draw() {
    if (!data) return;
    const s = dpr(); ctx.setTransform(s, 0, 0, s, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    // Buildings.
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--lot'); ctx.strokeStyle = '#2d4a60'; ctx.lineWidth = 1;
    for (const [x, z, w, d] of data.lots) { const [sx, sz] = toScreen(x, z); const sw = w * view.scale, sd = d * view.scale; if (sx > innerWidth || sz > innerHeight || sx + sw < 0 || sz + sd < 0) continue; ctx.fillRect(sx, sz, Math.max(1, sw), Math.max(1, sd)); }
    // Places, when their tab is open (folded otherwise).
    if (tab === 'places') { ctx.setLineDash([4, 4]); ctx.strokeStyle = '#7f97a866'; for (const place of data.places) { const [sx, sz] = toScreen(place.x - place.w / 2, place.z - place.d / 2); ctx.strokeRect(sx, sz, place.w * view.scale, place.d * view.scale); } ctx.setLineDash([]); }
    // The book's buildings: outlined, named when there is room.
    ctx.strokeStyle = '#f2c66d'; ctx.lineWidth = 1.2; ctx.font = '11px -apple-system, "PingFang SC", sans-serif'; ctx.fillStyle = '#f2c66d';
    const labels = [];
    for (const b of data.buildings) {
      const [sx, sz] = toScreen(b.x - b.w / 2, b.z - b.d / 2); ctx.strokeRect(sx, sz, Math.max(3, b.w * view.scale), Math.max(3, b.d * view.scale));
      // A name where there is room for it (none over another).
      if (view.scale > 0.9) { const w = ctx.measureText(b.name).width, box = [sx, sz - 14, sx + w, sz]; if (!labels.some(o => box[0] < o[2] && o[0] < box[2] && box[1] < o[3] && o[1] < box[3])) { labels.push(box); ctx.fillText(b.name, sx, sz - 3); } }
    }
    // The ways taken so far, rough, by strand; the chosen people bright, everyone else faint.
    if ($('trails').classList.contains('on')) for (const person of data.people) {
      const bright = highlighted(person.id);
      for (const entry of data.tracks[person.id]) {
        if (!entry.path) continue;
        // A picked person's whole way: what is still to come dashed and faint.
        if (entry.m > moment) {
          if (!selected.has(person.id)) continue;
          ctx.strokeStyle = person.color ?? '#fff'; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
          ctx.beginPath(); entry.path.forEach(([x, z], k) => { const [sx, sz] = toScreen(x, z); k ? ctx.lineTo(sx, sz) : ctx.moveTo(sx, sz); }); ctx.stroke(); ctx.setLineDash([]);
          continue;
        }
        const path = entry.m === moment ? cut(entry.path, sub) : entry.path;
        ctx.strokeStyle = selected.has(person.id) ? (person.color ?? '#fff') : STRAND[forkOfMoment(entry.m) % STRAND.length];
        ctx.globalAlpha = bright ? (selected.size ? 0.95 : 0.55) : 0.08; ctx.lineWidth = selected.has(person.id) ? 3 : 1.5;
        ctx.beginPath(); path.forEach(([x, z], k) => { const [sx, sz] = toScreen(x, z); k ? ctx.lineTo(sx, sz) : ctx.moveTo(sx, sz); }); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // Everyone where they are now.
    for (const person of data.people) {
      const here = at(data.tracks[person.id], moment, sub); if (!here) continue;
      const [sx, sz] = toScreen(here.p[0], here.p[1]), bright = highlighted(person.id), r = selected.has(person.id) ? 6 : 4;
      ctx.globalAlpha = bright ? 1 : 0.25; ctx.fillStyle = person.color ?? '#d8e6ef'; ctx.beginPath(); ctx.arc(sx, sz, r, 0, Math.PI * 2); ctx.fill();
      if (selected.has(person.id) || (bright && view.scale > 1.6)) { ctx.fillStyle = '#ffffff'; ctx.font = '12px -apple-system, "PingFang SC", sans-serif'; ctx.fillText(person.name, sx + 8, sz + 4); }
    }
    ctx.globalAlpha = 1;
  }
  const cut = (path, t) => { const end = alongPath(path, t), out = []; let walked = 0; const total = path.slice(1).reduce((sum, p, k) => sum + Math.hypot(p[0] - path[k][0], p[1] - path[k][1]), 0) * t; out.push(path[0]); for (let k = 1; k < path.length; k++) { walked += Math.hypot(path[k][0] - path[k - 1][0], path[k][1] - path[k - 1][1]); if (walked > total) break; out.push(path[k]); } out.push(end); return out; };

  function label() {
    const m = data.moments[moment]; if (!m) return;
    const unit = Number(String(m.unit).slice(-6)), cards = data.moments.filter(entry => entry.unit === m.unit), k = cards.indexOf(m);
    $('now').innerHTML = `<b>${moment + 1} / ${data.moments.length}</b> · unit ${unit} · ${k === 0 ? 'its start' : `card ${k} of ${cards.length - 1}`} · strand ${m.fork + 1}${m.text ? ` · ${escapeHtml(m.text)}` : ''}`;
    $('slider').value = moment;
  }
  const escapeHtml = text => text.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  function list() {
    const body = $('list'); body.innerHTML = '';
    const add = (html, on, click) => { const row = document.createElement('div'); row.className = `item${on ? ' on' : ''}`; row.innerHTML = html; row.addEventListener('click', click); body.append(row); };
    if (tab === 'people') {
      const input = document.createElement('input'); input.placeholder = 'Find a name'; input.value = filter; input.addEventListener('input', () => { filter = input.value; list(); input.focus(); input.setSelectionRange(filter.length, filter.length); }); body.append(input);
      if (selected.size) add(`<span class="name">Show everyone</span><span class="meta">${selected.size} picked</span>`, false, () => { selected.clear(); list(); draw(); });
      for (const person of data.people.filter(entry => !filter || entry.name.includes(filter))) {
        const moves = data.tracks[person.id].filter(entry => entry.path).length;
        add(`<span class="dot" style="background:${person.color ?? '#d8e6ef'}"></span><span class="name">${escapeHtml(person.name)}</span><span class="meta">${moves} moves</span>`, selected.has(person.id), () => { selected.has(person.id) ? selected.delete(person.id) : selected.add(person.id); strandOn = null; list(); draw(); if (selected.has(person.id)) focusOn(person.id); });
      }
    } else if (tab === 'strands') {
      add(`<span class="name">Every strand</span>`, strandOn === null, () => { strandOn = null; list(); draw(); });
      for (const fork of data.forks) add(`<span class="dot" style="background:${STRAND[fork.n % STRAND.length]}"></span><span class="name">Strand ${fork.n + 1}</span><span class="meta">${fork.units.length} units</span>`, strandOn === fork.n, () => { strandOn = fork.n; selected.clear(); list(); draw(); });
    } else if (tab === 'buildings') {
      const shown = data.buildings.filter(b => b.scale === 'building');
      if (!shown.length) body.append(Object.assign(document.createElement('div'), { className: 'note', textContent: 'No named buildings in this book yet.' }));
      for (const b of shown.sort((a, c) => a.name.localeCompare(c.name))) add(`<span class="dot" style="background:var(--named)"></span><span class="name">${escapeHtml(b.name)}</span><span class="meta">${b.kind ?? ''}</span>`, false, () => flyTo(b.x, b.z, 3));
    } else {
      body.append(Object.assign(document.createElement('div'), { className: 'note', textContent: 'The book’s districts and streets, drawn dashed on the map while this tab is open.' }));
      for (const place of data.places) add(`<span class="name">${escapeHtml(place.name)}</span><span class="meta">${place.scale ?? ''}</span>`, false, () => flyTo(place.x, place.z, Math.min(3, innerWidth / Math.max(60, place.w * 1.4))));
    }
  }
  const flyTo = (x, z, scale) => { view.x = x; view.z = z; view.scale = scale; draw(); };
  const focusOn = id => { const points = data.tracks[id].flatMap(entry => entry.path ?? [entry.at]); const xs = points.map(p => p[0]), zs = points.map(p => p[1]); view.x = (Math.min(...xs) + Math.max(...xs)) / 2; view.z = (Math.min(...zs) + Math.max(...zs)) / 2; view.scale = Math.min(4, innerWidth / (Math.max(...xs) - Math.min(...xs) + 200), (innerHeight - 200) / (Math.max(...zs) - Math.min(...zs) + 200)); draw(); };

  // Playing: a moment a second at 1×; within a moment the ways are walked from start to end.
  function tick(now) {
    if (playing) {
      const dt = Math.min(0.25, (now - last) / 1000) * Number($('speed').value); sub += dt;
      while (sub >= 1) { if (moment >= data.moments.length - 1) { playing = false; $('play').textContent = '▶'; sub = 1; break; } moment++; sub -= 1; label(); }
      draw();
    }
    last = now; requestAnimationFrame(tick);
  }

  // Pan and zoom: drag, wheel, two fingers.
  const pointers = new Map(); let pinch = null;
  canvas.addEventListener('pointerdown', event => { canvas.setPointerCapture(event.pointerId); pointers.set(event.pointerId, [event.clientX, event.clientY]); canvas.classList.add('dragging'); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), scale: view.scale }; } });
  canvas.addEventListener('pointermove', event => {
    const before = pointers.get(event.pointerId); if (!before) return;
    pointers.set(event.pointerId, [event.clientX, event.clientY]);
    if (pointers.size === 2 && pinch) { const [a, b] = [...pointers.values()]; view.scale = Math.max(0.05, Math.min(20, pinch.scale * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d)); }
    else if (pointers.size === 1) { view.x -= (event.clientX - before[0]) / view.scale; view.z -= (event.clientY - before[1]) / view.scale; }
    draw();
  });
  const up = event => { pointers.delete(event.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', event => { event.preventDefault(); const [wx, wz] = toWorld(event.clientX, event.clientY); view.scale = Math.max(0.05, Math.min(20, view.scale * Math.exp(-event.deltaY / 400))); const [nx, nz] = toWorld(event.clientX, event.clientY); view.x += wx - nx; view.z += wz - nz; draw(); }, { passive: false });
  // A tap on someone picks them.
  canvas.addEventListener('click', event => {
    let best = null;
    for (const person of data?.people ?? []) { const here = at(data.tracks[person.id], moment, sub); if (!here) continue; const [sx, sz] = toScreen(here.p[0], here.p[1]), d = Math.hypot(sx - event.clientX, sz - event.clientY); if (d < 14 && (!best || d < best.d)) best = { d, id: person.id }; }
    if (best) { selected.has(best.id) ? selected.delete(best.id) : selected.add(best.id); strandOn = null; tab = 'people'; tabs(); list(); draw(); }
  });

  const tabs = () => document.querySelectorAll('.tabs button[data-tab]').forEach(button => button.classList.toggle('on', button.dataset.tab === tab));
  document.querySelectorAll('.tabs button[data-tab]').forEach(button => button.addEventListener('click', () => { tab = button.dataset.tab; $('side').classList.remove('closed'); tabs(); list(); draw(); }));
  $('fold').addEventListener('click', () => { $('side').classList.toggle('closed'); $('fold').textContent = $('side').classList.contains('closed') ? '▸' : '▾'; });
  $('play').addEventListener('click', () => { if (!data) return; if (moment >= data.moments.length - 1) { moment = 0; sub = 0; } playing = !playing; $('play').textContent = playing ? '❚❚' : '▶'; });
  $('slider').addEventListener('input', () => { moment = Number($('slider').value); sub = 1; label(); draw(); });
  $('trails').addEventListener('click', () => { $('trails').classList.toggle('on'); draw(); });
  $('fit').addEventListener('click', fit);
  addEventListener('resize', resize);

  fetch(`replay.json${location.search}`, { cache: 'no-store' }).then(response => response.ok ? response.json() : null).then(json => {
    if (!json) { $('empty').hidden = false; $('empty').textContent = 'No run of this book to replay yet.'; $('now').textContent = ''; return; }
    data = json; $('sub').textContent = `${json.title ?? 'The director'} · run ${json.run} · ${json.people.length} people · ${json.forks.length} strand${json.forks.length === 1 ? '' : 's'}`;
    $('slider').max = String(Math.max(0, json.moments.length - 1)); moment = 0; sub = 1;
    // On a phone the panel starts folded: the map first, the lists a tap away.
    if (innerWidth <= 640) { $('side').classList.add('closed'); $('fold').textContent = '▸'; }
    resize(); fit(); label(); list(); requestAnimationFrame(tick);
  }).catch(() => { $('empty').hidden = false; $('empty').textContent = 'The replay could not be loaded.'; });
})();
</script>
</body>
</html>
