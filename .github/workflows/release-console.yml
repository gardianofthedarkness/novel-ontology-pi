name: Release Novel Console

# Builds the Mac app (Apple Silicon DMG) and publishes it as a GitHub Release.
# Runs when a version tag such as v0.7.0 is pushed. The tag must match
# apps/novel-console/package.json's version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.7.0); it must already exist"
        required: true

permissions:
  contents: write

concurrency:
  group: release-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches the app's version
        run: |
          VERSION=$(node -p "require('./apps/novel-console/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match apps/novel-console/package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install
        run: |
          npm ci
          npm ci --prefix tools/pi-review --ignore-scripts
          npm ci --prefix apps/novel-console

      - name: Build the backend
        run: npm run build

      - name: Build the DMG
        working-directory: apps/novel-console
        run: npm run dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls apps/novel-console/release/Novel-Console-*-arm64.dmg)
          cat > notes.md <<EOF
          Novel Console $VERSION for Apple Silicon Macs (M1 or later).

          **Install:** open the DMG and drag Novel Console to Applications.

          **First open:** the app isn't notarized yet, so macOS blocks it once. Try to open it, click Done, then go to System Settings → Privacy & Security, click **Open Anyway** next to Novel Console, confirm and enter your password.

          See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for how to get started.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "Novel Console $VERSION" --notes-file notes.md
          fi
