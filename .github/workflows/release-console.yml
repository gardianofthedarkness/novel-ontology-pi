name: Release Novel Console

# Builds the Mac app (Apple Silicon DMG) and the Windows app (x64 installer) from the
# same commit and publishes both in one GitHub Release, only when both builds pass.
# Runs when a version tag such as v0.7.0 is pushed (the tag must match
# apps/novel-console/package.json's version), or by hand from the Actions tab
# ("Run workflow" on a branch), which tags that branch's commit v<version>.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag from the app's version
        id: tag
        run: |
          VERSION=$(node -p "require('./apps/novel-console/package.json').version")
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/novel-console/package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  dmg:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci
          npm ci --prefix tools/pi-review --ignore-scripts
          npm ci --prefix apps/novel-console

      - name: Build the backend
        run: npm run build

      - name: Build the DMG
        working-directory: apps/novel-console
        run: npm run dmg

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: apps/novel-console/release/Novel-Console-*-arm64.dmg
          if-no-files-found: error

  exe:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The installer carries this Node's node.exe and runs the app's backend on it (scripts/backend.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          npm ci
          npm ci --prefix tools/pi-review --ignore-scripts
          npm ci --prefix apps/novel-console

      - name: Build the backend
        run: npm run build

      - name: Test the engine on Windows
        run: node --test engine/world/*.test.mjs engine/director/*.test.mjs engine/volume/*.test.mjs tools/pi-review/guard.test.mjs tools/pi-review/folder-scope.test.mjs

      - name: Build the installer
        working-directory: apps/novel-console
        run: npm run exe

      # The packed backend on its own node.exe: LadybugDB's native module loads and the novel command answers.
      - name: Check the packed backend
        run: |
          B=apps/novel-console/release/win-unpacked/resources/backend
          "$B/node/node.exe" -e "require(process.argv[1]); console.log('LadybugDB loads')" "$B/node_modules/@ladybugdb/core/index.js"
          NOVEL_SECRETS_DIR="$RUNNER_TEMP/secrets" "$B/node/node.exe" "$B/dist/src/cli/cli.js" --help > /dev/null
          echo "novel --help answers"

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: apps/novel-console/release/Novel-Console-*-x64-setup.exe
          if-no-files-found: error

  publish:
    needs: [version, dmg, exe]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Pack the agent skill
        run: |
          mkdir -p release/kit
          cp -R skills/novel-folder release/kit/
          (cd release/kit && zip -qr "../novel-folder-skill-$VERSION.zip" novel-folder)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls release/dmg/Novel-Console-*-arm64.dmg)
          EXE=$(ls release/exe/Novel-Console-*-x64-setup.exe)
          SKILL="release/novel-folder-skill-$VERSION.zip"
          cat > notes.md <<EOF
          Novel Console $VERSION for Apple Silicon Macs (M1 or later) and Windows 10 or 11 (x64), built from the same commit.

          **Mac:** open \`$(basename "$DMG")\` and drag Novel Console to Applications. The app isn't notarized yet, so macOS blocks it once: try to open it, click Done, then go to System Settings → Privacy & Security, click **Open Anyway** next to Novel Console, confirm and enter your password.

          **Windows:** run \`$(basename "$EXE")\`. It installs for your user only (no administrator) and lets you choose the folder; installing takes a few minutes. The installer isn't code-signed yet, so Windows SmartScreen stops it once: click **More info**, then **Run anyway**.

          **Your own agent:** the app carries the \`novel\` command and the \`novel-folder\` skill. Press "Set up your agent" in the chat panel (⌘I on a Mac, Ctrl+I on Windows) to install them for Claude Code, Codex or Pi. \`novel-folder-skill-$VERSION.zip\` is the same skill on its own, for an agent the app does not find; the command still comes from the app.

          See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for how to get started.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$EXE" "$SKILL" --clobber
          else
            gh release create "$TAG" "$DMG" "$EXE" "$SKILL" --target "$GITHUB_SHA" --title "Novel Console $VERSION" --notes-file notes.md
          fi
