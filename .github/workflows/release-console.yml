name: Release Novel Console

# Builds the Mac app (Apple Silicon DMG) and publishes it as a GitHub Release.
# Runs when a version tag such as v0.7.0 is pushed (the tag must match
# apps/novel-console/package.json's version), or by hand from the Actions tab
# ("Run workflow" on a branch), which tags that branch's commit v<version>.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Work out the tag from the app's version
        run: |
          VERSION=$(node -p "require('./apps/novel-console/package.json').version")
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/novel-console/package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install
        run: |
          npm ci
          npm ci --prefix tools/pi-review --ignore-scripts
          npm ci --prefix apps/novel-console

      - name: Build the backend
        run: npm run build

      - name: Build the DMG
        working-directory: apps/novel-console
        run: npm run dmg

      - name: Pack the agent skill
        run: |
          mkdir -p apps/novel-console/release/kit
          cp -R skills/novel-folder apps/novel-console/release/kit/
          (cd apps/novel-console/release/kit && zip -qr "../novel-folder-skill-$VERSION.zip" novel-folder)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls apps/novel-console/release/Novel-Console-*-arm64.dmg)
          SKILL="apps/novel-console/release/novel-folder-skill-$VERSION.zip"
          cat > notes.md <<EOF
          Novel Console $VERSION for Apple Silicon Macs (M1 or later).

          **Install:** open the DMG and drag Novel Console to Applications.

          **First open:** the app isn't notarized yet, so macOS blocks it once. Try to open it, click Done, then go to System Settings → Privacy & Security, click **Open Anyway** next to Novel Console, confirm and enter your password.

          **Your own agent:** the app carries the \`novel\` command and the \`novel-folder\` skill. Press "Set up your agent" in the chat panel (⌘I) to install them for Claude Code, Codex or Pi. \`novel-folder-skill-$VERSION.zip\` is the same skill on its own, for an agent the app does not find; the command still comes from the app.

          See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for how to get started.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$SKILL" --clobber
          else
            gh release create "$TAG" "$DMG" "$SKILL" --target "$GITHUB_SHA" --title "Novel Console $VERSION" --notes-file notes.md
          fi
