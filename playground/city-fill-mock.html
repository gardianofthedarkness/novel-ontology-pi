<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Fill Mock</title>
<style>
  :root { color-scheme: dark; --bg: #060c12; --ink: #e8f1f6; --dim: #8fa6b4; --line: #1d3242; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "PingFang SC", sans-serif; }
  .wrap { display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
  #stage { position: relative; min-width: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  aside { border-left: 1px solid var(--line); padding: 14px 16px; overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p, li { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  button { background: #10202c; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: #7ce6ff; }
  body.capture aside { display: none; } body.capture .wrap { grid-template-columns: 1fr; }
  @media (max-width: 700px) { .wrap { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="wrap">
  <div id="stage"></div>
  <aside>
    <h1 id="title">City fill</h1>
    <p id="facts"></p>
    <div class="row"><button data-view="top" aria-pressed="true">Top down</button><button data-view="persp">3D</button><button id="grow">Show growth</button></div>
    <ul id="legend"></ul>
  </aside>
</div>
<script type="application/json" id="fill-data">null</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const $ = (id) => document.getElementById(id), data = JSON.parse($("fill-data").textContent), capture = new URLSearchParams(location.search).has("capture");
if (capture) document.body.classList.add("capture");
$("title").textContent = data.title;
const FLOOR = 3, host = $("stage"), renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); host.append(renderer.domElement);
const world = new THREE.Scene(); world.background = new THREE.Color(0x060c12);
world.add(new THREE.AmbientLight(0xffffff, 0.6)); const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(300, 600, 200); world.add(sun);
const persp = new THREE.PerspectiveCamera(40, 1, 1, 8000), half = data.city.r * 1.35, top = new THREE.OrthographicCamera(-half, half, half, -half, 1, 4000);
top.up.set(0, 0, -1); top.position.set(0, 1500, 0); top.lookAt(0, 0, 0);
let camera = top; const controls = new OrbitControls(persp, renderer.domElement); controls.enableDamping = true;
persp.position.set(data.city.r * 0.9, data.city.r * 0.75, data.city.r * 1.1); controls.target.set(0, 0, 0);
const resize = () => { const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false); persp.aspect = w / h; persp.updateProjectionMatrix(); const a = w / h; top.left = -half * a; top.right = half * a; top.top = half; top.bottom = -half; top.updateProjectionMatrix(); };
new ResizeObserver(resize).observe(host); resize();
const box = new THREE.BoxGeometry(1, 1, 1), m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), c = new THREE.Color();
function label(text, fill = "#ffffff", size = 34) {
  const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d"), font = `600 ${size}px system-ui, "PingFang SC", sans-serif`;
  ctx.font = font; const w = Math.ceil(ctx.measureText(text).width) + 18; canvas.width = w; canvas.height = size + 14;
  ctx.font = font; ctx.textBaseline = "middle"; ctx.fillStyle = "rgba(6,12,18,.7)"; ctx.fillRect(0, 0, w, canvas.height); ctx.fillStyle = fill; ctx.fillText(text, 9, canvas.height / 2);
  const t = new THREE.CanvasTexture(canvas); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true })); s.scale.set(w / canvas.height * 14, 14, 1); s.renderOrder = 10; return s;
}
const disc = (r, color, opacity, y) => { const mesh = new THREE.Mesh(new THREE.CircleGeometry(r, 160), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false })); mesh.rotation.x = -Math.PI / 2; mesh.position.y = y; return mesh; };
const ring = (x, z, r, color, opacity, y, width = 1.6) => { const mesh = new THREE.Mesh(new THREE.RingGeometry(r - width, r, 160), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false })); mesh.rotation.x = -Math.PI / 2; mesh.position.set(x, y, z); return mesh; };
// Ground: the city as born, and the ring growth took in.
const born = disc(data.city.r0, 0x0c1a24, 1, -0.2), grownGround = disc(data.city.r, 0x09141c, 1, -0.3); world.add(grownGround, born);
const bornRing = ring(0, 0, data.city.r0, 0x7ce6ff, 0.45, 0.05, 2), grownRing = ring(0, 0, data.city.r, 0xffd36e, 0.55, 0.05, 2); world.add(bornRing, grownRing);
// Roads as flat strips, by level.
const ROAD = { arterial: 0x2c5f78, collector: 0x234c60, local: 0x1a3a4a };
function roadMesh(list) {
  const mesh = new THREE.InstancedMesh(box, new THREE.MeshBasicMaterial(), list.length);
  list.forEach((road, i) => { const dx = road.b[0] - road.a[0], dz = road.b[1] - road.a[1], length = Math.hypot(dx, dz); q.setFromAxisAngle(up, -Math.atan2(dz, dx)); m.compose(new THREE.Vector3((road.a[0] + road.b[0]) / 2, 0, (road.a[1] + road.b[1]) / 2), q, new THREE.Vector3(length, 0.2, road.width)); mesh.setMatrixAt(i, m); mesh.setColorAt(i, c.set(road.named ? 0xffd36e : ROAD[road.level])); });
  return mesh;
}
const roads = roadMesh(data.roads), bornRoads = roadMesh(data.bornRoads); world.add(roads, bornRoads);
// Generated buildings: boxes over each lot's footprint, coloured by height; named ones in gold.
function buildings(list, colorOf) {
  const mesh = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial({ transparent: true, opacity: 0.92 }), list.length);
  list.forEach((b, i) => { const h = b.floors * FLOOR; q.setFromAxisAngle(up, -b.angle); m.compose(new THREE.Vector3(b.x, h / 2, b.z), q, new THREE.Vector3(b.w, h, b.d)); mesh.setMatrixAt(i, m); mesh.setColorAt(i, colorOf(b)); });
  return mesh;
}
// Coloured by its landscape when the data says (landscape mocks), else by height.
const generated = buildings(data.buildings, (b) => (b.c ? c.set(b.c).multiplyScalar(0.55 + Math.min(1, b.floors / 40) * 0.45) : c.setHSL(0.55 - Math.min(1, b.floors / 40) * 0.12, 0.55, 0.32 + Math.min(1, b.floors / 40) * 0.3))), named = buildings(data.named, () => c.set(0xffc94a));
// Fields (farm lots) as flat ground, castle walls, and each landscape patch's outline.
for (const field of data.fields ?? []) { const shape = new THREE.Shape(field.pts.map(([x, z]) => new THREE.Vector2(x, -z))), mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: field.c })); mesh.rotation.x = -Math.PI / 2; mesh.position.y = 0.15; world.add(mesh); }
if (data.walls?.length) { const walls = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial({ color: 0xd8cfb8 }), data.walls.length); data.walls.forEach((wall, i) => { const dx = wall.b[0] - wall.a[0], dz = wall.b[1] - wall.a[1]; q.setFromAxisAngle(up, -Math.atan2(dz, dx)); m.compose(new THREE.Vector3((wall.a[0] + wall.b[0]) / 2, 6, (wall.a[1] + wall.b[1]) / 2), q, new THREE.Vector3(Math.hypot(dx, dz) + 1, 12, 2.5)); walls.setMatrixAt(i, m); }); world.add(walls); }
for (const outline of data.outlines ?? []) { const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(outline.pts.map(([x, z]) => new THREE.Vector3(x, 0.6, z))), new THREE.LineBasicMaterial({ color: outline.c, transparent: true, opacity: 0.9 })); world.add(line); const tag = label(outline.label, outline.c, 28); tag.position.set(outline.at[0], 18, outline.at[1]); world.add(tag); }
for (const step of (data.growth ?? []).slice(0, -1)) world.add(ring(0, 0, step.radius, 0x7ce6ff, 0.35, 0.08, 1.2));
world.add(generated, named);
for (const b of data.named) { const tag = label(b.name, "#ffd36e", 30); tag.position.set(b.x, b.floors * FLOOR + 10, b.z); world.add(tag); }
// Places inside the city: their circles, placed once at birth.
for (const place of data.places) { world.add(ring(place.x, place.z, place.r, 0x9dff8a, 0.7, 0.4, 2.2)); const tag = label(`${place.name} · ${typeof place.born === "number" ? `born ${place.born}` : place.born}`, "#c8ffc0", 32); tag.position.set(place.x, 30, place.z - place.r + 12); world.add(tag); }
// People with no stated start: where they came in.
for (const spawn of data.spawns) { const pawn = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 10, 16), new THREE.MeshBasicMaterial({ color: spawn.color })); pawn.position.set(spawn.door[0], 5, spawn.door[1]); world.add(pawn); const tag = label(spawn.name, spawn.color, 30); tag.position.set(spawn.door[0], 22, spawn.door[1]); world.add(tag); }
// The drift that reached the edge, and the growth it caused.
const drift = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff4d5e })); if (data.drift?.point) drift.position.set(data.drift.point[0], 6, data.drift.point[1]); world.add(drift);
const showGrowth = (on) => { grownGround.visible = grownRing.visible = drift.visible = roads.visible = on; bornRoads.visible = !on; for (const mesh of [generated]) mesh.count = on ? data.buildings.length : data.bornBuildings; };
showGrowth(true);
$("facts").innerHTML = data.growth ? `${data.counts.lots} lots, ${data.counts.buildings} buildings, ${data.counts.roads} roads in ${data.places.length} places, filled from their centres in ${data.counts.ms} ms. The city's circle: ${data.growth.map((step) => `${step.radius} m`).join(" → ")}.` : `${data.counts.lots} lots, ${data.counts.buildings} buildings, ${data.counts.roads} roads within ${Math.round(data.city.r)} m (born ${data.city.r0} m; grown once when a scene drifted past the edge). Generated in ${data.counts.ms} ms.`;
$("legend").innerHTML = data.legend.map((line) => `<li>${line}</li>`).join("");
for (const button of document.querySelectorAll("[data-view]")) button.addEventListener("click", () => { camera = button.dataset.view === "top" ? top : persp; for (const other of document.querySelectorAll("[data-view]")) other.setAttribute("aria-pressed", String(other === button)); });
let growthOn = true; $("grow").addEventListener("click", () => { growthOn = !growthOn; showGrowth(growthOn); });
const frames = () => new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
window.__stage = {
  async view({ mode = "top", growth = true, target = [0, 0], distance = null, yaw = 0.7, elevation = 0.6, half: size = null } = {}) {
    showGrowth(growth);
    if (mode === "top") { camera = top; const s = size ?? half, a = host.clientWidth / host.clientHeight; top.left = target[0] - s * a; top.right = target[0] + s * a; top.top = -target[1] + s; top.bottom = -target[1] - s; top.position.set(0, 1500, 0); top.updateProjectionMatrix(); }
    else { camera = persp; const d = distance ?? data.city.r * 1.6; controls.target.set(target[0], 0, target[1]); persp.position.set(target[0] + d * Math.cos(elevation) * Math.cos(yaw), d * Math.sin(elevation), target[1] + d * Math.cos(elevation) * Math.sin(yaw)); controls.update(); }
    await frames();
    return { width: host.clientWidth, height: host.clientHeight };
  },
};
function frame() { controls.update(); renderer.render(world, camera); requestAnimationFrame(frame); }
frame();
</script>
</body>
</html>
