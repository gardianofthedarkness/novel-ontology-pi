<!doctype html>
<html lang="en">
<head>

<title>Terrain · Live</title>
<style>

<body>
<canvas id="view"></canvas>
<div id="ui">
  <section class="panel" id="top">
    <div class="eyebrow">Terrain · live · your camera</div>
    <div id="status">Waiting for the terrain run…</div>
    <div class="buttons">
      <button class="go" id="next" disabled>Next step</button>
      <button id="run">Run on</button>
      <button id="look">Look from Jev</button>
      <button id="fit">Whole city</button>
      <span class="spacer"></span>
      <button id="fold">Fold panels</button>
    </div>
  </section>
  <div class="spacer"></div>
  <section id="bottom">
    <div class="panel" id="jev"><h3>What Jev sees and says</h3><div id="shots"></div><div id="question"></div><div id="answer"></div></div>
    <div class="panel" id="text"><h3>What Jev reads (the cards it looks at lit)</h3><div id="cards"></div></div>
  </section>
</div>
<div id="big"><img alt="Jev's picture"></div>
<script type="module">

// Buildings: one instanced mesh, grown as the world grows; new ones rise from the ground over a second and a half.

// The user's view: its own camera, the stream played as it comes, the proposal blinking, buildings rising, Jev's frustum.

  const show = (html, id) => { $(id).innerHTML = html; };
  let lines = 0, shots = [], lastCamera = null;
  const fitCity = (city) => { if (!city) return; camera.position.set(city.offset[0] - city.radius * 0.9, city.radius * 1.1, city.offset[1] + city.radius * 1.5); controls.target.set(city.offset[0], 0, city.offset[1]); };
  const frustum = (spec) => {
    clearGroup(groups.frusta);
    const cam = cameraOf(spec.camera, spec.frame[0] / spec.frame[1]);
    if (spec.camera.kind !== "top") { cam.far = Math.hypot(...spec.camera.position.map((v, i) => v - spec.camera.target[i])) * 1.2; cam.updateProjectionMatrix(); }
    const helper = new THREE.CameraHelper(cam); groups.frusta.add(helper); lastCamera = spec.camera;
  };
  const statusLine = (text) => show(text, "status");
  const handle = (event) => {
    apply(event);
    if (event.t === "run") statusLine(`Terrain for <b>${esc(event.cities.join(", "))}</b> <small>· ${event.model}</small>`);
    if (event.t === "city" && world.cities.size === 1) fitCity(event.city);
    if (event.t === "part") { state.part = event; statusLine(`<b>${esc(event.part.label)}</b> <small>(${esc(event.part.scale)}) · in ${esc(event.city)} · part ${event.n} of ${event.of}</small>`); show(event.cards.map((card) => `<div class="card k-${esc(card.kind)}${card.lit ? " lit" : ""}"><small>${esc(card.kind)}</small>${esc(card.text)}</div>`).join(""), "cards"); }
    if (event.t === "shot") { shots.push(event); frustum(event); }
    if (event.t === "ask") { const mine = shots.filter((shot) => event.shots.includes(shot.id)); show(mine.map((shot) => `<img src="terrain/${esc(shot.file)}?volume=${volume}" alt="${esc(shot.mode)}" data-full="terrain/${esc(shot.file)}?volume=${volume}">`).join(""), "shots"); show(event.questions.map((q) => `<div><b>${esc(q.key)}</b> · ${esc(q.instructions)}</div>`).join(""), "question"); show("<i>Jev is looking…</i>", "answer"); statusLine(`${state.part ? `<b>${esc(state.part.part.label)}</b> · ` : ""}<small>${esc(event.phase)}</small>`); }
    if (event.t === "answer") show(event.answers.map((a) => `${esc(a.key)}: <b>${esc(a.value)}</b>${a.confidence != null ? ` (${Number(a.confidence).toFixed(2)})` : ""}${a.top ? ` · ${a.top.map(([o, p]) => `${esc(o)} ${Math.round(p * 100)}%`).join(", ")}` : ""}${a.box ? ` · box ${["left", "top", "right", "bottom"].map((s) => a.box[s].toFixed(2)).join(" ")}` : ""}`).join("<br>"), "answer");
    if (event.t === "conflict") show(`${$("answer").innerHTML}<br><span style="color:var(--warn)">conflict: ${esc(event.reasons.join("; "))} → zoom in</span>`, "answer");
    if (event.t === "wait") { state.waiting = true; $("next").disabled = false; $("next").classList.add("waiting"); statusLine(`${state.part ? `<b>${esc(state.part.part.label)}</b> · ` : ""}waiting for you: <small>${esc(event.why)}</small>`); }
    if (event.t === "resume" || event.t === "commit") { state.waiting = false; $("next").classList.remove("waiting"); $("next").disabled = true; }
    if (event.t === "mode") { state.mode = event.mode; $("run").classList.toggle("on", event.mode === "run"); $("run").textContent = event.mode === "run" ? "Pause (step)" : "Run on"; }
    if (event.t === "done") { statusLine(`Terrain done: <b>${event.parts}</b> parts placed in ${event.cities} cities <small>· ${event.calls} questions</small>`); }
  };
  const poll = async () => {
    try {
      const response = await fetch(`terrain/stream.jsonl?volume=${volume}&from=${lines}`, { cache: "no-store" });
      if (response.ok) { const text = await response.text(); for (const line of text.split("\n").filter(Boolean)) { lines++; try { handle(JSON.parse(line)); } catch { /* a half-written line comes again */ lines--; break; } } }
    } catch { /* the next poll */ }
    setTimeout(poll, 1200);
  };
  poll();
  const send = (mode) => fetch(`terrain/step?volume=${volume}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode }) }).catch(() => {});
  $("next").addEventListener("click", () => { send("step"); $("next").classList.remove("waiting"); $("next").disabled = true; });
  $("run").addEventListener("click", () => send(state.mode === "run" ? "pause" : "run"));
  $("look").addEventListener("click", () => { if (!lastCamera) return; if (lastCamera.kind === "top") { camera.position.set(lastCamera.target[0], lastCamera.half * 2.2, lastCamera.target[2] + 1); controls.target.set(lastCamera.target[0], 0, lastCamera.target[2]); } else { camera.position.set(...lastCamera.position); controls.target.set(...lastCamera.target); } });
  $("fit").addEventListener("click", () => fitCity(state.part ? world.cities.get(state.part.cityId) : [...world.cities.values()][0]));
  $("fold").addEventListener("click", () => document.body.classList.toggle("collapsed"));
  $("shots").addEventListener("click", (event) => { const img = event.target.closest("img"); if (!img) return; $("big").querySelector("img").src = img.dataset.full; $("big").classList.add("show"); });
  $("big").addEventListener("click", () => $("big").classList.remove("show"));
}
</script>
</body>
</html>
